<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초5 ACE 진급시험 — 답안입력</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
:root{--brand:#8b6ee8;--brand2:#a385f0;--soft:#f0ebfe;--ink:#2f3138;--ink2:#6b6385;--ink3:#9a93b0;
--line:#ece8f5;--line2:#f4f1fb;--bg:#f7f5fb;--pos:#22a06b;--pos-s:#e4f6ee;--neg:#e5484d;--neg-s:#fdecec;
--warn:#d9822b;--warn-s:#fdf3e6;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.content{padding:24px 26px 100px;max-width:100%}
.h2{font-size:19px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:var(--ink3);font-weight:700;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;box-shadow:0 4px 18px rgba(80,70,120,.05)}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer}
.ghost:hover{background:var(--soft);color:var(--brand);border-color:transparent}
.mini{padding:5px 11px;font-size:12px;border-radius:8px}
.hint{color:var(--ink3);font-size:13px;font-weight:700}
.tag{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 9px}
.tag.manual{background:var(--warn-s);color:var(--warn)}
.tag.early{background:var(--pos-s);color:var(--pos)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:9px 16px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
.gwrap{overflow:auto;border:1px solid var(--line2);border-radius:12px;max-height:75vh}
/* 총점/레벨 탭은 가로 스크롤이 필요 없어서(폭에 맞춰 늘고 주는 표라)
   세로도 이 안에서 따로 안 긁고 페이지 자체가 스크롤되게 한다 —
   스크롤이 두 개(페이지+표) 생겨서 표 오른쪽 끝이 잘려 보이던 것 방지. */
.gwrap.flat{overflow:visible;max-height:none}
/* width:max-content였던 걸 100%로 바꿈 — max-content는 min-width:100%보다 우선 적용돼서
   표가 항상 '칸 최소 크기 합'으로만 그려졌다. 원무탭 iframe처럼 화면이 넓은 곳에 넣으면
   표는 그대로 작게 뭉쳐있고 옆에 빈 공간 + 불필요한 가로스크롤만 생겼다(분원 보고).
   width:100%만 쓰면 넓은 화면에선 칸이 비례해서 늘어나고, 화면이 좁아 칸 최소폭 합보다
   모자라면 그때만 .gwrap이 가로스크롤되는 정상적인 동작이 된다. */
table.g{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.g th,.g td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;text-align:center;white-space:nowrap}
.g th{background:#f6f3fc;color:var(--ink3);font-size:11px;font-weight:800;position:sticky;top:0;z-index:3;padding:7px 5px}
.g td.no,.g th.no{position:sticky;left:0;z-index:2;background:#fff;min-width:44px;font-weight:800;color:var(--ink3)}
.g th.no{z-index:4;background:#f6f3fc}
.g td.stu,.g th.stu{text-align:left;background:#fff;position:sticky;left:44px;min-width:150px;z-index:2;padding:8px 10px}
.g th.stu{z-index:4;background:#f6f3fc}
.g td.stu b{font-size:13.5px}.g td.stu .c{font-size:11px;color:var(--ink3);font-weight:700;margin-top:1px}
/* 분원·요일레벨·담임·학교학년 칸은 폭 지정이 없는 'auto' 칸이라, width:100%로 늘어난
   표의 남는 공간을 (정작 넓어져야 할 답안칸이 아니라) 이 칸들이 다 먹어버렸다
   — '화목 2부 · LSC2' 처럼 짧은 글자인데 145px까지 늘어나는 식. width:1%를 줘서
   auto-layout이 이 칸들은 '내용 최소폭'으로만 그리게 하고, 폭 지정이 없는 답안칸(qcell)이
   남는 공간을 대신 가져가게 한다 — 표를 가로로 균등하게 넓히는 표준 트릭. */
.g th.meta,.g td.meta{width:1%}
.g td.qcell input{width:100%;min-width:30px;max-width:64px;height:30px;border-radius:7px;text-align:center;padding:0;border:1px solid var(--line);font-weight:800;font:inherit;font-size:13px;outline:none}
.g td.qcell input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}
.g td.qcell.ok input{background:var(--pos-s);border-color:#9dd9bd;color:var(--pos)}
.g td.qcell.no input{background:var(--neg-s);border-color:#f0b6b8;color:var(--neg)}
.g td.lvl select{font:inherit;font-weight:800;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.g td.total{font-weight:800;color:var(--brand)}
.g td.meta{color:var(--ink2);font-weight:700}
.g td.bclr{background:var(--bc)}
.g tbody tr:hover td{background:#ebe3fa}
.g tbody tr:hover td.qcell:not(.ok):not(.no) input{background:#ebe3fa}
/* 총점/레벨 탭 전용 — <table>을 안 쓰고 CSS grid로 짠다.
   width:100%로 화면 폭에 맞게 늘었다 줄었다 하되, 분원/담임/학교학년처럼
   내용이 짧은 칸은 고정 px로 묶어서 같이 늘어나지 않게 하고, 점수 칸만
   minmax로 적당히(140~150px) 커지다 멈춘다. 그러고도 남는 폭은 맨 끝
   보이지 않는 스페이서 칸이 가져가서 표가 항상 화면 폭에 꽉 맞고
   가로 스크롤이 안 생긴다. 요일·레벨/담임은 실제 가장 긴 값
   ("월수금 3부 · B(1-3)_E5", "Stephanie 최지영")을 직접 재서 안 잘리게 잡았다. */
.ttgrid{display:grid;width:100%;grid-template-columns:30px 44px 44px 130px 84px 150px 120px 118px minmax(84px,140px) minmax(84px,140px) minmax(84px,140px) minmax(96px,150px) minmax(96px,150px) 108px minmax(0,1fr)}
/* .ttgrid>div(자식 결합자)는 안 된다 — .ttrow가 display:contents라
   실제 DOM에선 이 칸들이 .ttgrid의 '자식'이 아니라 '손자'라서 안 걸린다.
   그래서 셀마다 .gcell 클래스를 따로 붙이고 거리 상관없는 .ttgrid .gcell로 건다. */
.ttgrid .gcell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:8px 6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;overflow:hidden}
.ttgrid .gh{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:13.5px;font-weight:800;position:sticky;top:0;z-index:3;flex-direction:column;gap:3px}
.ttgrid .gh select{font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 2px;width:100%}
.ttgrid .idx{color:var(--ink3);font-weight:800}
.ttgrid .rank{font-weight:800;color:var(--brand)}
.ttgrid .name{justify-content:flex-start;text-align:left;padding:8px 10px}
.ttgrid .name .nmwrap{overflow:hidden;text-overflow:ellipsis}
.ttgrid .name b{font-size:13.5px}
.ttgrid .name .c{font-size:11px;color:var(--ink3);font-weight:700;margin-top:1px}
.ttgrid .info{color:var(--ink2);font-weight:700;white-space:nowrap;text-overflow:ellipsis}
.ttgrid .score{font-size:14.5px}
.ttgrid .score.big{font-size:16px;font-weight:800;color:var(--brand)}
.ttgrid .lvl select,.ttgrid .score select{font:inherit;font-weight:800;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 4px;width:100%}
.ttgrid .bclr{background:var(--bc)}
.ttgrid .spacer{background:transparent;border:none}
.ttgrid>.spacer{position:sticky;top:0;z-index:3}
.ttrow{display:contents}
.ttrow:hover>div{background:#ebe3fa}
.addrow-card{background:#fffaf0;border:1px dashed #e8d5a8}
.addrow-card input,.addrow-card select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-right:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2a2440;color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#c0392b}
</style>

     (손으로 옮겨적으면 오타 위험이라 파일 자체를 그대로 불러온다). LEVEL_STEPS/ROADMAP_TABLE
     이름이 이 파일 다른 변수랑 안 겹쳐서 그대로 로드해도 안전하다. VOCAB_ITEMS/TRANS_ITEMS처럼

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ok){const el=document.createElement('div');el.className='toast show'+(ok===false?' err':'');el.textContent=m;document.body.appendChild(el);setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},2600);}

async function fetchAll(table, cols, filt){
  const PAGE=1000; let from=0, out=[];
  while(true){
    let q=sb.from(table).select(cols).range(from,from+PAGE-1);
    if(filt)q=filt(q);
    const{data,error}=await q;
    if(error)throw error;
    const chunk=data||[]; out=out.concat(chunk);
    if(chunk.length<PAGE)break; from+=PAGE;
  }
  return out;
}

function levelAlpha(cn){const m=String(cn||'').match(/^\s*\[?\s*([A-Za-z]+)/);return m?m[1].toUpperCase():'';}
function isChess(cn){return /^(IS|DS|LS|MS)/.test(levelAlpha(cn));}
function gradeKey(g){g=String(g||'').trim();let m;if(m=g.match(/중\s*등?\s*(\d)/))return '중'+m[1];if(m=g.match(/초\s*등?\s*(\d)/))return '초'+m[1];if(m=g.match(/고\s*(\d)/))return '고'+m[1];if(m=g.match(/^(\d)$/))return '초'+m[1];return g;}
function classDetail(cn){return String(cn||'').replace(/^\s*\[[^\]\/]*\]?\s*/,'').trim()||cn;}

   분원id를 해시해서 고르면 분원 수가 적을 때(지금 7개) 팔레트 8개 안에서

   팔레트를 하나씩 순서대로 배정한다 — 겹칠 일이 없다. */
const BRANCH_PALETTE = ['#fdeef0','#eef5fd','#fdf7e0','#eafaf0','#f4eefd','#fdf0e3','#e9fbf6','#f7eef7','#eef9fd','#fdeef7'];
let BRANCH_COLOR_MAP={};
function assignBranchColors(){
  BRANCH_COLOR_MAP={};
  const ids=Object.keys(BRANCHES).sort((a,c)=>String(BRANCHES[a]).localeCompare(String(BRANCHES[c]),'ko'));
  ids.forEach((id,i)=>{ BRANCH_COLOR_MAP[id]=BRANCH_PALETTE[i%BRANCH_PALETTE.length]; });
}
function branchColor(branchId){ return branchId ? (BRANCH_COLOR_MAP[branchId]||'') : ''; }

function getSuggestedLevel(score){
  const s=Number(score);
  if(Number.isNaN(s))return '미배정';
  if(s>=66)return 'A1';
  if(s>=54)return 'PA2';
  if(s>=41)return 'PA1';
  if(s>=30)return 'HB';
  return '미배정';
}

function highlightReportRow(){
  const row=ROWS.find(r=>r.code===REPORT_CODE);
  if(!row) return;
  setTimeout(()=>{
    const el=document.querySelector(`.ttrow[data-code="${CSS.escape(REPORT_CODE)}"]`);
    if(!el) return;
    el.scrollIntoView({block:'center'});
    el.style.outline='3px solid var(--brand)';
    el.style.outlineOffset='-2px';
  },0);
}

/* 학기 구분 없이 'active'만 보면 예전 학기에 정리 안 된 찌꺼기 기록까지 섞인다.
   현재 활동 중인 학기 = active 레코드가 가장 많은 학기로 판단(다른 화면들과 동일 방식). */
async function resolveCurrentSemester(){
  if(SEM) return; // URL로 특정 학기를 넘겨받았으면 그걸 그대로 씀
  const all = await fetchAll('semester_records','semester_id,status');
  const m={}; all.forEach(r=>{ if(r.status==='active') m[r.semester_id]=(m[r.semester_id]||0)+1; });
  const ids=Object.keys(m).sort((a,c)=>m[c]-m[a]);
  SEM = ids[0] || null;
}

async function loadRoster(){
  const data = await fetchAll('semester_records','student_id,branch_id,semester_id,class_name,class_label,status,kind,teacher',
    q=>{ q=q.eq('status','active'); if(SEM) q=q.eq('semester_id',SEM); if(BRANCH) q=q.eq('branch_id',BRANCH); return q; });

  const rows = (data||[])
    .filter(r=>(r.kind||'regular')!=='exam')
    .map(r=>{
      const s=STUDENTS[r.student_id]||{};
      /* 얼리버드 = 현재 에이스 B레벨 반(levelAlpha==='B'). A1/A2처럼 원래부터
         에이스인 학생은 안 들어가야 하고, 체스→에이스 조기 이관생(B레벨)은
         들어가야 한다는 분원 확인 — 직전 학기 체스 이력으로 판정했더니
         이번 학기에 바로 B레벨로 들어온 신입생(이력 없음)이 빠졌었다. */
      const early = !isChess(r.class_name) && levelAlpha(r.class_name)==='B';
      return {
        id:'r_'+r.student_id+'_'+r.semester_id,
        studentId:r.student_id, code:s.code||'', name:s.name||'',
        school:s.school||'', grade:s.grade||'',
        branchId:r.branch_id, branchName:BRANCHES[r.branch_id]||'',
        className:r.class_name||'', classLabel:r.class_label||r.class_name||'',
        teacher:r.teacher||'', manual:false, early,
        obj:{}, vocab:{}, trans:{}, finalLevel:''
      };
    })
    .filter(r=>gradeKey(r.grade)==='초5' && (isChess(r.className) || r.early))
    .filter(r=>!TEACHER || String(r.teacher||'').split(/[,\/]/).some(t=>t.trim()===TEACHER));
  // 같은 학생이 여러 학기 기록으로 중복되면 하나만
  const seen=new Set(); ROWS=[];
  rows.forEach(r=>{ if(seen.has(r.studentId))return; seen.add(r.studentId); ROWS.push(r); });
  ROWS.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
}

  try{ await loadRoster(); await loadSavedGrades(); } catch(e){ toast('명단 로드 실패: '+(e.message||e), false); }
  render();
}
function addManualRow(){
  const name=prompt('비재원생 이름을 입력하세요'); if(!name)return;
  const school=prompt('학교(선택, 없으면 취소 없이 빈칸)')||'';
  ROWS.push({
    /* crypto.randomUUID로 고정 id를 만들어야 저장 후 새로고침해도 같은 학생으로
       이어서 불러온다 — 번호(MANUAL_SEQ)로 만들면 새로고침마다 1번부터 다시
       매겨져서 저장된 답안이랑 연결이 끊긴다. */
    id:'manual_'+crypto.randomUUID(), studentId:null, code:'', name, school, grade:'초등5',
    branchId:BRANCH||'', branchName:BRANCHES[BRANCH]||'', className:'(비재원생)', classLabel:'(비재원생)',
    teacher:'', manual:true, obj:{}, vocab:{}, trans:{}, finalLevel:''
  });
  render();
}
function removeRow(id){
  if(!confirm('이 줄을 지울까요? 저장했던 답안이 있으면 같이 지워져요'))return;
  ROWS=ROWS.filter(r=>r.id!==id);
  if(!TABLE_MISSING) sb.from('ace_e5_exam_results').delete().eq('id',id).then(()=>{});
  render();
}

/* ---------------- 저장/불러오기 (ace_e5_exam_results) ---------------- */
async function loadSavedGrades(){
  TABLE_MISSING=false;
  let data;
  try{
    data = await fetchAll('ace_e5_exam_results','*',
      q=>{ q=q.eq('semester_id',SEM); if(BRANCH) q=q.eq('branch_id',BRANCH); return q; });
  }catch(e){
    TABLE_MISSING=true; // sql/ace_e5_exam.sql을 아직 안 돌린 상태 — 저장 막고 배너만 띄운다
    return;
  }
  const byId={}; (data||[]).forEach(rec=>byId[rec.id]=rec);
  const matched=new Set();
  ROWS.forEach(r=>{
    const rec=byId[r.id]; if(!rec)return;
    matched.add(r.id);
    r.obj=rec.obj_answers||{}; r.vocab=rec.vocab_answers||{}; r.trans=rec.trans_scores||{};
    r.finalLevel=rec.final_level||'';
  });
  // 비재원생(수동 추가) 저장분은 명단 조회에 안 잡히니 저장된 걸로 다시 만든다
  (data||[]).forEach(rec=>{
    if(matched.has(rec.id) || !rec.manual) return;
    ROWS.push({
      id:rec.id, studentId:rec.student_id, code:rec.student_code||'', name:rec.student_name||'',
      school:rec.school||'', grade:rec.grade||'초등5',
      branchId:rec.branch_id||'', branchName:BRANCHES[rec.branch_id]||'',
      className:rec.class_name||'(비재원생)', classLabel:rec.class_name||'(비재원생)',
      teacher:rec.teacher||'', manual:true,
      obj:rec.obj_answers||{}, vocab:rec.vocab_answers||{}, trans:rec.trans_scores||{},
      finalLevel:rec.final_level||''
    });
  });
  ROWS.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
}

  if(TABLE_MISSING){ toast('저장 표가 아직 없어요 — sql/ace_e5_exam.sql을 먼저 돌려주세요', false); return; }
  if(!ROWS.length){ toast('저장할 학생이 없어요', false); return; }
  SAVING=true; render();
  const now=new Date().toISOString();
  /* 점수(obj_score/vocab_score/trans_score)도 같이 계산해서 저장한다 — ACE 이관생
     화면(inwon-app)이 정답지 없이도 이 점수만 읽어서 쓸 수 있게. 정답지는 여기
     한 곳에만 두고, 점수는 저장할 때 미리 계산해서 넘겨주는 식으로 양쪽이
     서로 다른 정답지를 들고 있게 되는 걸 막는다. */
  const payload=ROWS.map(r=>({
    id:r.id, semester_id:SEM, branch_id:r.branchId||null, student_id:r.studentId||null,
    student_code:r.code||null, student_name:r.name, school:r.school||null, grade:r.grade||null,
    class_name:r.classLabel||r.className||null, teacher:r.teacher||null, manual:!!r.manual,
    obj_answers:r.obj||{}, vocab_answers:r.vocab||{}, trans_scores:r.trans||{},
    obj_score:objScore(r), vocab_score:vocabScore(r), trans_score:transScore(r),
    final_level:r.finalLevel||null, updated_at:now
  }));
  const{error}=await sb.from('ace_e5_exam_results').upsert(payload,{onConflict:'id'});
  SAVING=false;
  if(error){ toast('저장 실패: '+error.message, false); render(); return; }
  LAST_SAVED=new Date().toLocaleString('ko-KR',{hour12:false});
  toast(`${payload.length}명 저장됨 ✓`);
  render();
}

/* ---------------- 채점 ---------------- */
function objScore(row){
  let earned=0;
  E5_EXAM.forEach(q=>{ if(String(row.obj[q.no]||'')===String(q.ans)) earned+=q.score; });
  return earned;
}
function objMax(){ return E5_EXAM.reduce((s,q)=>s+q.score,0); }
function vocabScore(row){ return VOCAB_ITEMS.reduce((s,it)=> s + (String(row.vocab[it.no]||'')==='1' ? 1 : 0), 0); }
function vocabMax(){ return VOCAB_ITEMS.length; }
function transScore(row){ return TRANS_ITEMS.reduce((s,it)=> s + (Number(row.trans[it.no])||0), 0); }
function transMax(){ return TRANS_ITEMS.reduce((s,it)=>s+(it.max||0),0); }

function buildTable(){

function buildObjTable(){
  const head = `<thead><tr>${studentHeadCells()}${E5_EXAM.map(q=>`<th>${q.no}</th>`).join('')}<th>점수</th></tr></thead>`;
  const cols = E5_EXAM.length;
  const body = ROWS.map((r,i)=>{
    const cells = E5_EXAM.map((q,ci)=>{
      const v=r.obj[q.no]||'';
      const cls = v==='' ? '' : (String(v)===String(q.ans) ? 'ok' : 'no');
      return `<td class="qcell ${cls}"><input maxlength="1" inputmode="numeric" value="${esc(v)}"
        data-r="${i}" data-c="${ci}" onkeydown="navKey(event,this,${cols})"
        oninput="onObjInput('${r.id}',${q.no},this.value,this)"></td>`;
    }).join('');
    return `<tr>${studentRowCells(r,i)}${cells}<td class="total" id="objScore-${r.id}">${objScore(r)}/${objMax()}</td></tr>`;
  }).join('');
  return head+`<tbody>${body}</tbody>`;
}
function buildVocabTable(){
  const head = `<thead><tr>${studentHeadCells()}${VOCAB_ITEMS.map(it=>`<th>${it.no}<br>${esc(it.word)}</th>`).join('')}<th>점수</th></tr></thead>`;
  const cols = VOCAB_ITEMS.length;
  const body = ROWS.map((r,i)=>{
    const cells = VOCAB_ITEMS.map((it,ci)=>{

      return `<td class="qcell ${cls}"><input maxlength="1" inputmode="numeric" value="${esc(v)}"
        data-r="${i}" data-c="${ci}" onkeydown="navKey(event,this,${cols})"
        oninput="onVocabInput('${r.id}',${it.no},this.value,this)"></td>`;
    }).join('');
    return `<tr>${studentRowCells(r,i)}${cells}<td class="total" id="vocabScore-${r.id}">${vocabScore(r)}/${vocabMax()}</td></tr>`;

function buildTransTable(){
  const head = `<thead><tr>${studentHeadCells()}${TRANS_ITEMS.map(it=>`<th>${it.no}<br>/${it.max}</th>`).join('')}<th>점수</th></tr></thead>`;
  const cols = TRANS_ITEMS.length;
  const body = ROWS.map((r,i)=>{
    const cells = TRANS_ITEMS.map((it,ci)=>{
      const v=r.trans[it.no]||'';
      return `<td class="qcell"><input maxlength="2" inputmode="numeric" value="${esc(v)}"
        data-r="${i}" data-c="${ci}" onkeydown="navKey(event,this,${cols})"
        oninput="onTransInput('${r.id}',${it.no},this.value,${it.max},this)"></td>`;
    }).join('');
    return `<tr>${studentRowCells(r,i)}${cells}<td class="total" id="transScore-${r.id}">${transScore(r)}/${transMax()}</td></tr>`;
  }).join('');
  return head+`<tbody>${body}</tbody>`;
}
/* 등수 = 객관식 점수 기준(단어·해석은 참고용이라 레벨에도 등수에도 안 들어감).
   동점은 같은 등수, 다음 등수는 동점자 수만큼 건너뛴다(공동1등 다음은 3등). */
function computeRanks(){
  const scored=ROWS.map(r=>({id:r.id,score:objScore(r)})).sort((a,b)=>b.score-a.score);
  const rankMap={}; let rank=0, prevScore=null, seen=0;
  scored.forEach(s=>{ seen++; if(s.score!==prevScore){ rank=seen; prevScore=s.score; } rankMap[s.id]=rank; });
  return rankMap;
}
function onLevelFilterChange(v){ LEVEL_FILTER=v; render(); }
function toggleSelect(id,checked){ if(checked) SELECTED.add(id); else SELECTED.delete(id); render(); }
function visibleRowsForFilter(){
  return ROWS.filter(r=>!LEVEL_FILTER || getSuggestedLevel(objScore(r))===LEVEL_FILTER);
}
function selectAllVisible(){ visibleRowsForFilter().forEach(r=>SELECTED.add(r.id)); render(); }
function clearSelection(){ SELECTED.clear(); render(); }
function applyBulkLevel(){
  const sel=document.getElementById('bulkLevelSel'); const v=sel?sel.value:'';
  if(!v){ toast('바꿀 레벨을 먼저 골라주세요', false); return; }
  if(!SELECTED.size){ toast('선택된 학생이 없어요', false); return; }
  ROWS.forEach(r=>{ if(SELECTED.has(r.id)) r.finalLevel=v; });
  toast(`${SELECTED.size}명 최종레벨 → ${v}로 한번에 바꿨어요`);
  SELECTED.clear();
  render();
}
/* <table>이 아니라 CSS grid(.ttgrid)로 짠다 — grid-template-columns는
   고정 칸(분원/담임 등)은 화면이 넓어져도 그대로 두고, 점수 칸만
   minmax(...,1fr)로 남는 폭을 가져가게 할 수 있어서 table-layout:fixed의
   "다 같이 비례해서 늘어나는" 문제가 없다. */
function buildTotalGrid(){
  const oMax=objMax(), tMax=transMax();
  const rankMap=computeRanks();
  const filterOpts = LEVEL_OPTIONS.map(lv=>`<option value="${lv}" ${LEVEL_FILTER===lv?'selected':''}>${lv}</option>`).join('');
  const head = `
    <div class="gcell gh chk"></div>
    <div class="gcell gh">번호</div>
    <div class="gcell gh">등수</div>
    <div class="gcell gh">이름(회원코드)</div>
    <div class="gcell gh">분원</div>
    <div class="gcell gh">요일 · 레벨</div>
    <div class="gcell gh">담임</div>
    <div class="gcell gh">학교/학년</div>
    <div class="gcell gh">객관식<br>/${oMax}</div>
    <div class="gcell gh">단어<br>/${VOCAB_ITEMS.length}</div>
    <div class="gcell gh">해석<br>/${tMax}</div>
    <div class="gcell gh">임시레벨<select onchange="onLevelFilterChange(this.value)"><option value="">전체</option>${filterOpts}</select></div>
    <div class="gcell gh">최종레벨</div>

    <div class="gcell spacer"></div>`;
  let shown=0;
  const body = ROWS.map(r=>{
    const os=objScore(r), vs=vocabScore(r), ts=transScore(r);
    const suggested=getSuggestedLevel(os);
    if(!r.finalLevel) r.finalLevel = suggested;
    if(LEVEL_FILTER && suggested!==LEVEL_FILTER) return '';
    shown++;
    const bc=branchColor(r.branchId); const bs=bc?` style=\"--bc:${bc}\"`:'';
    const opts = LEVEL_OPTIONS.map(lv=>`<option value="${lv}" ${r.finalLevel===lv?'selected':''}>${lv}</option>`).join('');
    const checked = SELECTED.has(r.id)?'checked':'';
    return `<div class="ttrow" data-code="${esc(r.code||'')}"${bs}>
      <div class="gcell chk"><input type="checkbox" ${checked} onchange="toggleSelect('${r.id}',this.checked)"></div>
      <div class="gcell idx">${shown}</div>
      <div class="gcell rank">${rankMap[r.id]}</div>
      <div class="gcell name"><div class="nmwrap"><b>${esc(r.name)}</b>${r.manual?' <span class=\"tag manual\">비재원</span>':''}${r.early?' <span class=\"tag early\">얼리버드</span>':''}<div class="c">${esc(r.code||'')}</div></div></div>
      <div class="gcell info bclr">${esc(r.branchName)}</div>
      <div class="gcell info bclr">${esc(classDetail(r.classLabel))}</div>
      <div class="gcell info bclr">${esc(r.teacher)}</div>
      <div class="gcell info bclr">${esc(r.school)} ${esc(gradeKey(r.grade))}</div>
      <div class="gcell score big">${os}</div>
      <div class="gcell score">${vs}</div>
      <div class="gcell score">${ts}</div>
      <div class="gcell score big">${suggested}</div>
      <div class="gcell lvl"><select onchange="onLevelChange('${r.id}',this.value)">${opts}</select></div>
      <div class="gcell"><button class="ghost mini" onclick="openReportCard('${r.id}')">성적표</button></div>
      <div class="gcell spacer"></div>
    </div>`;
  }).join('');
  return `<div class="ttgrid">${head}${body}</div>`;
}

/* 방향키로 옆칸/위아래 칸 이동 (grader.html의 navKey와 동일한 방식) —
   한 줄 다 입력하고 오른쪽 끝에서 더 가면 다음 줄 맨 앞으로 넘어간다. */
function navKey(e,inp,cols){
  const r=+inp.dataset.r,c=+inp.dataset.c; let tr=r,tc=c;
  if(e.key==='ArrowRight'||e.key==='Enter')tc++;
  else if(e.key==='ArrowLeft')tc--;
  else if(e.key==='ArrowDown')tr++;
  else if(e.key==='ArrowUp')tr--;
  else return;
  e.preventDefault();
  if(tc<0){tc=cols-1;tr--;} if(tc>=cols){tc=0;tr++;}
  const nx=document.querySelector(`input[data-r="${tr}"][data-c="${tc}"]`);
  if(nx){nx.focus();nx.select();}
}
function findRow(id){ return ROWS.find(r=>r.id===id); }
/* 입력할 때마다 표 전체를 다시 그리면 입력칸 포커스가 날아가서, 지금 입력한
   칸의 정/오답 배경색만 바로 바꿔준다(td.classList만 건드리고 다른 건 안 그림). */
function onObjInput(id,no,v,inp){
  const r=findRow(id); if(!r)return; v=v.trim(); r.obj[no]=v;
  const q=E5_EXAM.find(x=>x.no===no);
  const td=inp.closest('td'); td.classList.remove('ok','no');
  if(v!=='') td.classList.add(String(v)===String(q.ans)?'ok':'no');
  /* 표 전체를 다시 그리면 입력 포커스가 날아가서, 점수칸 하나만 찾아 직접 갱신한다
     (ok/no 배경색을 바로 바꿔주는 것과 같은 이유). */
  const sc=document.getElementById('objScore-'+id);
  if(sc) sc.textContent = objScore(r)+'/'+objMax();
}
function onVocabInput(id,no,v,inp){
  const r=findRow(id); if(!r)return; v=v.trim(); r.vocab[no]=v;
  const td=inp.closest('td'); td.classList.remove('ok','no');
  if(v==='1') td.classList.add('ok'); else if(v==='0') td.classList.add('no');
  const sc=document.getElementById('vocabScore-'+id);
  if(sc) sc.textContent = vocabScore(r)+'/'+vocabMax();
}
function onTransInput(id,no,v,max,inp){
  const r=findRow(id); if(!r)return; let n=parseInt(v,10); if(isNaN(n))n=''; else n=Math.max(0,Math.min(max,n)); r.trans[no]=n;
  /* 데이터는 이미 클램프됐지만 입력칸 글자는 그대로라, 배점(6점)보다 큰 수(7 등)를
     쳐도 칸엔 7이 남아 보여서 '왜 막히지도 않냐'는 혼란을 줬다. 클램프한 값을
     칸에도 그대로 되돌려써서 화면에서도 바로 배점을 넘길 수 없게 한다. */
  if(inp) inp.value = (n==='') ? '' : String(n);
  const sc=document.getElementById('transScore-'+id);
  if(sc) sc.textContent = transScore(r)+'/'+transMax();
}
function onLevelChange(id,v){ const r=findRow(id); if(!r)return; r.finalLevel=v; }

/* ============================================================================
   성적표 — 레벨테스트(leveltest/common.js·general.js)가 쓰는 성적표를 그대로 가져온다.
   파일을 통째로 불러오지 않는 이유: 거기도 VOCAB_ITEMS/TRANS_ITEMS를 같은 이름으로
   선언해서, 이 파일 걸 덮어쓰려다 "이미 선언된 이름" 에러로 화면이 통째로 죽는다.
   그래서 성적표를 "그리는" 함수들만 여기로 옮겨 적었다(점수 집계는 DOM이 아니라
   이 화면의 ROWS 데이터에서 직접 만든다 — evaluateExam/evaluateVTExam은 원래
   document.getElementById로 입력칸을 읽는데, 여기는 입력칸이 이미 r.obj/r.vocab/r.trans에
   들어있어서 그걸 그대로 쓴다). 레벨테스트 쪽 원본을 고치면 여기는 저절로 안 따라오니,
   만약 성적표 디자인 자체를 바꾸게 되면 거기도 같이 고쳐야 한다. */
function percent(value,total){ if(!total) return 0; return Math.round((value/total)*100); }
function todayIso(){ return new Date().toISOString().slice(0,10); }
function formatDate(dateText){ return dateText || todayIso(); }
function getDisplayLevel(assignedLevel){ return assignedLevel || "미배정"; }
function aggregateBy(results,key){
  const map={};
  results.forEach(q=>{ if(!map[q[key]]) map[q[key]]={label:q[key],earned:0,possible:0,count:0};
    map[q[key]].earned+=q.earned; map[q[key]].possible+=q.score; map[q[key]].count+=1; });
  return Object.values(map).map(v=>({...v,rate:percent(v.earned,v.possible)})).sort((a,b)=>b.possible-a.possible);
}
function getTopFive(data){ return data.slice(0,5); }
function getTermInfo(testDate){
  const d=new Date(testDate); const y=d.getFullYear()||new Date().getFullYear(); const m=(d.getMonth()+1)||1;
  if(m===12||m<=2) return {year:y,term:'1st'};
  if(m>=3&&m<=5) return {year:y,term:'2nd'};
  if(m>=6&&m<=8) return {year:y,term:'3rd'};
  return {year:y,term:'4th'};
}
function getRoadmapStamp(testDate){ const info=getTermInfo(testDate); return `${info.year}  ${info.term}`; }
function getRoadmapGradePrefix(grade){
  const map={"초등6":"초6","중등1":"중1","중등2":"중2","중등3":"중3"};
  return map[grade]||"";
}
function getRoadmapTimelineLabels(grade,currentLevel,testDate){
  if(typeof LEVEL_STEPS==="undefined"||typeof ROADMAP_TABLE==="undefined") return [];
  const steps=LEVEL_STEPS[grade]||[]; if(!steps.length) return [];
  const prefix=getRoadmapGradePrefix(grade); const term=getTermInfo(testDate).term;
  const effectiveLevel=steps.includes(currentLevel)?currentLevel:steps[0];

}
/* 초5가 E6 시험을 보면(여기가 바로 그 경우) 로드맵은 '초등6' 트랙으로 봐야 한다 —

function getReportGradeForExam(studentGrade,examName){

function buildRoadmapBars(grade,currentLevel="",testDate=todayIso(),title=""){
  if(typeof LEVEL_STEPS==="undefined") return "";

  }).join('')}</div>`;
}
function donutSvg(rate,label,size=118,stroke=16,color="#13a6ee"){
  const r=(size-stroke)/2; const c=2*Math.PI*r; const dash=(rate/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${dash} ${c-dash}" transform="rotate(-90 ${size/2} ${size/2})"/>
      <circle cx="${size/2}" cy="${size/2}" r="${Math.max(r-14,8)}" fill="#fff"/>
      <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" font-size="18" font-weight="800" fill="#334155">${rate}%</text>
    </svg>`;
}
function radarSvg(items,title){
  const size=176,center=88,radius=50; const levels=[20,40,60,80,100]; const angleStep=(Math.PI*2)/items.length;
  function pt(rate,i,scale=1){ const ang=-Math.PI/2+angleStep*i; const rr=radius*scale*(rate/100); return [center+Math.cos(ang)*rr, center+Math.sin(ang)*rr]; }
  const polys=levels.map(l=>items.map((_,i)=>pt(l,i,1)).map(p=>p.join(",")).join(" "));
  const dataPts=items.map((it,i)=>pt(it.rate,i)).map(p=>p.join(",")).join(" ");
  const axes=items.map((it,i)=>{ const p=pt(100,i,1.05); return `<line x1="${center}" y1="${center}" x2="${p[0]}" y2="${p[1]}" stroke="#cbd5e1" stroke-width="1"/>`; }).join("");
  const labels=items.map((it,i)=>{ const p=pt(100,i,1.22);
    return `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#475569">${it.label.replace(/영역/g,'')}</text>
            <text x="${p[0]}" y="${p[1]+16}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="800" fill="#0284c7">${it.rate}%</text>`; }).join("");
  return `<div class="chart-card"><div class="chart-title">${title}</div>
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        ${polys.map((poly,idx)=>`<polygon points="${poly}" fill="none" stroke="${idx===levels.length-1?'#94a3b8':'#dbe4ee'}" stroke-width="${idx===levels.length-1?2:1}" stroke-dasharray="${idx===levels.length-1?'4 4':'0'}"/>`).join('')}
        ${axes}
        <polygon points="${dataPts}" fill="rgba(19,166,238,.55)" stroke="#13a6ee" stroke-width="2"/>
        ${items.map((it,i)=>{ const p=pt(it.rate,i); return `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0ea5e9"/>`; }).join('')}
        ${labels}
      </svg></div>`;
}
function getPaperGradeLabel(no){
  if(no>=1&&no<=4) return '예비중1 영역'; if(no>=5&&no<=8) return '중1 영역'; if(no>=9&&no<=12) return '중2 영역';
  if(no>=13&&no<=16) return '중3 영역'; if(no>=17&&no<=20) return '예비고1 영역'; if(no>=21&&no<=24) return '예비중1 영역';
  if(no>=25&&no<=28) return '중1 영역'; if(no>=29&&no<=32) return '중2 영역'; if(no>=33&&no<=36) return '중3 영역';
  if(no>=37&&no<=40) return '예비고1 영역'; return '-';
}
function computePaperGradeStats(results){
  const rows=['예비중1 영역','중1 영역','중2 영역','중3 영역','예비고1 영역'];
  const init=()=>Object.fromEntries(rows.map(label=>[label,{earned:0,possible:0,rate:0}]));
  const listening=init(), reading=init(), total=init();
  results.forEach(q=>{ const label=getPaperGradeLabel(q.no); if(!label||label==='-') return;
    const target=q.area==='LC'?listening:reading;
    target[label].earned+=q.earned||0; target[label].possible+=q.score||0;
    total[label].earned+=q.earned||0; total[label].possible+=q.score||0; });
  rows.forEach(label=>{ listening[label].rate=percent(listening[label].earned,listening[label].possible);
    reading[label].rate=percent(reading[label].earned,reading[label].possible);
    total[label].rate=percent(total[label].earned,total[label].possible); });
  return {labels:rows,listening,reading,total};
}

function buildExamEvaluation(row){
  const results=E5_EXAM.map(q=>{ const user=String(row.obj[q.no]||''); const correct=user===String(q.ans); return {...q,user,correct,earned:correct?q.score:0}; });
  const total=results.reduce((a,b)=>a+b.earned,0);

    const items=results.filter(q=>q.area===area);
    const possible=items.reduce((a,b)=>a+b.score,0), earned=items.reduce((a,b)=>a+b.earned,0);
    return [area,{earned,possible,rate:percent(earned,possible),correct:items.filter(i=>i.correct).map(i=>i.no),wrong:items.filter(i=>!i.correct).map(i=>i.no)}];
  }));

function getVocabLetter(rate){ if(rate>=80) return 'A'; if(rate>=40) return 'B'; return 'C'; }
function buildVTEvaluation(row){
  const vocabGroupsOrder=["초3~4","초5~6","중1","중2","중3","고1","고2","고3"];
  const vocabResults=VOCAB_ITEMS.map(item=>{ const raw=String(row.vocab[item.no]||''); const correct=raw==='1'; return {...item,user:raw,correct,earned:correct?1:0,possible:1}; });
  const vocabGroups=vocabGroupsOrder.map(label=>{
    const items=vocabResults.filter(item=>item.gradeGroup===label);
    const earned=items.reduce((s,i)=>s+i.earned,0), possible=items.reduce((s,i)=>s+i.possible,0);
    const rate=percent(earned,possible); const letter=getVocabLetter(rate);
    return {label,earned,possible,rate,letter,comment:VOCAB_GROUP_COMMENTS[label]?.[letter]||''};
  });
  const vocabTotal={earned:vocabGroups.reduce((s,g)=>s+g.earned,0),possible:vocabGroups.reduce((s,g)=>s+g.possible,0)};
  vocabTotal.rate=percent(vocabTotal.earned,vocabTotal.possible);
  const transResults=TRANS_ITEMS.map(item=>{
    const raw=row.trans[item.no]; const score=(raw===''||raw==null||isNaN(Number(raw)))?0:Number(raw);
    return {...item,earned:score,rate:percent(score,item.max)};
  });
  const transTotal=transResults.reduce((s,i)=>s+i.earned,0), transPossible=transResults.reduce((s,i)=>s+i.max,0);
  return {vocabResults,vocabGroups,vocabTotal,vocabPossible:vocabTotal.possible,transResults,transTotal,transPossible};
}
/* "성적표" 버튼 — 채점 중이던 화면(총점/레벨 탭)은 그대로 두고 새 탭에서 띄운다.
   레벨테스트 쪽 style.css를 그대로 끌어다 써서(링크만) 인쇄 레이아웃까지 똑같이 나온다.
   title을 'E6'로 두는 이유: 이 시험 내용 자체가 레벨테스트 E6 문제와 완전히 같아서
   (문항·정답 100% 동일, 이 파일 만들 때 대조 확인함), 로드맵 보정 로직이
   "초5가 E6 시험을 보면 초등6 로드맵으로 본다"는 조건을 그대로 타게 하려는 것. */
function openReportCard(id){
  const r=findRow(id); if(!r) return;
  /* window.open('', '_blank') 후 win.document.write로 채워넣는 방식은 — 탭 제목은
     "OOO 성적표"로 바뀌는데 화면은 계속 흰 화면(about:blank)인 증상으로 실패했다.
     GitHub Pages가 보내는 교차출처 격리 헤더(COOP) 때문에, 같은 사이트인데도
     열어놓은 창의 document에 바깥에서 글을 쓰는 게 막히는 걸로 보인다(제목만
     먼저 반영되고 본문 write는 조용히 무시됨 — 흔한 증상).
     그래서 아예 다른 창의 document를 건드리지 않는 방식으로 바꾼다: 성적표 HTML을
     Blob으로 만들어 그 Blob 자체의 주소(blob: URL)로 새 탭을 '연다' — 이러면
     새 탭은 자기 자신의 문서를 읽는 것뿐이라 저 문제를 아예 안 겪는다. */
  try{
    const evaluation=buildExamEvaluation(r);
    const vtEvaluation=buildVTEvaluation(r);
    const grade=r.grade||'초등5';
    /* 화면에 보이는 시험지명은 'E5 진급 테스트'로 바꾸고 싶었지만, 로드맵 보정 로직
       (getReportGradeForExam)은 시험지명에 'E6'가 들어있어야 "초5가 E6 시험을 봤으니
       로드맵은 초등6 트랙"으로 잡아준다. 그래서 로드맵용 학년(reportGrade)은 'E6'로
       먼저 미리 계산해서 넘기고, 화면에 보이는 title만 따로 'E5 진급 테스트'로 둔다 —
       reportGrade가 이미 '초등6'이면 buildRoadmapBars 안에서 다시 보정할 때도
       (학년이 이제 '초5'가 아니니) 그대로 통과돼서 문제없다. */
    const reportGrade=getReportGradeForExam(grade,'E6');
    const mainReport=renderGeneralReport(r.code,r.name,r.school,grade,'','E5 진급 테스트',E5_EXAM,evaluation,r.finalLevel,reportGrade);
    const vtReport=renderVTReport(r.code,r.name,r.school,grade,'','Voca & Translation',vtEvaluation);
    const base=location.href.replace(/[^\/]*$/,'');
    const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
      <title>${esc(r.name)} 성적표</title>
      <base href="${base}">
      <link rel="stylesheet" href="leveltest/style.css">
      <!-- leveltest/style.css는 안 건드리고(레벨테스트 쪽 성적표는 그대로 둬야 함),
           이 페이지 안에서만 덮어쓴다. 표지 안내문(.intro-box) 줄바꿈이 원래 정해진
           위치(br)에 비해 글씨가 커서 어색하게 끊겨 보인다는 지적 — 한 단계 줄임. -->
      <style>.intro-box{font-size:14px}</style>
      </head><body>
      <div class="top-bar no-print sticky-actions">
        <button onclick="window.print()">인쇄</button>
      </div>
      <div id="reportArea" class="report-scale-fix">${mainReport}${vtReport}</div>
      </body></html>`;
    const blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    /* window.open(blobUrl,'_blank')는 브라우저에 따라 그래도 팝업으로 걸러질 수 있어서,
       그 대신 보이지 않는 <a target="_blank">를 만들어 직접 클릭시킨다 — 진짜 링크
       클릭으로 인식돼서 팝업 차단에 거의 안 걸린다(다운로드·새 탭 열기에 흔히 쓰는 방식). */
    const a=document.createElement('a');
    a.href=blobUrl; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){
    toast('성적표 생성 중 오류가 났어요: '+(e&&e.message||e),false);
  }
}
