<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진급 OT 안내 · JLS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap');
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
/* 글씨체는 홈페이지 그대로: 본문 NanumSquare + 제목 Jua + 손글씨 Gaegu (신입생 안내와 같은 조합). 바뀌면 안 된다. */
:root{--disp:"Jua","Apple SD Gothic Neo",sans-serif;--hand:"Gaegu","Jua",cursive}
/* 진급 OT 안내 — 체스 → 에이스(B·HB·PA1·PA2) 진급생 OT 때 나눠주는 슬라이드.
   작년에는 PDF 5개였고 고칠 때마다 파일을 다시 만들어야 해서 화면 안으로 옮겼다.
   · 슬라이드는 가로 크기(cqw)에 맞춰 글자·간격이 같이 커지고 줄어든다 → 화면·인쇄가 같은 모양.
   · 공통 슬라이드는 한 곳(common)에 두고 반별 슬라이드(시간표·첫 주 일정·시험지 부착 위치)만 따로 둔다. */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"NanumSquare","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#EAF1FF;color:#1C2A4A;word-break:keep-all;line-height:1.6}
.hd{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #CFDCF7;padding:10px 16px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
.hd.on{display:flex}
.back{border:1px solid #CFDCF7;background:#fff;color:#2E4FA6;font:inherit;font-size:13px;font-weight:800;padding:7px 13px;border-radius:10px;cursor:pointer}
/* 요일 체크박스 — 월수금/화목 중 하나만 켜진다(PA1·PA2). 버튼을 두 개씩 만들지 않고 반을 고른 뒤 여기서 고른다. */
.days{display:flex;gap:8px;align-items:center}
.days .dl{font-size:12px;color:#6B7BA0;font-weight:800;margin-right:2px}
.dchk{display:inline-flex;align-items:center;gap:7px;border:1.5px solid #CFDCF7;background:#fff;color:#5A6B95;font-size:14px;font-weight:800;padding:7px 14px 7px 10px;border-radius:12px;cursor:pointer;user-select:none}
.dchk input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:2px solid #AEBFDD;border-radius:5px;margin:0;display:grid;place-items:center;cursor:pointer;background:#fff}
.dchk input:checked{background:#2E4FA6;border-color:#2E4FA6}
.dchk input:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.dchk.on{border-color:#2E4FA6;background:#EEF2FB;color:#2E4FA6}
.hd h1{font-family:var(--disp);font-size:21px;margin:0;font-weight:400;color:#2E4FA6}
.sp{flex:1}
.btn{border:0;background:#2E4FA6;color:#fff;font:inherit;font-size:13px;font-weight:800;padding:8px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:#fff;color:#2E4FA6;border:1px solid #CFDCF7}
.btn.warn{background:#c8375e}
.btn:disabled{opacity:.5;cursor:default}
.edbar{display:none;position:sticky;top:57px;z-index:29;background:#fff8dc;border-bottom:1px solid #ecd98a;padding:8px 16px;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700;color:#7a5b00}
.editing .edbar{display:flex}
.edbar .tb{border:1px solid #d9c46c;background:#fff;border-radius:8px;font:inherit;font-weight:800;padding:5px 11px;cursor:pointer;color:#5b4500}
.edbar .sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d9c46c;cursor:pointer;padding:0}
.notice{max-width:1100px;margin:12px auto 0;padding:10px 14px;border-radius:10px;background:#fff0f0;color:#b3263e;font-weight:700;font-size:13px;line-height:1.6}
.wrap{padding:18px 12px 60px}
.wrap{padding:0 12px 60px}
.wrap.landing{padding:0 0 60px}
/* ⚠️ 슬라이드 자신의 padding·gap·font-size 에 쓴 cqw 는 '슬라이드 바깥 컨테이너'를 기준으로 계산된다
   (컨테이너 단위는 자기 자신이 아니라 조상을 본다). 그래서 바깥에 컨테이너가 없으면 화면(뷰포트) 폭 기준이 되어,
   넓은 모니터에서 여백이 몇 배로 부풀고 글자가 작아졌다(운영자 화면: 양옆이 텅 비고 글자 작음).
   슬라이드를 담는 #root 를 컨테이너로 만들어 슬라이드 폭과 같은 기준이 되게 한다. */
.wrap:not(.landing){container-type:inline-size;max-width:818px;margin:0 auto}

/* ---------- 첫 화면: 신입생 안내 첫 화면과 같은 느낌 (파란 히어로 + 흰 카드) ---------- */
.hero{background:linear-gradient(165deg,#5A86E8 0%,#3E66D6 100%);color:#fff;padding:40px 16px 96px;text-align:center;position:relative;overflow:hidden}
.hero .deco{position:absolute;opacity:.85;pointer-events:none}
.hero .brand{display:inline-block;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 14px;position:relative;z-index:1}
.hero .welcome{font-family:var(--hand);font-size:22px;margin-top:12px;position:relative;z-index:1}
.hero h1{font-family:var(--disp);font-weight:400;margin:4px 0 0;font-size:clamp(32px,8vw,44px);letter-spacing:-.01em;position:relative;z-index:1}
.hero p{margin:12px auto 0;max-width:30em;font-size:14px;opacity:.95;position:relative;z-index:1}
.levels{max-width:900px;margin:-64px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative;z-index:2}
.lv{display:block;background:#fff;border-radius:20px;padding:28px 12px 22px;text-align:center;text-decoration:none;color:#1C2A4A;box-shadow:0 2px 0 #CFDCF7,0 10px 24px rgba(46,79,166,.12);position:relative;cursor:pointer;border:0;font:inherit}
.lv::before{content:"";position:absolute;left:18px;right:18px;top:-9px;height:13px;background:repeating-linear-gradient(90deg,#AEBFDD 0 2px,transparent 2px 20px);filter:drop-shadow(0 2px .5px rgba(28,42,74,.2))}
.lv:hover{transform:translateY(-2px)}
.lv .dot{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-family:var(--disp);font-size:20px;color:#1C2A4A}
.lv b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;line-height:1.1}
.lv small{display:block;margin-top:6px;color:#6B7BA0;font-size:12.5px;font-weight:700}
.lv i{display:inline-block;margin-top:10px;font-style:normal;font-size:11.5px;font-weight:800;color:#2E4FA6;background:#EEF2FB;border-radius:999px;padding:3px 10px}
.tip{max-width:900px;margin:22px auto 0;text-align:center;color:#6B7BA0;font-size:13px;font-weight:700}
@media(max-width:720px){.levels{grid-template-columns:repeat(2,1fr);gap:14px}.lv b{font-size:26px}}

/* ---------- 슬라이드 ----------
   인쇄 잉크를 아끼려고 바탕은 흰색, 색은 연한 파스텔로만 쓴다(예전엔 바탕이 전부 파랑이라 잉크를 많이 먹었다).
   위쪽 가는 색줄과 연한 제목 띠 정도만 색이 들어간다. 진한 파랑은 글자·테두리에만 쓴다. */
.ot-slide{font-family:inherit;container-type:inline-size;position:relative;width:100%;max-width:1100px;margin:0 auto 22px;aspect-ratio:16/9;background:#fff;border:1px solid #CFDCF7;border-radius:14px;overflow:hidden;color:#1C2A4A;box-shadow:0 4px 16px rgba(46,79,166,.10);font-size:2cqw;line-height:1.4}
.ot-slide:not(.full)::before{content:"";position:absolute;left:0;right:0;top:0;height:1.3cqw;background:linear-gradient(90deg,#FDB5B5 0 20%,#F9E8A8 20% 40%,#AED26A 40% 60%,#9DB8F0 60% 80%,#C09CE0 80%)}
.ot-slide.full{aspect-ratio:auto}
.ot-slide.full img{display:block;width:100%;height:auto}
.ot-slide [contenteditable]{outline:none}
.editing .ot-slide [contenteditable="true"]:hover{outline:2px dashed #8fb4f5;outline-offset:2px}
.editing .ot-slide [contenteditable="true"]:focus{outline:2px solid #ffb400;outline-offset:2px;background:rgba(255,248,220,.6)}

/* 노트형: 왼쪽 연한 제목판 + 오른쪽 칸 */
.nb{display:grid;grid-template-columns:27% 1fr;gap:2cqw;padding:4.2cqw 4cqw 3.6cqw}
.nb-l{background:#EEF3FF;border:1.5px solid #CFDCF7;border-radius:1.2cqw;color:#2E4FA6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3cqw 1.6cqw}
.nb-n{background:#FDE2E4;color:#9A2E3E;border-radius:50%;min-width:4.4cqw;height:4.4cqw;display:grid;place-items:center;font-size:2cqw;font-weight:800;padding:0 .6cqw}
.nb-l h2{font-family:var(--disp);font-size:3.5cqw;line-height:1.3;margin:1.6cqw 0 0;font-weight:400}
.nb-r{background:#fff;border:1.5px solid #CFDCF7;border-radius:1.2cqw;padding:2.8cqw 3.2cqw;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw;min-width:0}
ol.items{counter-reset:c;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.3cqw}
ol.items li{counter-increment:c;position:relative;padding-left:5.4cqw;font-size:2.8cqw;font-weight:700;line-height:1.45;color:#1C2A4A}
ol.items li::before{content:counter(c,decimal-leading-zero);position:absolute;left:0;top:.05em;width:3.9cqw;height:3.9cqw;border-radius:50%;display:grid;place-items:center;font-size:1.7cqw;font-weight:800;background:#FDE2E4;color:#9A2E3E}
ol.items li:nth-child(5n+2)::before{background:#FFF0BD;color:#7A5B00}
ol.items li:nth-child(5n+3)::before{background:#D9F3E6;color:#1F6B4A}
ol.items li:nth-child(5n+4)::before{background:#FFF0BD;color:#7A5B00}
ol.items li:nth-child(5n+5)::before{background:#FDE2E4;color:#9A2E3E}
.nb.big ol.items li{font-size:3.6cqw}
.nb-r img{max-width:100%;display:block;border-radius:.8cqw;margin:0 auto}
.nb.imgonly .nb-r{justify-content:center;padding:1.6cqw}
.nb.imgonly .nb-r img{width:100%;max-height:100%;object-fit:contain}
.nb.tall .nb-r img{width:auto;height:100%;max-height:48cqw}
.hl{margin-top:1cqw;padding:1.4cqw 2cqw;border-radius:1cqw;background:#FFF6D6;font-size:2.5cqw;font-weight:700;line-height:1.6}

/* 카드형: 연한 제목 띠 + 본문 */
.card{padding:4.2cqw 4cqw 3.6cqw;display:flex;flex-direction:column;gap:2cqw}
.bar{background:#EEF3FF;border:1.5px solid #CFDCF7;color:#2E4FA6;border-radius:1.2cqw;text-align:center;padding:1.5cqw 2cqw;font-size:3.3cqw;margin:0;font-weight:400;font-family:var(--disp)}
.bar .n{background:#FDE2E4;color:#9A2E3E;border-radius:50%;display:inline-grid;place-items:center;min-width:3.6cqw;height:3.6cqw;font-size:1.8cqw;margin-right:1.4cqw;vertical-align:middle;padding:0 .5cqw}
.card-b{background:#fff;border:1.5px solid #CFDCF7;border-radius:1.2cqw;padding:2.4cqw 3.2cqw;flex:1;min-width:0}
.card-b ol.items{gap:1.5cqw}
.pics img{display:block;max-width:100%;margin:0 auto;border-radius:.8cqw}
.pics img.wide{width:100%}
/* 사진·표만 크게 올리는 카드(첫 주 일정·시험지 부착 위치) — 슬라이드 한 장 안에 들어가게 여백을 줄인다 */
.imgcard{padding:3.2cqw 2.6cqw 1.8cqw;gap:1.2cqw}
.imgcard .bar{padding:.9cqw 2cqw;font-size:2.7cqw}
.imgcard .card-b{padding:.8cqw;display:grid;place-items:center}
.pics img.fit{width:auto;max-width:100%;max-height:44cqw;border-radius:0}
.caps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.6cqw;list-style:none;padding:0;margin:1.2cqw 0 0;font-size:1.7cqw;font-weight:700;text-align:center}
.msg{font-size:2.9cqw;line-height:1.8;font-weight:600;padding:1cqw 1cqw}
.msg i{display:block;margin:1cqw 0;color:#5a6d9d;font-style:normal;font-size:2.5cqw}
.ot-table{width:100%;border-collapse:collapse;font-size:1.85cqw;line-height:1.5}
.ot-table th,.ot-table td{border:1px solid #cfd8ef;padding:.9cqw 1.2cqw;vertical-align:top;text-align:left}
.ot-table thead th{background:#EEF3FF;text-align:center;font-weight:800}
.ot-table tbody th{background:#F7F9FE;white-space:nowrap}
.ot-table.wk{font-size:1.25cqw}
.ot-table.wk tbody th{width:9%}

/* 첫 주 일정 — 과목 이름표 + 교재 + 과제 목록 카드. 원본 표를 사진으로 붙이면 글씨가 너무 작아서 글자로 풀어 쓴 것 */
.wk{padding:4.2cqw 3cqw 2.6cqw;gap:1.2cqw}
.wk .bar{padding:1cqw 2cqw;font-size:2.8cqw}
.wk-grid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.6cqw;flex:1;min-height:0}
.wk-col{display:flex;flex-direction:column;gap:1cqw;min-width:0}
.wk-per{background:#EEF3FF;border:1.5px solid #CFDCF7;color:#2E4FA6;font-weight:800;font-size:1.7cqw;text-align:center;padding:.6cqw;border-radius:.8cqw;flex:none}
.wk-card{border:1.5px solid #CFDCF7;border-radius:.9cqw;padding:.9cqw 1.2cqw;font-size:1.55cqw;line-height:1.42;flex:1 1 auto;min-height:0}
.wk-tag{display:inline-block;font-weight:800;font-size:1.65cqw;padding:.25cqw 1.1cqw;border-radius:999px;margin-bottom:.5cqw}
.k-test{background:#FDE2E4;color:#9A2E3E}.k-gram{background:#D9F3E6;color:#1F6B4A}.k-read{background:#E2ECFF;color:#2E4FA6}.k-list{background:#FFF0BD;color:#7A5B00}.k-util{background:#EBDDF7;color:#5B3A86}
.wk-book{font-weight:800;margin-bottom:.3cqw}
.wk-l{margin:.1cqw 0}
.wk-h{display:inline-block;margin-top:.5cqw;font-weight:800;color:#2E4FA6;border-bottom:1.5px solid #CFDCF7}
.wk-ul{list-style:none;margin:.3cqw 0 0;padding:0}
.wk-ul li{margin:.2cqw 0;padding-left:1.2cqw;text-indent:-1.2cqw}
.wk-n{margin-top:.6cqw;padding:.5cqw .8cqw;border-radius:.6cqw;background:#FFF6D6;color:#5C4500;font-size:1.4cqw}
.wk-foot{margin:0;font-size:1.3cqw;color:#5A6B95;flex:none}

/* 첫 주 일정 (새 모양) — 장식 없이 글자와 가는 선만. 큰 요일 제목, 과목 제목, 라벨+내용 표, 번호 목록.
   줄바꿈은 단어 단위(word-break:keep-all), 묶음(Chapter 1·Unit 1+2·A type)은 .nw 로 쪼개지지 않게 한다. */
.wk2{padding:3.1cqw 4.4cqw 0;word-break:keep-all;overflow-wrap:normal;line-height:1.5}
.w2-head{display:flex;align-items:baseline;gap:1.45cqw;padding-bottom:1.1cqw;border-bottom:.18cqw solid #1C2A4A}
.w2-day{font-size:4cqw;font-weight:800;letter-spacing:-.02em}
.w2-per{font-size:2.55cqw;font-weight:700}
.w2-time{font-size:2cqw;font-weight:400;color:#5A6B95}
.w2-sp{flex:1}
.w2-wk{font-size:1.27cqw;font-weight:700;color:#8A95B8}
.w2-cols{display:grid;grid-template-columns:1fr 1fr;margin-top:1.45cqw}
.w2-col{padding:0 2.5cqw 0 0}
.w2-col+.w2-col{padding:0 0 0 2.5cqw;border-left:.09cqw solid #D9DFEE}
.w2-sub{font-size:2.4cqw;font-weight:800;margin-bottom:.75cqw}
.w2-row{display:grid;grid-template-columns:4.2cqw 1fr;gap:.9cqw;font-size:1.64cqw;line-height:1.45;margin-bottom:.45cqw}
.w2-l{font-size:1.27cqw;font-weight:700;color:#8A95B8;padding-top:.18cqw}
.w2-book{font-weight:800;font-size:1.82cqw}
.nw{white-space:nowrap}
.w2-hwl{font-size:1.27cqw;font-weight:800;color:#8A95B8;margin:.9cqw 0 .55cqw;padding-top:.8cqw;border-top:.09cqw solid #D9DFEE}
.w2-ol{list-style:none;counter-reset:n;margin:0;padding:0}
.w2-ol li{counter-increment:n;position:relative;padding-left:2.55cqw;font-size:1.73cqw;font-weight:700;line-height:1.45;margin-bottom:.7cqw}
.w2-ol li::before{content:counter(n);position:absolute;left:0;top:0;font-weight:800;color:#8A95B8}
.w2-ol.sm li{font-size:1.41cqw;margin-bottom:.3cqw;line-height:1.4}
.w2-ol .pg{font-weight:800;color:#2E4FA6;white-space:nowrap}
.w2-ol li small{display:block;font-size:1.45cqw;font-weight:400;color:#5A6B95;margin-top:.2cqw;line-height:1.45}
.w2-ref{font-size:1.32cqw;font-weight:400;color:#5A6B95;line-height:1.5;margin-top:.9cqw}
.w2-foot{position:absolute;left:4.4cqw;right:4.4cqw;bottom:1.1cqw;font-size:1.2cqw;font-weight:400;color:#8A95B8;white-space:nowrap}

/* 요일 한 장 — 왼쪽 1교시 / 오른쪽 2교시. 안의 과목 블록은 w2-col 을 그대로 쓰되 세로로 쌓는다 */
.wk3{padding:2.2cqw 3.6cqw 0;word-break:keep-all;overflow-wrap:normal;line-height:1.5}
.wk3 .w2-head{padding-bottom:.45cqw}
.wk3 .w2-day{font-size:3.1cqw}
.w3-cols{display:grid;grid-template-columns:1fr 1fr;margin-top:.7cqw}
.w3-pc{padding:0 2cqw 0 0}
.w3-pc+.w3-pc{padding:0 0 0 2cqw;border-left:.09cqw solid #D9DFEE}
.w3-ph{font-size:2cqw;font-weight:800;padding-bottom:.35cqw;border-bottom:.18cqw solid #1C2A4A;margin-bottom:.7cqw}
.w3-pt{font-size:1.45cqw;font-weight:400;color:#5A6B95;margin-left:.9cqw}
.wk3 .w2-col,.wk3 .w2-col+.w2-col{padding:0;border:0;margin-bottom:1cqw}
.wk3 .w2-sub{font-size:2cqw;margin-bottom:.3cqw}
.wk3 .w2-row{grid-template-columns:3.4cqw 1fr;gap:.7cqw;font-size:1.3cqw;margin-bottom:.1cqw;line-height:1.38}
.wk3 .w2-l{font-size:1.09cqw}
.wk3 .w2-book{font-size:1.45cqw}
.wk3 .w2-hwl{font-size:1.05cqw;margin:.4cqw 0 .3cqw;padding-top:.3cqw}
.wk3 .w2-ol li{font-size:1.35cqw;padding-left:2cqw;margin-bottom:.22cqw;line-height:1.34}
.wk3 .w2-ol.sm li{font-size:1.35cqw}
.wk3 .w2-ol li small{font-size:1.18cqw}
.wk3 .w2-ref{font-size:1.2cqw}
/* 과목 제목 색(글자색만 — 인쇄 잉크 절약) */
.k-t,.k-g,.k-r,.k-l,.k-u{color:#D23B3B}

/* 시간표 */
.time{padding:4.2cqw 4cqw 3.6cqw;display:flex;flex-direction:column;gap:2cqw}
.time .cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2cqw;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:1.2cqw}
.col .day{font-family:var(--disp);background:#EEF3FF;border:1.5px solid #CFDCF7;color:#2E4FA6;text-align:center;font-size:3cqw;font-weight:400;height:7.6cqw;display:flex;align-items:center;justify-content:center;border-radius:1cqw;flex:none}
.col .per{background:#F4F6FB;color:#5A6B95;text-align:center;font-size:1.8cqw;font-weight:700;height:4cqw;display:flex;align-items:center;justify-content:center;border-radius:.6cqw;flex:none}
.col .sub{background:#fff;border:1.5px solid #CFDCF7;color:#1C2A4A;text-align:center;font-size:1.8cqw;padding:.8cqw 1cqw;border-radius:.6cqw;line-height:1.45;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.col .sub .in{width:100%}
/* 칸 크기는 글 길이와 상관없이 전부 같게: 과목 칸은 남는 높이를 똑같이 나눠 갖고(flex-basis 0), 요일·교시 띠는 높이를 고정한다.
   예전엔 글이 두 줄인 칸만 커져서 칸 크기가 들쭉날쭉했다. */
.col .sub b{color:#D9622B;font-size:2cqw}
/* 한 칸에 교시가 3개(화목반)거나 아래에 안내 글이 붙는 시간표는 같은 높이 안에 더 많이 들어가야 해서 띠·글자를 조금 줄인다 */
.time.tight{gap:1.2cqw}
.time.tight .cols{gap:1.4cqw}
.time.tight .col{gap:.8cqw}
.time.tight .col .day{height:4.8cqw;font-size:2.4cqw}
.time.tight .col .per{height:3cqw;font-size:1.4cqw}
.time.tight .col .sub{font-size:1.5cqw;padding:.3cqw .8cqw;line-height:1.3}
.time.tight .col .sub b{font-size:1.7cqw}
.time.tight .bar{padding:1cqw 2cqw;font-size:2.8cqw}
.hint-edit{margin:0;color:#7A5B00;background:#FFF6D6;border-radius:.8cqw;padding:.8cqw 1.4cqw;font-size:1.5cqw}

/* 표지·끝 — 흰 바탕에 글자만 */
.cover{display:grid;place-items:center;text-align:center;color:#2E4FA6}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.3cqw;background:linear-gradient(90deg,#FDB5B5 0 20%,#F9E8A8 20% 40%,#AED26A 40% 60%,#9DB8F0 60% 80%,#C09CE0 80%)}
.cv-in{position:relative;z-index:2}
.cover h1{font-family:var(--disp);font-size:6.8cqw;margin:.6cqw 0 0;font-weight:400;line-height:1.2;color:#2E4FA6}
.cover .en{font-size:3.6cqw;font-family:var(--hand);font-weight:700;color:#E8693A}
.cls-name{display:inline-block;margin-top:2.4cqw;background:#FFF3C9;color:#2E4FA6;font-family:var(--disp);font-weight:400;font-size:3cqw;padding:.8cqw 3cqw;border-radius:999px}
.cls-name:empty{display:none}


/* ---------- 수정 모드 ---------- */
.seglab,.ot-tools{display:none}
.editing .seglab{display:block;position:absolute;left:10px;top:8px;z-index:6;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#fff3c9;color:#7a5b00;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.editing .seglab.c{background:#ffe0e0;color:#b3263e}
.editing .ot-tools{display:flex;position:absolute;right:10px;top:8px;z-index:6;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.ot-tools button{border:0;background:#fff;color:#214e9e;font:inherit;font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ot-tools button.d{color:#c8375e}
.editing .ot-slide img{cursor:pointer}
.editing .ot-slide img:hover{outline:3px dashed #ffb400}
.addrow{display:none;max-width:1100px;margin:-8px auto 14px;text-align:center}
.editing .addrow{display:block}
.addrow button{border:1px dashed #8fb4f5;background:#fff;color:#214e9e;font:inherit;font-size:12.5px;font-weight:800;padding:6px 14px;border-radius:999px;margin:0 3px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2f66;color:#fff;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.bad{background:#c8375e}
.cover.is-auto .cls-name{display:inline-block}


/* ---------- 첫 주 일정 — 세로(A4) 소책자 모양 (.port .wkp) ----------
   요일 한 장 = A4 세로 한 쪽. 1·2·3교시를 위→아래로 쌓고, 내용이 쪽을 꽉 채우도록 글자 크기(--s)를 화면에서 자동으로 맞춘다
   (fitPort). 예전 가로 슬라이드는 아래가 비어 보인다는 지적이 있었다. 글자 크기는 전부 cqw 라 화면·인쇄 모양이 같다.
   ⚠️ 과목 제목은 색 하나로 통일(운영자) — 과목마다 색이 달라 정신 사납다고 했다. */
.ot-slide.port{aspect-ratio:794/1123;max-width:794px}
.wkp{--s:1;display:flex;flex-direction:column;padding:5.04cqw 6.80cqw 4.28cqw;word-break:keep-all;overflow-wrap:normal;line-height:1.5}
.wkp::before{content:"";position:absolute;left:0;right:0;top:0;height:1.51cqw;background:linear-gradient(90deg,#FDB5B5 0 20%,#F9E8A8 20% 40%,#AED26A 40% 60%,#9DB8F0 60% 80%,#C09CE0 80%)}
.wkp .w2-head{flex:none;border-bottom:0.25cqw solid #1C2A4A;padding-bottom:1.26cqw}
.wkp .w2-day{font-size:5.04cqw}
.wkp .w2-wk{font-size:1.76cqw}
.wp-body{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:1.76cqw}
.wp-band{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.wp-band+.wp-band{margin-top:2.27cqw}
.wp-ph{flex:none;display:flex;align-items:baseline;gap:1.51cqw;font-size:calc(3.27cqw*var(--s));font-weight:800;padding-bottom:0.63cqw;margin-bottom:0.76cqw;border-bottom:0.38cqw solid #1C2A4A}
.wp-pt{font-size:calc(2.14cqw*var(--s));font-weight:400;color:#5A6B95}
.wp-bb{flex:1;display:flex;flex-direction:column;min-height:0}
.wkp .w2-col,.wkp .w2-col+.w2-col{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:0 0 1.51cqw;border:0}
.wkp .w2-col+.w2-col{border-top:0.19cqw solid #1C2A4A;padding-top:1.51cqw}
.wkp .w2-sub{font-size:calc(2.90cqw*var(--s));margin-bottom:calc(0.50cqw*var(--s))}
.wkp .w2-row{grid-template-columns:calc(5.04cqw*var(--s)) 1fr;gap:1.01cqw;font-size:calc(2.02cqw*var(--s));line-height:1.45;margin-bottom:calc(0.25cqw*var(--s))}
.wkp .w2-l{font-size:calc(1.57cqw*var(--s))}
.wkp .w2-book{font-size:calc(2.14cqw*var(--s))}
.wkp .w2-hwl{font-size:calc(1.51cqw*var(--s));margin:calc(1.01cqw*var(--s)) 0 calc(0.63cqw*var(--s));padding-top:calc(0.76cqw*var(--s));border-top:0.19cqw dotted #AEB8D4}
.wkp .w2-ol li,.wkp .w2-ol.sm li{font-size:calc(2.08cqw*var(--s));padding-left:calc(3.02cqw*var(--s));margin-bottom:calc(0.50cqw*var(--s));line-height:1.42}
.wkp .w2-ol li small{font-size:calc(1.76cqw*var(--s))}
.wkp .w2-ref{font-size:calc(1.64cqw*var(--s));margin-top:calc(1.01cqw*var(--s))}
.wkp .w2-foot{position:static;flex:none;white-space:normal;font-size:1.57cqw;border-top:0.13cqw solid #D9DFEE;padding-top:1.01cqw;margin-top:1.01cqw}


/* ---------- 전체 세로(A4) 모양 ----------
   운영자 결정: 첫 주 일정만이 아니라 OT 안내 전체를 세로(A4, 소책자용)로 한다.
   가로 슬라이드를 폭만 좁혀 세로로 눕히면 아래가 텅 비므로, 종류별로 위→아래 배치로 다시 짰다
   (노트형: 제목 띠가 위·목록이 아래 / 카드형 / 시간표: 요일을 가로 줄로). 글자 크기(--s)는 fitPort 가 쪽에 꽉 차게 맞춘다. */
.ot-slide{aspect-ratio:794/1123;max-width:794px;--s:1}
.ot-slide.full{aspect-ratio:auto}
.nb{display:flex;flex-direction:column;gap:calc(2.4cqw*var(--s));padding:5.2cqw 5cqw 4.6cqw}
.nb-l{flex:none;flex-direction:row;justify-content:flex-start;gap:calc(2.2cqw*var(--s));text-align:left;padding:calc(2.4cqw*var(--s)) 3.4cqw}
.nb-n{min-width:calc(5cqw*var(--s));height:calc(5cqw*var(--s));font-size:calc(2.3cqw*var(--s))}
.nb-l h2{margin:0;font-size:calc(4.2cqw*var(--s));line-height:1.25}
.nb-r{flex:1;min-height:0;padding:calc(3.2cqw*var(--s)) 4cqw;justify-content:space-around;gap:calc(2.4cqw*var(--s))}
.nb-r>ol.items{flex:1 1 auto;justify-content:space-around;gap:calc(1.6cqw*var(--s))}
ol.items li{padding-left:calc(6cqw*var(--s));font-size:calc(2.7cqw*var(--s));line-height:1.5}
ol.items li::before{width:calc(4.2cqw*var(--s));height:calc(4.2cqw*var(--s));font-size:calc(1.9cqw*var(--s))}
.nb.big ol.items li{font-size:calc(3.4cqw*var(--s))}
.nb-r img{flex:0 1 auto;min-height:26cqw;max-height:none;width:100%;object-fit:contain}
.nb-r>ol.items+img,.nb-r>ol.items+.hl{margin-top:0}
.nb.imgonly .nb-r{padding:2cqw}
.nb.tall .nb-r img{height:100%;max-height:none;width:auto;max-width:100%}
.hl{font-size:calc(2.5cqw*var(--s));padding:calc(1.8cqw*var(--s)) calc(2.4cqw*var(--s))}
.card{padding:5.2cqw 5cqw 4.6cqw;gap:calc(2.4cqw*var(--s))}
.bar{flex:none;font-size:calc(4cqw*var(--s));padding:calc(2cqw*var(--s)) 2.4cqw}
.bar .n{min-width:calc(4.4cqw*var(--s));height:calc(4.4cqw*var(--s));font-size:calc(2.2cqw*var(--s))}
.card-b{min-height:0;padding:calc(3cqw*var(--s)) 4cqw;display:flex;flex-direction:column;justify-content:space-around;gap:calc(2.4cqw*var(--s))}
.card-b>ol.items{flex:1 1 auto;justify-content:space-around}
.pics{flex:1 1 auto;min-height:26cqw;display:flex;align-items:center}
.pics img,.pics img.wide{width:100%;max-height:100%;object-fit:contain}
.msg{font-size:calc(3.2cqw*var(--s));padding:0}
.msg i{font-size:calc(2.8cqw*var(--s))}
.ot-table{font-size:calc(2.2cqw*var(--s))}
.ot-table th,.ot-table td{padding:calc(1.2cqw*var(--s)) calc(1.5cqw*var(--s))}
.imgcard{padding:5.2cqw 3.6cqw 3.6cqw}
.imgcard .bar{font-size:3.4cqw;padding:1.4cqw 2cqw}
.imgcard .card-b{padding:1.2cqw;display:grid;place-items:center}
.imgcard .pics{display:block;min-height:0}
.pics img.fit{width:100%;max-width:100%;max-height:none;height:auto}
.time{padding:5.2cqw 5cqw 4.6cqw;gap:calc(2.4cqw*var(--s))}
.time .cols{display:flex;flex-direction:column;gap:calc(2cqw*var(--s));grid-auto-flow:row}
.time .col{flex:1 1 0;min-height:0;display:grid;grid-template-columns:27% 1fr;column-gap:calc(1.4cqw*var(--s));row-gap:calc(1.2cqw*var(--s));align-content:stretch;grid-auto-rows:1fr}
.time .col .day{grid-column:1/-1;height:auto;grid-row:auto;font-size:calc(3.2cqw*var(--s));padding:calc(1.2cqw*var(--s)) 0}
.time .col .per{height:auto;font-size:calc(2cqw*var(--s));padding:calc(0.8cqw*var(--s)) calc(0.6cqw*var(--s))}
.time .col .sub{font-size:calc(2.1cqw*var(--s));padding:calc(0.8cqw*var(--s)) calc(1.4cqw*var(--s));justify-content:flex-start;text-align:left}
.time .col .sub b{font-size:calc(2.4cqw*var(--s))}
.time .col .day{grid-auto-rows:auto}
.time.tight{gap:calc(2cqw*var(--s))}
.time.tight .col{gap:0;row-gap:calc(1cqw*var(--s))}
.time.tight .col .day{height:auto;font-size:calc(3cqw*var(--s))}
.time.tight .col .per{height:auto;font-size:calc(1.9cqw*var(--s))}
.time.tight .col .sub{font-size:calc(2cqw*var(--s));padding:calc(0.8cqw*var(--s)) calc(1.4cqw*var(--s));line-height:1.4}
.time.tight .col .sub b{font-size:calc(2.3cqw*var(--s))}
.time.tight .bar{font-size:calc(4cqw*var(--s));padding:calc(2cqw*var(--s)) 2.4cqw}
.cover h1{font-size:9.6cqw}
.cover .en{font-size:5.4cqw}
.cover .cls-name{font-size:3.6cqw}
.cover.mid h1{font-size:9.6cqw}
.imgcard .pics{display:flex;flex-direction:column;gap:2cqw;align-items:stretch}
.imgcard .pics img.fit{flex:none}


/* ---- 운영자 요청 보정 ----
   · 첫 주 일정: 글자 굵기는 기본(400)으로, 교재·범위·과제 글자 크기는 하나로 통일. 과목 제목(단어 TEST 등)·교시 제목은 그대로.
     예전엔 교재 줄과 '총 40개 단어' 같은 한두 줄만 굵고 커서 이상해 보였다. */
.wkp .w2-row,.wkp .w2-book,.wkp .w2-ol li,.wkp .w2-ol.sm li{font-size:calc(2.08cqw*var(--s));font-weight:400}
.wkp .w2-row b:not(.w2-l),.wkp .w2-ol .pg{font-weight:400}
.wkp .w2-l{font-weight:400}
/* 시간표 교시 칸: '1교시' 아래 줄에 시간. 가운데서 어정쩡하게 끊기지 않게 시간은 한 덩어리(parseDoc 이 <br> 를 넣는다) */
.time .col .per{line-height:1.35;white-space:nowrap}
.time .col .sub{min-height:min-content}
/* 노트 두 개를 한 쪽에(.multi) — 02 준비물 + 03 내 교재 */
.nb.multi{gap:calc(1.8cqw*var(--s))}
.nbm{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:calc(1.4cqw*var(--s))}
.nb.multi .nb-l{padding:calc(1.3cqw*var(--s)) 3.4cqw}
.nb.multi .nb-l h2{font-size:calc(3.3cqw*var(--s))}
.nb.multi .nb-n{min-width:calc(4.2cqw*var(--s));height:calc(4.2cqw*var(--s));font-size:calc(2cqw*var(--s))}
.nb.multi .nb-r{padding:calc(2cqw*var(--s)) 4cqw}
.nb.multi ol.items li{font-size:calc(2.3cqw*var(--s));padding-left:calc(5.2cqw*var(--s))}
.nb.multi ol.items li::before{width:calc(3.6cqw*var(--s));height:calc(3.6cqw*var(--s));font-size:calc(1.6cqw*var(--s))}

/* 사진만 있는 칸(.pic): 테두리·안쪽 여백을 없애 사진이 쪽 폭을 꽉 채우게(운영자: 사진 테두리 빼고 박스를 더 크게) */
.nb-r.pic,.nb.multi .nb-r.pic{border:0;padding:0;background:transparent}
.nb-r.pic{justify-content:center}
.nb-r.pic img{flex:none;width:100%;height:auto;min-height:0;border-radius:0}
/* 글자 크기를 전 반 같게 고정했으므로(위 fitPort) 내용이 적은 쪽은 위에서부터 차례로 쌓는다 — 예전처럼 늘려 퍼뜨리면 블록 사이가 휑하게 벌어진다 */
.wkp .wp-band{flex:0 0 auto}
.wkp .wp-bb{flex:0 0 auto}
.wkp .w2-col,.wkp .w2-col+.w2-col{flex:0 0 auto;justify-content:flex-start}
.wkp .w2-col{padding-bottom:calc(1.8cqw)}
.wkp .w2-col+.w2-col{padding-top:calc(1.8cqw)}
/* ---------- 평가 일정 (시안 B) — 위: 한 학기 흐름(3개월 칸) / 아래: 시험별 설명 줄. 표 격자 없음 ---------- */
.ev{padding:5.79cqw 6.80cqw 5.04cqw;display:flex;flex-direction:column}
.ev-head{flex:none;display:flex;align-items:baseline;gap:1.76cqw;border-bottom:0.25cqw solid #1C2A4A;padding-bottom:1.26cqw}
.ev-head .n{background:#FDE2E4;color:#9A2E3E;border-radius:50%;display:inline-grid;place-items:center;flex:none;min-width:calc(4.4cqw*var(--s));height:calc(4.4cqw*var(--s));font-size:calc(2.2cqw*var(--s));font-weight:800;padding:0 .6cqw;align-self:center}
.ev-t{font-family:inherit;font-size:calc(5.04cqw*var(--s));font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.3}
.ev-sub{margin-left:auto;font-size:calc(1.76cqw*var(--s));font-weight:700;color:#8A95B8}
.ev-tl{flex:none;margin:2.77cqw 0 1.01cqw}
.ev-lab{font-size:calc(1.76cqw*var(--s));font-weight:800;color:#8A95B8;margin-bottom:1.26cqw}
.ev-bar{display:grid;grid-template-columns:repeat(3,1fr);border:0.19cqw solid #1C2A4A}
.ev-bar>div{padding:calc(1.51cqw*var(--s)) calc(1.76cqw*var(--s));border-right:0.19cqw solid #1C2A4A;min-height:calc(12.09cqw*var(--s))}
.ev-bar>div:last-child{border-right:0}
.ev-mh{font-family:inherit;font-size:calc(2.27cqw*var(--s));font-weight:800;margin:0 0 calc(0.76cqw*var(--s))}
.ev-mp{font-size:calc(1.89cqw*var(--s));line-height:1.5;margin:0}
.ev-mp::before{content:"● ";color:#D23B3B;font-size:calc(1.39cqw*var(--s))}
.ev-all{margin-top:calc(1.26cqw*var(--s));font-size:calc(2.02cqw*var(--s));font-weight:700;display:flex;flex-wrap:wrap;gap:calc(1.26cqw*var(--s));align-items:center}
.ev-all i{font-style:normal;color:#fff;background:#1C2A4A;border-radius:999px;padding:calc(0.13cqw*var(--s)) calc(1.51cqw*var(--s));font-size:calc(1.76cqw*var(--s));font-weight:800}
.ev-rows{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:1.76cqw}
.ev-r{flex:1 1 0;min-height:0;display:grid;grid-template-columns:25% 1fr;gap:0 3.27cqw;align-items:center;padding:1.51cqw 0;border-top:0.19cqw dotted #AEB8D4}

<script>
var SUPA_URL='https://hplndiuoohantbalixwu.supabase.co';
var SUPA_KEY='sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X';
var sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPA_URL,SUPA_KEY):null;

/* 레벨 순서는 B → HB → PA1 → PA2 (운영자 지정). 월수금/화목이 있는 반(PA1·PA2)은 버튼을 둘로 나누지 않고
   반을 고른 뒤 화면 위 체크박스로 고른다. 저장 키(doc)는 예전 이름 그대로 — pa2 는 '화목'반이다. */
var LEVELS=[
  {k:'b',  label:'B반',  sub:'ACE Bridge',      doc:'b',  color:'#FDB5B5'},
  {k:'hb', label:'HB반', sub:'ACE High Bridge', doc:'hb', color:'#F9E8A8'},
  {k:'pa1',label:'PA1반',sub:'Pre Ace 1',       days:{mwf:'pa1mwf',tt:'pa1tt'}, color:'#AED26A'},
  {k:'pa2',label:'PA2반',sub:'Pre Ace 2',       days:{mwf:'pa2mwf',tt:'pa2'},   color:'#C09CE0'}
];
var DAYS=[{k:'mwf',label:'월수금'},{k:'tt',label:'화목'}];
var LV=null, DAY=null;
var DB={};            // DB에 저장된 수정본 { doc_key: html }
var TABLE_OK=true;    // ot_guides 표가 있는지
var CUR=null, EDIT=false, DIRTY=false;   // CUR = 지금 반의 저장 키 앞머리(hb, pa1mwf …). 첫 화면에서는 null
var SEGS=['common','front','back'];

/* 수정은 엄윤경 계정 한 명만 (운영자 결정). 통합관리에서 들어오면 sessionStorage 에 로그인 정보가 있다. */
function whoAmI(){ try{ var s=JSON.parse(sessionStorage.getItem('jls_int_session')||'null'); return s&&s.username||''; }catch(e){ return ''; } }
var CAN_EDIT=(whoAmI()==='엄윤경');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(m,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},bad?4500:2600);}
function lvOf(k){return LEVELS.filter(function(c){return c.k===k;})[0];}
function dayLabel(k){var d=DAYS.filter(function(x){return x.k===k;})[0];return d?d.label:'';}
function setCur(){var l=lvOf(LV);CUR=l?(l.days?l.days[DAY]:l.doc):null;}
function clsLabel(){var l=lvOf(LV);return l?(l.label+(l.days?' '+dayLabel(DAY):'')):'';}
function docKey(seg){return seg==='common'?'common':CUR+'_'+seg;}
function docHtml(key){ return DB[key]!=null?DB[key]:(OT_DEFAULT[key]||''); }

/* 저장된 내용을 그릴 때 스크립트·이벤트 속성은 걸러낸다(혹시 모를 붙여넣기 대비) */
function parseDoc(html,seg){
  var d=new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  d.querySelectorAll('script,iframe,object,embed,link,style').forEach(function(n){n.remove();});
  d.querySelectorAll('*').forEach(function(n){[].slice.call(n.attributes).forEach(function(a){if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name);});});
  /* 끝 슬라이드 문구: 예전엔 '정상에서 곧 만나요!' — 'ACE 수업에서 만나요!'로 바꿨다(운영자). 이미 저장해 둔 옛 문구도 같이 바꿔 보여준다. */
  d.querySelectorAll('.cover.end h1').forEach(function(h){ if(/정상에서\s*곧\s*만나요/.test(h.textContent)) h.innerHTML='ACE 수업에서<br>만나요!'; });
  /* 시간표 칸: 과목·교재 글을 한 덩어리(.in)로 감싸 칸 한가운데 두는 모양을 통일한다(저장된 예전 내용도 같이) */
  d.querySelectorAll('.col .sub').forEach(function(sub){ if(!sub.querySelector(':scope > .in')){ var w=d.createElement('div'); w.className='in'; while(sub.firstChild) w.appendChild(sub.firstChild); sub.appendChild(w); } });
  /* 시간표 교시 칸: '1교시 (5:50-6:50)' → 1교시 / (5:50 - 6:50) 두 줄. 칸이 좁아 시간 한가운데서 줄이 끊겼다. 저장된 옛 내용도 같이 바꿔 보여준다 */
  d.querySelectorAll('.time .col .per').forEach(function(p){
    var m=p.textContent.trim().match(/^(\d+교시)\s*\(\s*([^)]+?)\s*\)$/);
    if(m)p.innerHTML=m[1]+'<br>('+m[2].replace(/\s*[-–]\s*/,' - ')+')';
  });
  /* 시간표 교재 칸: 'Grammar Map Basic A-1<br>+ Workbook' 처럼 어정쩡하게 두 줄로 끊어 넣은 건 한 줄로 잇는다(칸 밖으로 삐져나왔다). 저장된 옛 내용도 같이 */
  d.querySelectorAll('.time .col .sub').forEach(function(sub){ sub.innerHTML=sub.innerHTML.replace(/<br\s*\/?>\s*(?=\+)/g,' '); });
  var out=[].slice.call(d.body.querySelectorAll(':scope > section.ot-slide'));
  out.forEach(function(s){s.setAttribute('data-seg',seg);});
  return out;
}
function load(cb){
  if(!sb){TABLE_OK=false;cb();return;}
  sb.from('ot_guides').select('doc_key,content_html').then(function(r){
    if(r.error){TABLE_OK=false;}else{TABLE_OK=true;DB={};(r.data||[]).forEach(function(x){DB[x.doc_key]=x.content_html;});}
    cb();
  },function(){TABLE_OK=false;cb();});
}

function paintHeader(){
  var hd=document.getElementById('hd'),l=lvOf(LV);
  if(!l){hd.classList.remove('on');return;}
  hd.classList.add('on');
  /* 수정 버튼: 첫 화면에서 반을 골라 들어온 경우에도 떠야 한다(예전엔 주소로 바로 열 때만 켜져서 '수정 버튼이 없다'고 했다) */
  document.getElementById('bEdit').style.display=(CAN_EDIT&&!EDIT)?'':'none';
  document.getElementById('hTitle').textContent=l.label;
  var d=document.getElementById('days');
  if(!l.days){d.innerHTML='';return;}
  var h='<span class="dl">수업 요일</span>';
  DAYS.forEach(function(x){h+='<label class="dchk'+(x.k===DAY?' on':'')+'"><input type="checkbox" '+(x.k===DAY?'checked ':'')+'onchange="pickDay(\''+x.k+'\')">'+x.label+'</label>';});
  d.innerHTML=h;
}
/* 화면 이동(주소는 바꾸되 새로 불러오지 않는다 — 고치던 내용이 있으면 먼저 물어본다) */
function urlFor(){var q=new URLSearchParams(location.search),e=q.get('embed')==='1'?'&embed=1':'';return LV?'?cls='+LV+(lvOf(LV).days?'&day='+DAY:'')+e:(e?'?embed=1':location.pathname);}
function leaveEdit(){ if(EDIT){ if(DIRTY&&!confirm('고친 내용이 저장되지 않았어요. 버리고 넘어갈까요?'))return false; EDIT=false;DIRTY=false;document.body.classList.remove('editing');['bSave','bCancel'].forEach(function(i){document.getElementById(i).style.display='none';});['bEdit','bPrint'].forEach(function(i){document.getElementById(i).style.display='';});document.getElementById('bEdit').style.display=CAN_EDIT?'':'none'; } return true; }
function go(lv,day){ if(!leaveEdit()){paintHeader();return;} LV=lv;DAY=day||null;setCur();try{history.replaceState(null,'',urlFor());}catch(e){} paintHeader();render();window.scrollTo(0,0); }
function goLanding(){ go(null,null); }
function pickDay(k){ go(LV,k); }
function paintNotice(){
  var n=document.getElementById('notice');
  n.innerHTML=(!TABLE_OK&&CAN_EDIT)?'<div class="notice">⚠️ 저장 표(ot_guides)가 아직 없어요. Supabase SQL Editor 에서 <b>sql/ot_guides.sql</b> 을 한 번 실행해야 저장이 돼요. (지금은 화면만 볼 수 있고, 수정해도 저장이 안 돼요)</div>':'';
}

function deco(slide){
  var a=slide.querySelector('[data-auto="cls"]');if(a)a.textContent=clsLabel()+' · 진급 OT';
}

function composeSlides(){
  var common=parseDoc(docHtml('common'),'common'),front=parseDoc(docHtml(docKey('front')),'front'),back=parseDoc(docHtml(docKey('back')),'back');
  /* 순서: 표지(공통 첫 장) → 반별 앞 → 공통 본문 → 반별 뒤(시험지 부착 위치) → 끝(공통 마지막 장) */
  var first=common.length>1?common.shift():null,last=common.length>0?common.pop():null;
  return [].concat(first?[first]:[],front,common,back,last?[last]:[]);
}
function render(){
  var root=document.getElementById('root');
  if(!CUR){
    root.className='wrap landing';
    var star=function(pos,sz){return '<svg class="deco" style="'+pos+'" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1v22M1 12h22M4.2 4.2l15.6 15.6M19.8 4.2 4.2 19.8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';};
    root.innerHTML='<div class="hero">'+star('left:6%;top:18px',30)+star('right:8%;top:60px',22)+star('right:18%;top:14px',16)+star('left:15%;top:72px',14)+
      '<span class="brand">JLS 정상어학원</span><div class="welcome">Welcome to JLS!</div><h1>진급 OT 안내</h1>'+
      '<p>체스에서 에이스로 올라가는 학생들을 위한 OT 자료예요.<br>반을 골라 주세요.</p></div>'+
      '<div class="levels">'+LEVELS.map(function(l){return '<button class="lv" onclick="go(\''+l.k+'\''+(l.days?',\'mwf\'':'')+')"><span class="dot" style="background:'+l.color+'">'+esc(l.label.replace('반',''))+'</span><b>'+esc(l.label)+'</b><small>'+esc(l.sub)+'</small>'+(l.days?'<i>월수금 · 화목</i>':'')+'</button>';}).join('')+'</div>'+
      '<div class="tip">PA1 · PA2반은 반을 고른 뒤 월수금 / 화목 중에 골라요</div>';
    document.getElementById('bPrint').style.display='none';return;
  }
  document.getElementById('root').className='wrap';
  document.getElementById('bPrint').style.display=EDIT?'none':'';
  var slides=composeSlides();
  root.innerHTML='';
  slides.forEach(function(s,i){root.appendChild(s);deco(s);});
  if(EDIT)decorateEdit();
  fitAll();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
}

/* 세로 쪽 글자 크기 자동 맞춤 — 내용이 쪽을 꽉 채우도록 --s 를 이진탐색한다(0.6~1.9).
   예전 가로 슬라이드는 내용이 적은 요일에 아래가 텅 비어 보였다. 수정 중에도 글을 고치면 다시 맞춘다. */
function fitPort(s){
  /* 종류마다 '넘치는지'를 보는 칸이 다르다. 사진만 있는 슬라이드·표지는 맞출 글자가 없어 건너뛴다. */
  if(s.matches('.imgonly')){s.style.setProperty('--s',1.7);return;}
  if(s.matches('.cover,.imgcard,.full'))return;
  var over=function(){
    if(s.scrollHeight>s.clientHeight+1)return true;
    return [].some.call(s.querySelectorAll('.wp-body,.wp-band,.wp-bb,.w2-col,.nb-r,.nbm,.card-b,.time .cols,.time .col,.ev-rows,.ev-r'),function(p){return p.scrollHeight>p.clientHeight+1;});
  };
  /* 첫 주 일정(.wkp)은 전 반 글자 크기를 같게(운영자 요청: 쪽마다 크기가 달라 들쭉날쭉) — 1.0배 고정, 안 들어갈 때만 줄인다(키우지 않음) */
  var lo=0.5,hi=s.classList.contains('wkp')?1.0:s.classList.contains('ev')?1.0:2.2;
  for(var i=0;i<14;i++){var m=(lo+hi)/2;s.style.setProperty('--s',m);if(over())hi=m;else lo=m;}
  s.style.setProperty('--s',(s.classList.contains('wkp')||s.classList.contains('ev'))?lo:lo*0.97);   /* 딱 맞추면 글이 칸 테두리에 닿아 답답해 보여서 3% 여유 */
}
function fitAll(){document.querySelectorAll('.ot-slide').forEach(fitPort);}
var _fitT=null;
document.addEventListener('input',function(e){var s=e.target.closest&&e.target.closest('.ot-slide');if(!s)return;clearTimeout(_fitT);_fitT=setTimeout(function(){fitPort(s);},250);});
window.addEventListener('resize',function(){clearTimeout(_fitT);_fitT=setTimeout(fitAll,150);});


/* ---------- 수정 모드 ---------- */
var EDITABLE='h1,h2,li,td,th,.day,.per,.sub,.msg,.hl,.en,.hint-edit,.nb-n,.n,.cls-name:not([data-auto]),.wk-tag,.wk-book,.wk-l,.wk-h,.wk-n,.wk-foot,.wk-per,.w2-day,.w2-per,.w2-time,.w2-wk,.w2-sub,.w2-l,.w2-v,.w2-hwl,.w2-ref,.w2-foot,.w3-ph,.w3-pt,.wp-ph,.wp-pt,.ev-t,.ev-sub,.ev-lab,.ev-mh,.ev-mp,.ev-all,.ev-nm,.ev-ds,.ev-ok';
function decorateEdit(){
  document.querySelectorAll('.ot-slide').forEach(function(s){
    s.querySelectorAll(EDITABLE).forEach(function(e){e.setAttribute('contenteditable','true');});
    var ca=s.querySelector('[data-auto="cls"]');if(ca)ca.removeAttribute('contenteditable');
    var seg=s.getAttribute('data-seg');
    var lab=document.createElement('span');lab.className='seglab'+(seg==='common'?' c':'');lab.setAttribute('data-ui','1');lab.textContent=seg==='common'?'공통 · 모든 반에 같이 바뀜':'이 반만';s.appendChild(lab);
    var t=document.createElement('div');t.className='ot-tools';t.setAttribute('data-ui','1');
    var has=!!s.querySelector('table');
    t.innerHTML='<button data-a="up">↑</button><button data-a="down">↓</button><button data-a="dup">복제</button>'+(has?'<button data-a="row">행 추가</button><button data-a="col">열 추가</button>':'')+'<button class="d" data-a="del">삭제</button>';
    s.appendChild(t);
    var add=document.createElement('div');add.className='addrow';add.setAttribute('data-ui','1');add.setAttribute('data-for',seg);
    add.innerHTML='<button data-add="nb">＋ 노트형 슬라이드</button><button data-add="card">＋ 카드형 슬라이드</button><button data-add="shot">＋ 사진 슬라이드</button>';
    s.insertAdjacentElement('afterend',add);
  });
}
document.addEventListener('click',function(e){
  if(!EDIT)return;
  var b=e.target.closest('.ot-tools button');
  if(b){var s=b.closest('.ot-slide'),a=b.getAttribute('data-a');DIRTY=true;
    if(a==='del'){if(confirm('이 슬라이드를 지울까요?')){var ad=s.nextElementSibling;if(ad&&ad.classList.contains('addrow'))ad.remove();s.remove();}}
    else if(a==='up'||a==='down'){var sib=moveTarget(s,a==='up');if(sib){var ad2=s.nextElementSibling; if(a==='up'){sib.before(s);s.after(ad2);}else{var sibAd=sib.nextElementSibling;sibAd.after(s);s.after(ad2);} }}
    else if(a==='dup'){var c=s.cloneNode(true);c.querySelectorAll('[data-ui]').forEach(function(x){x.remove();});var ad3=s.nextElementSibling;ad3.after(c);decorateOne(c);}
    else if(a==='row'){var tb=s.querySelector('table tbody');if(tb){var tr=tb.lastElementChild.cloneNode(true);tr.querySelectorAll('td,th').forEach(function(c){if(c.tagName==='TD')c.innerHTML='<br>';});tb.appendChild(tr);decorateEditIn(tr);}}
    else if(a==='col'){s.querySelectorAll('table tr').forEach(function(tr){var c=document.createElement(tr.parentNode.tagName==='THEAD'?'th':'td');c.innerHTML='<br>';tr.appendChild(c);c.setAttribute('contenteditable','true');});}
    return;
  }
  var ab=e.target.closest('.addrow button');
  if(ab){var row=ab.closest('.addrow'),seg=row.getAttribute('data-for'),kind=ab.getAttribute('data-add');DIRTY=true;
    var n=newSlide(kind,seg);row.after(n);decorateOne(n);return;}
  var im=e.target.closest('.ot-slide img');
  if(im){pickImage(im);}
});
function moveTarget(s,up){ /* 같은 영역(공통/반별 앞/뒤) 안에서만 옮긴다 — 저장이 영역별로 되기 때문 */
  var seg=s.getAttribute('data-seg'),n=s;
  do{ n=up?n.previousElementSibling:n.nextElementSibling; }while(n&&!(n.classList&&n.classList.contains('ot-slide')));
  if(!n)return null;
  if(n.getAttribute('data-seg')!==seg){toast('다른 영역(공통↔반별)으로는 옮길 수 없어요',true);return null;}
  if(!up&&false)return null;
  return n;
}
function decorateOne(s){
  /* 새로 만든·복제한 슬라이드 하나에만 수정 도구를 붙인다 */
  var tmp=document.createElement('div');
  s.querySelectorAll(EDITABLE).forEach(function(e){e.setAttribute('contenteditable','true');});
  var seg=s.getAttribute('data-seg');
  var lab=document.createElement('span');lab.className='seglab'+(seg==='common'?' c':'');lab.setAttribute('data-ui','1');lab.textContent=seg==='common'?'공통 · 모든 반에 같이 바뀜':'이 반만';s.appendChild(lab);
  var t=document.createElement('div');t.className='ot-tools';t.setAttribute('data-ui','1');
  t.innerHTML='<button data-a="up">↑</button><button data-a="down">↓</button><button data-a="dup">복제</button>'+(s.querySelector('table')?'<button data-a="row">행 추가</button><button data-a="col">열 추가</button>':'')+'<button class="d" data-a="del">삭제</button>';
  s.appendChild(t);
  if(!(s.nextElementSibling&&s.nextElementSibling.classList.contains('addrow'))){
    var add=document.createElement('div');add.className='addrow';add.setAttribute('data-ui','1');add.setAttribute('data-for',seg);
    add.innerHTML='<button data-add="nb">＋ 노트형 슬라이드</button><button data-add="card">＋ 카드형 슬라이드</button><button data-add="shot">＋ 사진 슬라이드</button>';
    s.insertAdjacentElement('afterend',add);
  }
  deco(s);
}
function decorateEditIn(el){el.querySelectorAll('td,th').forEach(function(c){c.setAttribute('contenteditable','true');});}
function newSlide(kind,seg){
  var s=document.createElement('section');s.className='ot-slide '+(kind==='shot'?'card imgcard':kind);s.setAttribute('data-seg',seg);
  if(kind==='nb') s.innerHTML='<div class="nb-l"><span class="nb-n">00</span><h2>제목</h2></div><div class="nb-r"><ol class="items"><li>내용을 적어 주세요</li><li>내용을 적어 주세요</li><li>내용을 적어 주세요</li></ol></div>';
  else if(kind==='card') s.innerHTML='<h2 class="bar">제목</h2><div class="card-b"><ol class="items plain"><li>내용을 적어 주세요</li><li>내용을 적어 주세요</li></ol></div>';
  else s.innerHTML='<h2 class="bar">제목</h2><div class="card-b"><div class="pics"><img class="fit" src="" alt="사진을 눌러 바꿔 주세요" style="min-height:14cqw;min-width:30cqw;background:#EEF3FF"></div></div>';
  return s;
}
function fmt(cmd,val){document.execCommand(cmd,false,val||null);DIRTY=true;}
document.addEventListener('input',function(e){if(EDIT&&e.target.closest&&e.target.closest('.ot-slide'))DIRTY=true;});

/* 사진 바꾸기 — 큰 사진은 줄여서(가로 1600) guide-images 저장소에 올린다 */
var PICK_IMG=null;
function pickImage(im){PICK_IMG=im;document.getElementById('file').click();}
document.getElementById('file').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f||!PICK_IMG)return;
  if(!sb){toast('저장소에 연결하지 못했어요',true);return;}
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var W=Math.min(1600,img.width),H=Math.round(img.height*W/img.width),cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(img,0,0,W,H);URL.revokeObjectURL(url);
    cv.toBlob(function(b){
      var path='ot/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg',target=PICK_IMG;
      toast('사진을 올리는 중…');
      sb.storage.from('guide-images').upload(path,b,{contentType:'image/jpeg'}).then(function(r){
        if(r.error){toast('사진 올리기 실패: '+r.error.message,true);return;}
        target.src=sb.storage.from('guide-images').getPublicUrl(path).data.publicUrl;DIRTY=true;toast('사진을 바꿨어요 ✓ (저장을 눌러야 반영돼요)');
      });
    },'image/jpeg',0.86);
  };
  img.onerror=function(){toast('사진을 읽지 못했어요',true);};img.src=url;
});

function startEdit(){
  if(!CAN_EDIT)return;
  EDIT=true;DIRTY=false;document.body.classList.add('editing');
  ['bEdit','bPrint'].forEach(function(i){document.getElementById(i).style.display='none';});
  ['bSave','bCancel'].forEach(function(i){document.getElementById(i).style.display='';});
  render();
}
function cancelEdit(){
  if(DIRTY&&!confirm('고친 내용이 저장되지 않았어요. 버리고 나갈까요?'))return;
  EDIT=false;DIRTY=false;document.body.classList.remove('editing');
  ['bSave','bCancel'].forEach(function(i){document.getElementById(i).style.display='none';});
  ['bEdit','bPrint'].forEach(function(i){document.getElementById(i).style.display='';});
  document.getElementById('bEdit').style.display=CAN_EDIT?'':'none';
  render();
}
/* 화면에서 영역별(공통/반별 앞/뒤)로 모아서, 수정 도구를 뺀 깨끗한 HTML 로 만든다 */
function serialize(seg){
  var out='';
  document.querySelectorAll('.ot-slide[data-seg="'+seg+'"]').forEach(function(s){
    var c=s.cloneNode(true);
    c.querySelectorAll('[data-ui],[data-deco]').forEach(function(x){x.remove();});
    c.querySelectorAll('[contenteditable]').forEach(function(x){x.removeAttribute('contenteditable');});
    var a=c.querySelector('[data-auto="cls"]');if(a)a.textContent='';
    out+=c.outerHTML;
  });
  return out;
}
function saveAll(){
  if(!CAN_EDIT)return;
  if(!TABLE_OK){toast('sql/ot_guides.sql 을 먼저 실행해 주세요. 지금은 저장이 안 돼요',true);return;}
  var me=whoAmI(),now=new Date().toISOString();
  var rows=SEGS.map(function(seg){return {doc_key:docKey(seg),content_html:serialize(seg),updated_by:me,updated_at:now};});
  document.getElementById('bSave').disabled=true;
  sb.from('ot_guides').upsert(rows,{onConflict:'doc_key'}).then(function(r){
    document.getElementById('bSave').disabled=false;
    if(r.error){toast('저장 실패: '+r.error.message,true);return;}
    rows.forEach(function(x){DB[x.doc_key]=x.content_html;});
    DIRTY=false;toast('저장했어요 ✓ 공통 슬라이드는 모든 반에 반영돼요');cancelEdit();
  });
}
window.addEventListener('beforeunload',function(e){if(EDIT&&DIRTY){e.preventDefault();e.returnValue='';}});

(function init(){
  var q=new URLSearchParams(location.search),c=q.get('cls'),d=q.get('day');
  /* 예전 주소(?cls=pa1mwf 처럼 반과 요일이 붙은 꼴)도 알아듣는다 */
  var legacy={pa1mwf:['pa1','mwf'],pa1tt:['pa1','tt'],pa2mwf:['pa2','mwf']};
  if(legacy[c]){d=legacy[c][1];c=legacy[c][0];}
  LV=lvOf(c)?c:null;
  if(LV&&lvOf(LV).days){ DAY=(d==='tt'||d==='mwf')?d:'mwf'; }
  setCur();
  document.getElementById('who').textContent=CAN_EDIT?'수정 권한: 엄윤경':'';
  paintHeader();
  load(function(){
    paintNotice();
    if(CUR&&CAN_EDIT)document.getElementById('bEdit').style.display='';
    render();
  });
})();
</script>
