<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신입생 안내 관리</title>
<link rel="stylesheet" href="guide.css">
<script src="default-content.js"></script>
<script src="render.js"></script>
<style>
.g-login{max-width:360px;margin:80px auto;padding:0 20px;text-align:center}
.g-login input{width:100%;padding:12px;border:1px solid #D6DEF2;border-radius:10px;font-size:15px;margin-top:10px}
.g-login button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#2E4FA6;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.g-login .err{color:#C8375E;font-size:13px;margin-top:10px;min-height:1em}
</style>
</head>
<body class="g-has-toolbar">
<div id="g-toolbar" class="g-toolbar"></div>
<div id="g-root"><div class="g-empty">불러오는 중…</div></div>
<input type="file" id="g-file" accept="image/*" style="display:none">
<input type="file" id="g-hero-file" accept="image/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPA_URL='https://hplndiuoohantbalixwu.supabase.co';
var SUPA_KEY='sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X';
var sb = supabase.createClient(SUPA_URL, SUPA_KEY);

var EMBED = (function(){ try{ return new URLSearchParams(location.search).has('embed') && window.parent!==window; }catch(e){ return false; } })();
var curBranch = null;
var curHeroImage = null;
var editMode = false;
var rootEl = null;
var savedRange = null;
var savedPanel = null;

function paintLogin(err){
  document.getElementById('g-toolbar').innerHTML = '';
  document.getElementById('g-root').innerHTML =
    '<div class="g-login"><h2 class="g-disp">신입생 안내 관리</h2>'+
    '<p style="color:#6B7BA0;font-size:14px">통합관리 시스템에서 들어오면 자동으로 로그인돼요.<br>여기서 직접 열었다면 분원 코드를 입력해 주세요.</p>'+
    '<input id="g-code" placeholder="분원 코드 (예: seosuwonjls)">'+
    '<button onclick="manualLogin()">열기</button>'+
    '<div class="err">'+escG(err||'')+'</div></div>';
}

function manualLogin(){
  var code = document.getElementById('g-code').value.trim();
  if(!code) return;
  try{ localStorage.setItem('jls_guide_last_branch', code); }catch(e){}
  openEditor(code);
}
window.manualLogin = manualLogin;

function openEditor(branch){
  curBranch = branch;
  var name = GUIDE_BRANCH_NAMES[branch] || branch;
  rootEl = document.getElementById('g-root');
  editMode = false;
  renderToolbar();

  sb.from('branch_guides').select('content_html,hero_image_url').eq('branch_id', branch).maybeSingle()
    .then(function(res){
      var html = (res.data && res.data.content_html) || guideDefaultHtml(name);
      curHeroImage = (res.data && res.data.hero_image_url) || null;
      buildGuideShell(rootEl, name, curHeroImage);
      splitIntoTabs(rootEl, html);
      syncTabsOffset();
    });
}

function renderToolbar(){
  var bar = document.getElementById('g-toolbar');
  if(!editMode){
    bar.innerHTML =
      '<div class="g-toolbar-row">'+
      '<span class="g-saved" id="g-saved"></span>'+
      '<button onclick="copyLink()">링크 복사</button>'+
      '<button class="primary" onclick="enterEdit()">✎ 수정</button>'+
      '</div>';
  } else {
    bar.innerHTML =
      '<div class="g-toolbar-row">'+
      '<span class="g-saved" id="g-saved"></span>'+
      '<button onclick="copyLink()">링크 복사</button>'+
      '<button onclick="insertImage()">🖼 사진 추가</button>'+
      '<button class="save" onclick="saveGuide()">저장</button>'+
      '<button onclick="exitEdit()">완료</button>'+
      '</div>'+
      '<div class="g-toolbar-row">'+
      '<div class="g-shapewrap">'+
        '<button onclick="toggleShapeMenu()">⬜ 네모 추가</button>'+
        '<div class="g-shapemenu" id="g-shapemenu">'+
          '<button onclick="insertBox(\'square\')">□ 네모</button>'+
          '<button onclick="insertBox(\'round\')">▢ 둥근 네모</button>'+
          '<button onclick="insertBox(\'circle\')">○ 동그라미</button>'+
          '<button onclick="insertBox(\'sketch\')">📓 스케치북</button>'+
        '</div>'+
      '</div>'+
      '<label class="g-colorlbl">배경색 <input type="color" oninput="applyBoxBg(this.value)" value="#ffffff"></label>'+
      '<label class="g-colorlbl">글자색 <input type="color" oninput="applyTextColor(this.value)" value="#1C2A4A"></label>'+
      '<select onchange="applyFontSize(this.value);this.selectedIndex=0">'+
        '<option value="">글씨크기</option><option value="13">작게</option><option value="16">보통</option><option value="20">크게</option><option value="28">아주크게</option>'+
      '</select>'+
      '<select onchange="applyFontFamily(this.value);this.selectedIndex=0">'+
        '<option value="">글씨체</option>'+
        '<option value="\'Apple SD Gothic Neo\',sans-serif">기본체</option>'+
        '<option value="\'Jua\',sans-serif">둥근체</option>'+
        '<option value="\'Gaegu\',cursive">손글씨체</option>'+
      '</select>'+
      '<button onclick="applyLink()">🔗 링크</button>'+
      '</div>';
  }
  syncTabsOffset();
}

function syncTabsOffset(){
  var bar = document.getElementById('g-toolbar');
  var tabs = document.querySelector('.g-tabs');
  if(bar && tabs) tabs.style.top = bar.offsetHeight + 'px';
}

function enterEdit(){
  editMode = true;
  renderToolbar();
  rootEl.querySelectorAll('.g-panel').forEach(function(p){ p.contentEditable='true'; });
  showHeroEditBtn();
}
window.enterEdit = enterEdit;

function exitEdit(){
  editMode = false;
  renderToolbar();
  rootEl.querySelectorAll('.g-panel').forEach(function(p){ p.contentEditable='false'; });
  hideHeroEditBtn();
}
window.exitEdit = exitEdit;

function copyLink(){
  var url = location.origin + location.pathname.replace(/guide-app\/index\.html$/, 'guide.html') + '?branch=' + encodeURIComponent(curBranch);
  navigator.clipboard.writeText(url).then(function(){
    var s=document.getElementById('g-saved'); if(s){ s.textContent='링크 복사됨'; setTimeout(function(){s.textContent='';},1800); }
  });
}
window.copyLink = copyLink;

document.addEventListener('selectionchange', function(){
  if(!editMode) return;
  var sel = window.getSelection();
  if(!sel.rangeCount) return;
  var node = sel.anchorNode;
  var el = node && (node.nodeType===3 ? node.parentElement : node);
  var panel = el && el.closest && el.closest('.g-panel');
  if(panel){ savedRange = sel.getRangeAt(0).cloneRange(); savedPanel = panel; }
});

/* 네모칸을 클릭해두면, 색 피커를 눌러 포커스가 넘어가도(선택이 풀려도) 어느 네모칸인지 기억한다 */
var savedBox = null;
document.addEventListener('click', function(e){
  if(!editMode || !rootEl) return;
  if(!rootEl.contains(e.target)) return;
  var box = e.target.closest && e.target.closest('.g-box');
  savedBox = box || null;
});

function restoreSelection(){
  if(!savedPanel || !savedRange) return false;
  savedPanel.focus();
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);
  return !sel.isCollapsed;
}

function toggleShapeMenu(){
  var m = document.getElementById('g-shapemenu');
  if(m) m.classList.toggle('show');
}
window.toggleShapeMenu = toggleShapeMenu;

var gBoxSeq = 0;
function insertBox(shape){
  document.getElementById('g-shapemenu').classList.remove('show');
  var panel = rootEl.querySelector('.g-panel.on');
  if(!panel) return;
  gBoxSeq++;
  var top = 20 + (gBoxSeq % 6) * 60;
  var posStyle = shape === 'circle'
    ? ('left:'+(10 + (gBoxSeq % 4) * 15)+'%;top:'+top+'px')   // 동그라미만 가로세로 자유 배치
    : ('left:0;top:'+top+'px');                                // 네모류는 글 카드랑 같은 너비로, 세로만 옮김
  var gid = 'gbox-'+Date.now()+'-'+gBoxSeq;
  var html = '<div class="g-box g-box-'+shape+'" style="'+posStyle+'" data-gid="'+gid+'">'+
    '<span class="g-box-handle" contenteditable="false">⠿</span>'+
    '<span class="g-box-del" contenteditable="false" onclick="deleteBox(this)">✕</span>'+
    '텍스트를 입력하세요</div>';
  panel.insertAdjacentHTML('beforeend', html);
  var inserted = panel.querySelector('[data-gid="'+gid+'"]');
  if(!inserted) return;
  inserted.removeAttribute('data-gid');
  savedBox = inserted;

  // 바로 타이핑할 수 있도록 안내 글자를 선택된 상태로 둔다 (클릭 안 해도 바로 써짐)
  panel.focus();
  var textNode = Array.prototype.filter.call(inserted.childNodes, function(n){ return n.nodeType===3; })[0];
  if(textNode){
    var range = document.createRange();
    range.selectNodeContents(textNode);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    savedRange = range.cloneRange();
    savedPanel = panel;
  }
}
window.insertBox = insertBox;

function deleteBox(btn){
  var box = btn.closest('.g-box');
  if(box) box.remove();
}
window.deleteBox = deleteBox;

/* 네모칸을 손잡이(⠿)로 끌어서 자유롭게 옮긴다. 가로는 %, 세로는 px로 저장해서
   화면 폭이 달라져도(특히 휴대폰) 너무 어긋나지 않게 한다. */
var dragState = null;
document.addEventListener('mousedown', startBoxDrag);
document.addEventListener('touchstart', startBoxDrag, { passive:false });

function startBoxDrag(e){
  if(!editMode) return;
  var handle = e.target.closest && e.target.closest('.g-box-handle');
  if(!handle) return;
  e.preventDefault();
  var box = handle.closest('.g-box');
  var panel = box.closest('.g-panel');
  if(!box || !panel) return;
  savedBox = box;
  box.classList.add('g-dragging');
  var pt = e.touches ? e.touches[0] : e;
  var boxRect = box.getBoundingClientRect();
  dragState = { box: box, panel: panel, offsetX: pt.clientX - boxRect.left, offsetY: pt.clientY - boxRect.top };
  document.addEventListener('mousemove', onBoxDrag);
  document.addEventListener('mouseup', endBoxDrag);
  document.addEventListener('touchmove', onBoxDrag, { passive:false });
  document.addEventListener('touchend', endBoxDrag);
}

function onBoxDrag(e){
  if(!dragState) return;
  e.preventDefault();
  var pt = e.touches ? e.touches[0] : e;
  var panelRect = dragState.panel.getBoundingClientRect();
  var y = pt.clientY - panelRect.top - dragState.offsetY;
  dragState.box.style.top = Math.max(0, y) + 'px';
  // 동그라미만 카드 너비에 안 묶여 있어서 가로로도 옮길 수 있다
  if(dragState.box.classList.contains('g-box-circle')){
    var x = pt.clientX - panelRect.left - dragState.offsetX;
    var pct = Math.max(0, Math.min(80, (x / panelRect.width) * 100));
    dragState.box.style.left = pct + '%';
  }
}

function endBoxDrag(){
  if(dragState) dragState.box.classList.remove('g-dragging');
  dragState = null;
  document.removeEventListener('mousemove', onBoxDrag);
  document.removeEventListener('mouseup', endBoxDrag);
  document.removeEventListener('touchmove', onBoxDrag);
  document.removeEventListener('touchend', endBoxDrag);
}

function applyBoxBg(color){
  if(savedBox) savedBox.style.background = color;
}
window.applyBoxBg = applyBoxBg;

function applyTextColor(color){
  if(!restoreSelection()) return;
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  document.execCommand('foreColor', false, color);
}
window.applyTextColor = applyTextColor;

function wrapSelectionStyle(styleStr){
  if(!restoreSelection()) return;
  var sel = window.getSelection();
  var range = sel.getRangeAt(0);
  var span = document.createElement('span');
  span.setAttribute('style', styleStr);
  try{
    span.appendChild(range.extractContents());
    range.insertNode(span);
  }catch(e){
    document.execCommand('insertHTML', false, '<span style="'+styleStr+'">'+escG(sel.toString())+'</span>');
  }
}

function applyFontSize(px){
  if(!px) return;
  wrapSelectionStyle('font-size:'+px+'px');
}
window.applyFontSize = applyFontSize;

function applyFontFamily(fam){
  if(!fam) return;
  wrapSelectionStyle('font-family:'+fam);
}
window.applyFontFamily = applyFontFamily;

function applyLink(){
  if(!restoreSelection()){ alert('링크를 걸 글자를 먼저 선택해 주세요.'); return; }
  var url = prompt('연결할 주소를 입력하세요 (https://로 시작)', 'https://');
  if(!url) return;
  document.execCommand('createLink', false, url);
  var sel = window.getSelection();
  var node = sel.anchorNode;
  var a = node && node.parentElement && node.parentElement.closest('a');
  if(a){ a.target='_blank'; a.rel='noopener'; a.classList.add('g-link'); }
}
window.applyLink = applyLink;

function insertImage(){ document.getElementById('g-file').click(); }
window.insertImage = insertImage;

function onFilePicked(e){
  var file = e.target.files[0];
  e.target.value='';
  if(!file) return;
  var saved = document.getElementById('g-saved');
  saved.textContent = '업로드 중…';
  var path = curBranch + '/' + Date.now() + '-' + file.name.replace(/[^\w.\-]/g,'_');
  sb.storage.from('guide-images').upload(path, file).then(function(res){
    if(res.error){ saved.textContent='업로드 실패: '+res.error.message; return; }
    var url = sb.storage.from('guide-images').getPublicUrl(path).data.publicUrl;
    if(savedPanel) savedPanel.focus();
    var sel = window.getSelection();
    if(savedRange){ sel.removeAllRanges(); sel.addRange(savedRange); }
    document.execCommand('insertHTML', false, '<img class="g-img" src="'+url+'">');
    saved.textContent = '사진 추가됨';
    setTimeout(function(){saved.textContent='';},1800);
  });
}

function showHeroEditBtn(){
  var hero = document.getElementById('g-hero-box');
  if(!hero) return;
  var old = document.getElementById('g-hero-editbox'); if(old) old.remove();
  var box = document.createElement('div');
  box.id = 'g-hero-editbox';
  box.className = 'g-hero-editbox';
  box.innerHTML =
    '<button type="button" onclick="insertHeroImage()">'+(curHeroImage?'배너 그림 바꾸기':'배너 그림 추가')+'</button>'+
    (curHeroImage ? '<button type="button" onclick="clearHeroImage()">지우기</button>' : '');
  hero.appendChild(box);
}
function hideHeroEditBtn(){
  var box = document.getElementById('g-hero-editbox');
  if(box) box.remove();
}

function setHeroArt(url){
  var hero = document.getElementById('g-hero-box');
  if(!hero) return;
  hero.querySelectorAll('.g-hero-img, svg.deco').forEach(function(n){ n.remove(); });
  var artHtml = url
    ? '<img class="g-hero-img" src="'+url+'" alt="">'
    : heroDeco('left:6%;top:18px',30)+heroDeco('right:8%;top:60px',22)+heroDeco('right:16%;top:14px',16,true)+heroDeco('left:14%;top:70px',14,true);
  hero.insertAdjacentHTML('afterbegin', artHtml);
}

function insertHeroImage(){ document.getElementById('g-hero-file').click(); }
window.insertHeroImage = insertHeroImage;

function onHeroFilePicked(e){
  var file = e.target.files[0];
  e.target.value='';
  if(!file) return;
  var saved = document.getElementById('g-saved');
  saved.textContent = '배너 업로드 중…';
  var path = curBranch + '/hero-' + Date.now() + '-' + file.name.replace(/[^\w.\-]/g,'_');
  sb.storage.from('guide-images').upload(path, file).then(function(res){
    if(res.error){ saved.textContent='업로드 실패: '+res.error.message; return; }
    var url = sb.storage.from('guide-images').getPublicUrl(path).data.publicUrl;
    curHeroImage = url;
    setHeroArt(url);
    showHeroEditBtn();
    return sb.from('branch_guides').upsert({ branch_id: curBranch, hero_image_url: url, updated_at: new Date().toISOString() }, { onConflict: 'branch_id' });
  }).then(function(res){
    if(!res) return; // 업로드 자체가 실패해서 위에서 이미 멈춘 경우
    saved.textContent = res.error ? ('저장 실패: '+res.error.message) : '배너 저장됨';
    setTimeout(function(){saved.textContent='';},2500);
  });
}

function clearHeroImage(){
  curHeroImage = null;
  setHeroArt(null);
  showHeroEditBtn();
  var saved = document.getElementById('g-saved');
  saved.textContent = '지우는 중…';
  sb.from('branch_guides').upsert({ branch_id: curBranch, hero_image_url: null, updated_at: new Date().toISOString() }, { onConflict: 'branch_id' })
    .then(function(res){
      saved.textContent = res.error ? ('지우기 실패: '+res.error.message) : '배너 지워짐';
      setTimeout(function(){saved.textContent='';},2500);
    });
}
window.clearHeroImage = clearHeroImage;

function saveGuide(){
  var html = joinTabsHtml(rootEl);
  var saved = document.getElementById('g-saved');
  saved.textContent = '저장 중…';
  sb.from('branch_guides').upsert({ branch_id: curBranch, content_html: html, updated_at: new Date().toISOString() }).then(function(res){
    saved.textContent = res.error ? ('저장 실패: '+res.error.message) : '저장됨';
    setTimeout(function(){saved.textContent='';},2000);
  });
}
window.saveGuide = saveGuide;

document.getElementById('g-file').addEventListener('change', onFilePicked);
document.getElementById('g-hero-file').addEventListener('change', onHeroFilePicked);
window.addEventListener('resize', syncTabsOffset);
document.addEventListener('click', function(e){
  var m = document.getElementById('g-shapemenu');
  if(m && m.classList.contains('show') && !e.target.closest('.g-shapewrap')) m.classList.remove('show');
});

(function init(){
  if(EMBED){
    window.addEventListener('message', function(e){
      if(e.origin !== location.origin) return;
      var d = e.data || {};
      if(d.type==='jls-books-branch' && d.branch){ openEditor(d.branch); }
    });
    try{ window.parent.postMessage({type:'jls-books-ready'},'*'); }catch(e){}
    var s=null; try{ s=sessionStorage.getItem('jls_branch'); }catch(e){}
    if(s) openEditor(s); else paintLogin('');
    return;
  }
  var fromUrl=null; try{ fromUrl=new URLSearchParams(location.search).get('branch'); }catch(e){}
  if(fromUrl){ try{ localStorage.setItem('jls_guide_last_branch', fromUrl); }catch(e){} openEditor(fromUrl); return; }
  var fromSession=null; try{ fromSession=sessionStorage.getItem('jls_branch'); }catch(e){}
  if(fromSession){ openEditor(fromSession); return; }
  var fromLocal=null; try{ fromLocal=localStorage.getItem('jls_guide_last_branch'); }catch(e){}
  if(fromLocal){ openEditor(fromLocal); return; }
  paintLogin('');
})();
</script>
</body>
</html>
