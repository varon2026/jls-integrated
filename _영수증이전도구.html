<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>영수증 파일 이전</title>
<style>
  body{font-family:"NanumSquare","Apple SD Gothic Neo",sans-serif;background:#f7f5fb;color:#2f3138;max-width:760px;margin:0 auto;padding:28px}
  h1{font-size:20px;margin-bottom:6px}.sub{color:#6b6385;font-size:13px;margin-bottom:18px;line-height:1.6}
  .warn{background:#fdf3e6;border:1px solid #f2d9b0;border-radius:10px;padding:12px 14px;font-size:13px;color:#8a5a1c;margin-bottom:16px;line-height:1.6}
  button{background:linear-gradient(135deg,#8b6ee8,#a385f0);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;padding:14px 26px;cursor:pointer;box-shadow:0 4px 14px rgba(139,110,232,.3)}
  button:disabled{opacity:.5;cursor:default}
  .bar{height:14px;background:#ece8f5;border-radius:8px;overflow:hidden;margin:16px 0}
  .fill{height:100%;background:linear-gradient(135deg,#8b6ee8,#a385f0);width:0;transition:width .2s}
  .stat{font-size:14px;font-weight:800;margin:8px 0}
  #log{margin-top:12px;background:#fff;border:1px solid #ece8f5;border-radius:12px;padding:14px;font-size:12px;white-space:pre-wrap;max-height:280px;overflow:auto;line-height:1.6;color:#4a4460}
  .ok{color:#2fa878}.err{color:#e2557a}
</style></head><body>
<h1>영수증 파일 이전 (운영비 → 메인 스토리지)</h1>
<div class="sub">exp_entries·exp_bank_transactions의 영수증 URL을 훑어서, 파일을 <b>메인 DB의 receipts 버킷</b>으로 복사하고 주소를 갱신합니다.<br>원본 파일은 그대로 두고 <b>복사만</b> 합니다.</div>
<div class="warn">✅ 먼저 메인에 <b>receipts 버킷(Public) + 권한 policy</b>를 만들어 두세요.<br>🔁 여러 번 돌려도 안전 — 이미 옮긴 건 자동으로 건너뜁니다.</div>
<button id="go" onclick="run()">▶ 영수증 이전 시작</button>
<div class="stat" id="stat"></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="log"></div>
<script>
const OLD_HOST='ktizqdrhndefvoeltjko.supabase.co';
const MAIN={host:'hplndiuoohantbalixwu.supabase.co', key:'sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X'};
const REST='https://'+MAIN.host+'/rest/v1';
const $=s=>document.querySelector(s);
function log(m){const el=$('#log');el.textContent+=m+'\n';el.scrollTop=el.scrollHeight;}
function H(extra){return Object.assign({apikey:MAIN.key,'Authorization':'Bearer '+MAIN.key},extra||{});}
async function rows(table,col){const r=await fetch(REST+'/'+table+'?select=id,'+col+'&'+col+'=not.is.null',{headers:H({'Range-Unit':'items','Range':'0-99999'})});if(!r.ok)throw new Error(table+' 읽기 '+r.status);return r.json();}
function pathOf(url){const i=url.indexOf('/object/public/receipts/');return i<0?null:url.slice(i+'/object/public/receipts/'.length);}
async function migrateOne(url){
  const path=pathOf(url); if(!path) return {skip:true};
  // 파일 받아오기 (원본 public URL)
  const fr=await fetch(url); if(!fr.ok) throw new Error('파일 다운 '+fr.status);
  const buf=await fr.arrayBuffer(); const ctype=fr.headers.get('content-type')||'application/octet-stream';
  // 메인 스토리지에 업로드 (같은 경로)
  const up=await fetch('https://'+MAIN.host+'/storage/v1/object/receipts/'+path.split('/').map(encodeURIComponent).join('/'),
    {method:'POST',headers:H({'Content-Type':ctype,'x-upsert':'true'}),body:buf});
  if(!up.ok) throw new Error('업로드 '+up.status+' '+await up.text());
  return {newUrl:'https://'+MAIN.host+'/storage/v1/object/public/receipts/'+path};
}
async function patch(table,id,col,val){const r=await fetch(REST+'/'+table+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:H({'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify({[col]:val})});if(!r.ok)throw new Error('주소갱신 '+r.status);}
async function run(){
  $('#go').disabled=true; $('#log').textContent='';
  const jobs=[];
  for(const t of [['exp_entries','receipt_url'],['exp_bank_transactions','draft_receipt_url']]){
    const rs=await rows(t[0],t[1]); rs.forEach(r=>jobs.push({table:t[0],col:t[1],id:r.id,url:r[t[1]]}));
  }
  const todo=jobs.filter(j=>j.url&&j.url.includes(OLD_HOST));
  const already=jobs.length-todo.length;
  log('총 영수증 '+jobs.length+'건 · 이전 대상 '+todo.length+'건 · 이미 완료 '+already+'건');
  let done=0,fail=0;
  for(const j of todo){
    try{
      const res=await migrateOne(j.url);
      if(res.skip){ log('· skip(경로해석 실패): '+j.url.slice(-40)); continue; }
      await patch(j.table,j.id,j.col,res.newUrl);
      done++; log('✓ '+j.table+' #'+j.id);
    }catch(e){ fail++; log('✗ '+j.table+' #'+j.id+' : '+e.message); }
    const p=Math.round((done+fail)/todo.length*100); $('#fill').style.width=p+'%'; $('#stat').textContent=`진행 ${done+fail}/${todo.length} (성공 ${done}, 실패 ${fail})`;
  }
  $('#stat').innerHTML = fail===0
    ? `<span class="ok">✓ 영수증 이전 완료! (${done}건 복사 + 주소 갱신, 이미완료 ${already})</span>`
    : `<span class="err">일부 실패 ${fail}건 — 로그 확인 후 다시 돌리면 실패분만 재시도됩니다.</span>`;
  $('#go').disabled=false;
}
</script></body></html>
