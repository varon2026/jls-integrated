<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>교재 → 메인 DB 데이터 이전</title>
<style>
  body{font-family:"NanumSquare","Apple SD Gothic Neo",sans-serif;background:#f7f5fb;color:#2f3138;max-width:820px;margin:0 auto;padding:28px}
  h1{font-size:20px;margin-bottom:6px}
  .sub{color:#6b6385;font-size:13px;margin-bottom:20px;line-height:1.6}
  .warn{background:#fdf3e6;border:1px solid #f2d9b0;border-radius:10px;padding:12px 14px;font-size:13px;color:#8a5a1c;margin-bottom:18px;line-height:1.6}
  button{background:linear-gradient(135deg,#8b6ee8,#a385f0);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;padding:14px 26px;cursor:pointer;box-shadow:0 4px 14px rgba(139,110,232,.3)}
  button:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid #ece8f5}
  th{color:#6b6385;font-size:12px}
  .st{font-weight:800}
  .ok{color:#2fa878}.err{color:#e2557a}.run{color:#8b6ee8}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  #log{margin-top:18px;background:#fff;border:1px solid #ece8f5;border-radius:12px;padding:14px;font-size:12.5px;white-space:pre-wrap;max-height:280px;overflow:auto;line-height:1.7;color:#4a4460}
  .done{margin-top:16px;font-weight:800;font-size:15px}
</style></head><body>
<h1>교재 → 메인 DB 데이터 이전</h1>
<div class="sub">교재 프로젝트(varonnetworks)의 데이터를 <b>메인 DB(jls-counseling)의 bk_ 테이블</b>로 복사합니다.<br>원본 교재 데이터는 <b>그대로 유지</b>되고 복사만 합니다. 원본은 하나도 안 건드립니다.</div>
<div class="warn">⚠️ 복사 전에 교재 홈페이지(입력)가 <b>멈춰 있어야</b> 누락이 없습니다. (다슬 대리님이 닫음 ✓)<br>🔁 여러 번 돌려도 안전 — 이미 데이터가 있는 테이블은 건너뜁니다.<br>아래 표에서 <b>원본 건수 = 복사 건수</b> 맞는지 꼭 확인하세요.</div>
<button id="go" onclick="run()">▶ 이전 시작</button>
<table id="tbl"><thead><tr><th>테이블</th><th class="num">원본(교재)</th><th class="num">복사 후(메인)</th><th>상태</th></tr></thead><tbody></tbody></table>
<div id="done" class="done"></div>
<div id="log"></div>
<script>
const SRC={url:'https://cvygjxnaexwutbabtixu.supabase.co/rest/v1', key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2eWdqeG5hZXh3dXRiYWJ0aXh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3Mjg2NjksImV4cCI6MjA5MTMwNDY2OX0.QNtRpqoXiC5JUfQYkQ8uOq0cFwq5wFstECu3me_eVUY'};
const DST={url:'https://hplndiuoohantbalixwu.supabase.co/rest/v1', key:'sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X'};
const TABLES=[
  {src:'vendors',            dst:'bk_vendors'},
  {src:'semesters',          dst:'bk_semesters'},
  {src:'teachers',           dst:'bk_teachers'},
  {src:'books',              dst:'bk_books'},
  {src:'students',           dst:'bk_students'},
  {src:'students_history',   dst:'bk_students_history'},
  {src:'student_enrollments',dst:'bk_student_enrollments'},
  {src:'barcode_history',    dst:'bk_barcode_history'},
  {src:'bank_transactions',  dst:'bk_bank_transactions'},
  {src:'loan_history',       dst:'bk_loan_history'},
  {src:'payments',           dst:'bk_payments'},
  {src:'sales_history',      dst:'bk_sales_history'},
  {src:'transfers',          dst:'bk_transfers'},
];
const $=s=>document.querySelector(s), tbody=document.querySelector('#tbl tbody');
function log(m){ const el=$('#log'); el.textContent+=m+'\n'; el.scrollTop=el.scrollHeight; }
function H(cfg,extra){ return Object.assign({apikey:cfg.key,'Authorization':'Bearer '+cfg.key}, extra||{}); }
// 페이지 단위(1000개씩)로 전량 읽기 — 큰 테이블도 누락 없이
async function getAll(cfg,t){
  const all=[]; let from=0; const size=1000;
  while(true){
    const r=await fetch(cfg.url+'/'+t+'?select=*',{headers:H(cfg,{'Range-Unit':'items','Range':from+'-'+(from+size-1)})});
    if(!r.ok) throw new Error('읽기 '+r.status+' '+await r.text());
    const rows=await r.json();
    all.push(...rows);
    if(rows.length<size) break;
    from+=size;
  }
  return all;
}
async function count(cfg,t){
  const r=await fetch(cfg.url+'/'+t+'?select=*',{headers:H(cfg,{'Prefer':'count=exact','Range-Unit':'items','Range':'0-0'})});
  const cr=r.headers.get('content-range')||''; return parseInt((cr.split('/')[1]||'0'))||0;
}
async function insert(cfg,t,rows){
  for(let i=0;i<rows.length;i+=500){
    const b=rows.slice(i,i+500);
    const r=await fetch(cfg.url+'/'+t,{method:'POST',headers:H(cfg,{'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify(b)});
    if(!r.ok) throw new Error('쓰기 '+r.status+' '+await r.text());
  }
}
async function run(){
  $('#go').disabled=true; tbody.innerHTML=''; $('#done').textContent='';
  let allOk=true, totalCopied=0;
  for(const m of TABLES){
    const tr=document.createElement('tr'); tr.innerHTML=`<td><b>${m.src}</b> → ${m.dst}</td><td class="num s-src">…</td><td class="num s-dst">…</td><td class="st run">진행중</td>`; tbody.appendChild(tr);
    try{
      log('▶ '+m.src+' 읽는 중…');
      const rows=await getAll(SRC,m.src);
      tr.querySelector('.s-src').textContent=rows.length.toLocaleString();
      const already=await count(DST,m.dst);
      if(already>0){ tr.querySelector('.s-dst').textContent=already.toLocaleString(); const okS=(already===rows.length); tr.querySelector('.st').className='st '+(okS?'ok':'err'); tr.querySelector('.st').textContent=okS?'✓ 이미 완료':'✗ 건수불일치'; if(okS) totalCopied+=already; else allOk=false; log('  → '+m.dst+' 이미 '+already+'건 (원본 '+rows.length+') '+(okS?'일치':'불일치')); continue; }
      if(rows.length){ log('  '+m.dst+'에 '+rows.length+'건 복사 중…'); await insert(DST,m.dst,rows); }
      const dst=await count(DST,m.dst);
      tr.querySelector('.s-dst').textContent=dst.toLocaleString();
      const ok=(dst===rows.length);
      tr.querySelector('.st').className='st '+(ok?'ok':'err'); tr.querySelector('.st').textContent=ok?'✓ 완료':'✗ 건수불일치';
      if(ok) totalCopied+=dst; else allOk=false;
      log('  ✓ '+m.dst+' 완료 ('+dst+'/'+rows.length+')');
    }catch(e){ tr.querySelector('.st').className='st err'; tr.querySelector('.st').textContent='✗ 오류'; log('  ✗ 오류: '+e.message); allOk=false; }
  }
  $('#done').innerHTML = allOk
    ? `<span class="ok">✓ 전체 이전 완료! 총 ${totalCopied.toLocaleString()}건. 표에서 원본=복사 건수 맞는지 확인하세요.</span>`
    : `<span class="err">일부 실패/불일치. 로그 확인하고 클로드에게 알려주세요.</span>`;
  $('#go').disabled=false;
}
</script></body></html>
