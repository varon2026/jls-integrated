<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신입생 안내 · JLS</title>
<link rel="stylesheet" href="guide-app/guide.css?v=5">
<script src="guide-app/default-content.js?v=5"></script>
<script src="guide-app/render.js?v=5"></script>
</head>
<body>
<div id="g-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPA_URL='https://hplndiuoohantbalixwu.supabase.co';
var SUPA_KEY='sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X';
var sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;

function paintEmpty(msg){
  document.getElementById('g-root').innerHTML =
    '<div class="g-hero"><span class="brand">JLS 정상어학원</span><h1 class="g-disp">신입생 안내</h1></div>'+
    '<div class="g-empty">'+escG(msg)+'</div>';
}

function paintGuide(branchCode, html, heroImageUrl){
  var name = (window.GUIDE_BRANCH_NAMES && GUIDE_BRANCH_NAMES[branchCode]) || '';
  var root = document.getElementById('g-root');
  buildGuideShell(root, name, heroImageUrl);
  splitIntoTabs(root, html);
}

(function init(){
  var branch = new URLSearchParams(location.search).get('branch');
  if(!branch){ paintEmpty('분원 안내 링크가 아니에요. 분원에서 보내준 링크를 다시 확인해 주세요.'); return; }
  if(!sb){ paintEmpty('페이지를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }

  sb.from('branch_guides').select('content_html,hero_image_url').eq('branch_id', branch).maybeSingle()
    .then(function(res){
      var html = res.data && res.data.content_html;
      if(!html){ html = guideDefaultHtml(GUIDE_BRANCH_NAMES[branch]); }
      paintGuide(branch, html, res.data && res.data.hero_image_url);
    })
    .catch(function(){ paintEmpty('페이지를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); });
})();
</script>
</body>
</html>
