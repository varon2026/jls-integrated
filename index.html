<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b6ee8">
<title>JLS 통합 관리 시스템</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="inwon.css">
<link rel="stylesheet" href="books.css">
</head>
<body>

<!-- 로딩 -->
<div id="loading"><div class="spin"></div><div class="lt">데이터 불러오는 중…</div></div>

<!-- 로그인 -->
<div id="loginView" class="hide">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-mark">JLS</div>
      <div><h1>정상어학원 통합관리</h1><p>원무 · 총무 · 인사 · 운영 통합 콘솔</p></div>
    </div>
    <div class="field"><label>아이디</label><input id="loginId" type="text" autocomplete="username" placeholder="아이디 입력"></div>
    <div class="field"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호 입력"></div>
    <button class="login-btn" id="loginBtn">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- 앱 -->
<div id="appView" class="hide">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand"><div class="sb-mark">JLS</div><div><div class="t">정상어학원</div><div class="s" id="sbScope">통합관리</div></div></div>
      <nav class="sb-nav" id="sbNav"></nav>
      <div class="sb-foot">
        <div class="sb-user"><div class="sb-avatar" id="sbAvatar">A</div><div><div class="un" id="sbUserName">관리자</div><div class="ur" id="sbUserRole">admin</div></div></div>
        <button class="sb-logout" id="logoutBtn">로그아웃</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"><b>대시보드</b></div>
        <div class="topbar-spacer"></div>
        <div class="pick" id="semPick"><span>학기</span><select id="semSelect"></select></div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="ltXlsx" accept=".xlsx,.xls" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>/* 캐시 무효화: 배포할 때마다 최신 app.js를 강제로 불러옴 (옛 코드 캐시 방지) */
document.write('<scr'+'ipt src="app.js?v='+Date.now()+'"></scr'+'ipt>');</script>
<script src="inwon.js"></script>
<script src="books.js"></script>
</body>
</html>
