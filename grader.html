<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험채점 (DT·AT·내신모의고사)</title>
<style>
:root{--brand:#8b6ee8;--brand2:#a385f0;--soft:#f0ebfe;--ink:#2f3138;--ink2:#6b6385;--ink3:#9a93b0;
--line:#ece8f5;--line2:#f4f1fb;--bg:#f7f5fb;--card:#fff;--pos:#22a06b;--pos-s:#e4f6ee;--neg:#e5484d;--neg-s:#fdecec;--warn:#d9822b;--chess:#7a5ce0;--ace:#4e7ca6}
*{box-sizing:border-box}
body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.wrap{max-width:1250px;margin:0 auto;padding:16px 14px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.status.ok{background:var(--pos-s);color:var(--pos)}.status.err{background:var(--neg-s);color:var(--neg)}
.examtabs{display:flex;gap:8px;margin-bottom:12px}
.examtabs button{flex:1;border:1px solid var(--line);background:#fff;font:inherit;font-weight:800;color:var(--ink2);padding:12px;border-radius:12px;cursor:pointer;font-size:15px}
.examtabs button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(139,110,232,.3)}
.subtabs{display:flex;gap:6px;background:#efeafb;border-radius:11px;padding:5px;margin-bottom:16px}
.subtabs button{flex:1;border:none;background:none;font:inherit;font-weight:800;color:#8a83a0;padding:9px;border-radius:8px;cursor:pointer;font-size:13px}
.subtabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(120,105,160,.14)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(80,70,120,.05)}
.card h3{margin:0 0 12px;font-size:15px}
label{font-size:12px;font-weight:700;color:var(--ink3);display:block;margin-bottom:5px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);background:#fff;outline:none;width:100%}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:120px}
button.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
button.mini{padding:5px 10px;font-size:12px;border-radius:8px}
button.danger{color:var(--neg);border-color:#f3cdcf;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line2);text-align:left}
th{font-size:11.5px;color:var(--ink3);background:var(--line2)}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
.tag.chess{background:#efe9fc;color:var(--chess)}.tag.ace{background:#e9f0fb;color:var(--ace)}
.hint{font-size:11.5px;color:var(--ink3)}
.grid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:70vh}
.gtbl td,.gtbl th{white-space:nowrap;text-align:center;padding:4px;border:1px solid var(--line2)}
.gtbl th.stu,.gtbl td.stu{text-align:left;position:sticky;left:0;background:#fff;z-index:2;min-width:130px}
.gtbl th{position:sticky;top:0;background:var(--line2);z-index:1}
.gtbl th.part{background:#efeafb;color:var(--brand)}
.gtbl input{width:36px;padding:5px 2px;text-align:center;border-radius:6px}
.qcell.ok input{background:var(--pos-s);border-color:#b6e2cd}
.qcell.no input{background:var(--neg-s);border-color:#f3c5c7}
.sacell input{background:#fffdf5;border-color:#eadfb8}
.scorecell{font-weight:800;color:var(--brand)}
.cfg-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin:4px 6px 0 0;font-weight:800;font-size:12px;cursor:pointer;background:#fff}
.cfg-chip.on{background:var(--pos-s);color:var(--pos);border-color:#b6e2cd}
.cfg-chip.off{background:#f4f1fb;color:var(--ink3);text-decoration:line-through}
.pbar{position:relative;height:22px;background:var(--line2);border-radius:20px;overflow:hidden;min-width:120px}
.pbar>div{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.pbar span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:var(--ink2)}
.keylist-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2f2b3a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1}.toast.err{background:#b23a55}
@media(max-width:640px){.row>div{min-width:calc(50% - 5px)}.examtabs button{font-size:13px;padding:10px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>시험채점</h1><span id="conn" class="status">연결 중…</span><span id="seminfo" class="hint"></span></div>

  <div class="examtabs">
    <button id="ex-DT" class="on" onclick="setExam('DT')">DT <span class="hint" style="color:inherit">(CHESS)</span></button>
    <button id="ex-AT" onclick="setExam('AT')">AT <span class="hint" style="color:inherit">(ACE)</span></button>
    <button id="ex-내신모의고사" onclick="setExam('내신모의고사')">내신모의고사 <span class="hint" style="color:inherit">(초6·중1)</span></button>
  </div>

  <div class="subtabs">
    <button id="sub-grade" class="on" onclick="showTab('grade')">① 채점하기</button>
    <button id="sub-key" onclick="showTab('key')">② 정답키(파일 업로드)</button>
    <button id="sub-prog" onclick="showTab('prog')">③ 진행률·시험대상</button>
    <button id="sub-result" onclick="showTab('result')">④ 결과·다운로드</button>
  </div>

  <!-- ① 채점 -->
  <div id="pane-grade">
    <div class="card">
      <h3>채점</h3>
      <div class="row">
        <div><label>레벨/반 (현재 재원생 명단 기준 · 검색)</label>
          <input id="g-search" placeholder="레벨/반 검색" oninput="fillClassPicker()" style="margin-bottom:6px">
          <select id="g-class" onchange="onClassChange()"></select></div>
        <div><label>정답키</label><select id="g-key" onchange="buildGrid()"></select></div>
        <div style="flex:0 0 auto"><label>&nbsp;</label><button class="btn" onclick="saveScores()">채점결과 저장</button></div>
      </div>
      <div id="g-info" class="hint" style="margin-top:8px"></div>
      <div id="grid-host" style="margin-top:12px"><div class="hint">레벨/반을 고르면 그 반의 현재 재원생이 자동으로 떠요.</div></div>
    </div>
  </div>

  <!-- ② 정답키 -->
  <div id="pane-key" style="display:none">
    <div class="card">
      <h3><span id="key-exam">DT</span> 정답키 등록 — 파일만 올리면 문항수·배점·정답 자동 인식</h3>
      <div class="row">
        <div><label>레벨 이름 (예: A1(1-3개월))</label><input id="k-level" placeholder="레벨 이름"></div>
        <div><label id="lbl-read">독해 문항속성 파일 (AT)</label><input type="file" id="k-read" accept=".xlsx,.xls"></div>
        <div id="wrap-gram"><label>문법 문항속성 파일 (AT)</label><input type="file" id="k-gram" accept=".xlsx,.xls"></div>
        <div style="flex:0 0 auto"><label>&nbsp;</label><button class="btn" onclick="parseAndSaveKey()">정답키 저장</button></div>
      </div>
      <div id="k-preview" class="hint" style="margin-top:10px"></div>
    </div>
    <div class="card"><h3>저장된 정답키 (<span id="key-exam2">DT</span>)</h3><div id="key-list"><div class="hint">불러오는 중…</div></div></div>
  </div>

  <!-- ③ 진행률·시험대상 -->
  <div id="pane-prog" style="display:none">
    <div class="card">
      <h3>시험 대상 설정 — <span id="cfg-exam">DT</span> · 안 보는 반은 '시험없음'</h3>
      <div class="hint" style="margin-bottom:10px">이 시험을 안 보는 반/레벨은 '시험없음'으로 끄면 미입력 집계·진행률에서 빠져요.</div>
      <div id="cfg-host"><div class="hint">명단 불러오는 중…</div></div>
    </div>
    <div class="card">
      <h3>분원별 진행률 — <span id="prog-exam">DT</span></h3>
      <div id="prog-host"><div class="hint">불러오는 중…</div></div>
      <div style="margin-top:10px"><button class="ghost" onclick="loadProgress()">새로고침</button></div>
    </div>
  </div>

  <!-- ④ 결과 -->
  <div id="pane-result" style="display:none">
    <div class="card">
      <h3>채점 결과 (<span id="result-exam">DT</span>)</h3>
      <div class="row">
        <div style="max-width:220px"><label>분원 필터</label><select id="r-branch" onchange="renderResults()"><option value="">전체</option></select></div>
        <div style="flex:0 0 auto"><label>&nbsp;</label><button class="btn" onclick="exportXlsx()">엑셀 다운로드 (성적입력양식)</button></div>
        <div style="flex:0 0 auto"><label>&nbsp;</label><button class="ghost" onclick="loadResults()">새로고침</button></div>
      </div>
      <div id="result-host" style="margin-top:12px"><div class="hint">불러오는 중…</div></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPA_URL='https://hplndiuoohantbalixwu.supabase.co';
const SUPA_KEY='sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const CHESS_LEVELS=['C','CE','CH','CHESS']; // 반이름 [ ] 안 알파벳이 이 목록이면 CHESS

let EXAM='DT', SEMID=null, SEMNAME='';
let STUDENTS={};       // id -> {name,code,school,grade}
let BRANCHES={};       // id -> name
let ROSTER=[];         // 현재학기 재원 [{studentId,name,code,grade,className,classLabel,branchId,branchName,chess}]
let KEYS=[], CONFIG={}, RESULTS=[];
let CURCLASS=null, CURKEY=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ok){const t=$('toast');t.textContent=m;t.className='toast show'+(ok===false?' err':'');setTimeout(()=>t.className='toast',2800);}
function levelAlpha(cn){const m=String(cn||'').match(/^\s*\[([A-Za-z]+)/);return m?m[1].toUpperCase():'';}
function isChess(cn){const a=levelAlpha(cn);return a?CHESS_LEVELS.includes(a):false;}
function gradeKey(g){g=String(g||'').trim();let m;if(m=g.match(/중\s*등?\s*(\d)/))return '중'+m[1];if(m=g.match(/초\s*등?\s*(\d)/))return '초'+m[1];if(m=g.match(/고\s*(\d)/))return '고'+m[1];if(m=g.match(/^(\d)$/))return '초'+m[1];return g;}
function disabledSet(){return CONFIG[EXAM]||new Set();}

// 시험별 대상 반 필터: DT=CHESS, AT=ACE, 내신=ACE & 초6/중1
function classInScope(r){
  if(EXAM==='DT') return r.chess;
  if(EXAM==='AT') return !r.chess;
  const gk=gradeKey(r.grade); return !r.chess && (gk==='초6'||gk==='중1');
}
function classesForExam(){
  const m=new Map();
  ROSTER.filter(classInScope).forEach(r=>{const k=r.classLabel||r.className;if(!m.has(k))m.set(k,{key:k,chess:r.chess,recs:[]});m.get(k).recs.push(r);});
  return [...m.values()].sort((a,b)=>a.key.localeCompare(b.key));
}

/* ===== 초기 로드 (현재 재원생 명단) ===== */
(async()=>{try{
  const q=new URLSearchParams(location.search); SEMID=q.get('sem')||null;
  const [br,st,se,sr]=await Promise.all([
    sb.from('branches').select('*'),
    sb.from('students').select('id,code,name,school,grade'),
    sb.from('semesters').select('*'),
    sb.from('semester_records').select('student_id,branch_id,semester_id,class_name,class_label,status,kind').limit(20000)
  ]);
  if(br.error||st.error||sr.error){throw (br.error||st.error||sr.error);}
  (br.data||[]).forEach(b=>BRANCHES[b.id]=b.name);
  (st.data||[]).forEach(s=>STUDENTS[s.id]={name:s.name,code:s.code,school:s.school,grade:s.grade});
  // 현재 학기 결정: URL sem → 없으면 재원 레코드가 가장 많은 학기
  const recs=(sr.data||[]).filter(r=>(r.kind||'regular')!=='exam');
  if(!SEMID){const cnt={};recs.forEach(r=>{if(r.status==='active')cnt[r.semester_id]=(cnt[r.semester_id]||0)+1;});SEMID=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||null;}
  const semName=(se.data||[]).find(s=>s.id===SEMID); SEMNAME=semName?semName.name:'';
  ROSTER=recs.filter(r=>r.semester_id===SEMID && r.status==='active').map(r=>{const s=STUDENTS[r.student_id]||{};
    return {studentId:r.student_id,name:s.name||'',code:s.code||'',grade:s.grade||'',className:r.class_name||'',classLabel:r.class_label||r.class_name||'',branchId:r.branch_id,branchName:BRANCHES[r.branch_id]||'',chess:isChess(r.class_name)};});
  $('conn').textContent='연결됨';$('conn').className='status ok';
  $('seminfo').textContent=`· ${SEMNAME||'현재 학기'} · 재원 ${ROSTER.length}명`;
  fillBranchPicker();
  await loadKeys(); await loadConfig();
  setExam('DT');
}catch(e){$('conn').textContent='연결 오류 (테이블·권한 확인)';$('conn').className='status err';console.error(e);}})();

function fillBranchPicker(){$('r-branch').innerHTML='<option value="">전체</option>'+Object.values(BRANCHES).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');}

function setExam(t){EXAM=t;['DT','AT','내신모의고사'].forEach(x=>$('ex-'+x).className=x===t?'on':'');
  ['key-exam','key-exam2','cfg-exam','prog-exam','result-exam'].forEach(id=>{if($(id))$(id).textContent=t;});
  // AT만 독해+문법 2파일, DT/내신은 1파일
  const at=(t==='AT');$('wrap-gram').style.display=at?'':'none';$('lbl-read').textContent=at?'독해 문항속성 파일':'문항속성 파일';
  CURKEY=null;CURCLASS=null;
  renderKeyList();fillKeyPicker();fillClassPicker();renderCfg();loadProgress();loadResults();}
function showTab(t){['grade','key','prog','result'].forEach(x=>{$('pane-'+x).style.display=x===t?'':'none';$('sub-'+x).className=x===t?'on':'';});
  if(t==='prog'){renderCfg();loadProgress();}if(t==='result')loadResults();if(t==='key')renderKeyList();}

/* ===== 정답키 파싱 ===== */
function readCells(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).map(r=>r.map(c=>c==null?'':c));}
function num(x){const n=parseFloat(String(x).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
function parseGrammar(rows){ // 표형식: 번호/정답/배점
  const hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes('번호')&&r.map(x=>String(x).trim()).includes('정답'));
  if(hi<0)return null;const H=rows[hi].map(x=>String(x).trim());
  const cN=H.indexOf('번호'),cA=H.indexOf('정답'),cP=H.indexOf('배점');
  const out=[];for(let i=hi+1;i<rows.length;i++){const r=rows[i];const no=num(r[cN]);if(no==null)continue;
    const ans=String(r[cA]==null?'':r[cA]).trim();if(ans==='')continue;const pt=(cP>=0?num(r[cP]):null)||2;
    out.push({n:no,type:/^\d+$/.test(ans)?'mc':'sa',ans,pt});}
  return out.length?out:null;}
function parseReading(rows){ // 피벗: 번호=앞쪽 숫자열, 정답='answer'열(맨끝)
  let anscol=-1;for(let i=0;i<Math.min(3,rows.length);i++)rows[i].forEach((c,j)=>{if(String(c).trim().toLowerCase()==='answer')anscol=j;});
  if(anscol<0)anscol=rows[0].length-1;
  // 번호 열: 값이 1,2,3.. 연속인 열 찾기 (보통 index 1)
  let numcol=1;
  const out=[];for(const r of rows){const no=num(r[numcol]);if(no==null||no<1||no>200)continue;const a=String(r[anscol]==null?'':r[anscol]).trim();if(a==='')continue;
    out.push({n:no,type:/^\d+$/.test(a)?'mc':'sa',ans:a,pt:2});}
  // 중복 n 제거(첫 값)
  const seen=new Set(),uniq=[];out.forEach(o=>{if(!seen.has(o.n)){seen.add(o.n);uniq.push(o);}});
  return uniq.length?uniq.sort((a,b)=>a.n-b.n):null;}

async function parseAndSaveKey(){
  const level=$('k-level').value.trim();if(!level){toast('레벨 이름을 입력하세요',false);return;}
  const readF=$('k-read').files[0], gramF=$('k-gram').files[0];
  if(!readF){toast('문항속성 파일을 올리세요',false);return;}
  try{
    let parts=[];
    const rRows=readCells(XLSX.read(await readF.arrayBuffer(),{type:'array'}));
    const rKey=parseReading(rRows)||parseGrammar(rRows);
    if(!rKey){toast('독해 파일을 못 읽었어요',false);return;}
    parts.push({part:(EXAM==='AT'?'독해':'main'),items:rKey});
    if(EXAM==='AT'&&gramF){const gRows=readCells(XLSX.read(await gramF.arrayBuffer(),{type:'array'}));
      const gKey=parseGrammar(gRows)||parseReading(gRows);if(!gKey){toast('문법 파일을 못 읽었어요',false);return;}
      parts.push({part:'문법',items:gKey});}
    const answers=[];parts.forEach(p=>p.items.forEach(it=>answers.push({part:p.part,...it})));
    const num_q=answers.length, totalPt=answers.reduce((s,a)=>s+a.pt,0);
    const rec={name:`${SEMNAME?SEMNAME+' ':''}${EXAM} · ${level}`,semester:SEMNAME,test_type:EXAM,track:(EXAM==='DT'?'CHESS':'ACE'),level,num_q,answers,updated_at:new Date().toISOString()};
    const{error}=await sb.from('exam_keys').insert(rec);
    if(error){toast('저장 실패: '+error.message,false);return;}
    $('k-preview').innerHTML=`✓ 저장됨: <b>${esc(level)}</b> · ${parts.map(p=>p.part+' '+p.items.length+'문항').join(' + ')} · 총 ${num_q}문항 / ${totalPt}점`;
    $('k-level').value='';$('k-read').value='';if($('k-gram'))$('k-gram').value='';
    await loadKeys();renderKeyList();fillKeyPicker();
  }catch(e){toast('파일 파싱 오류',false);console.error(e);}
}
async function loadKeys(){const{data,error}=await sb.from('exam_keys').select('*').order('created_at',{ascending:false});if(!error)KEYS=data||[];}
function keysOfExam(){return KEYS.filter(k=>k.test_type===EXAM);}
function renderKeyList(){const host=$('key-list');if(!host)return;const list=keysOfExam();
  if(!list.length){host.innerHTML='<div class="hint">이 시험의 정답키가 없어요. 위에서 파일을 올리세요.</div>';return;}
  host.innerHTML=list.map(k=>{const pts=(k.answers||[]).reduce((s,a)=>s+(a.pt||0),0);const parts=[...new Set((k.answers||[]).map(a=>a.part))].join('+');
    return `<div class="keylist-item"><span class="tag ${k.track==='CHESS'?'chess':'ace'}">${esc(k.track)}</span><b>${esc(k.level||k.name)}</b>
    <span class="hint">· ${parts} · ${k.num_q}문항 ${pts}점</span>
    <span style="margin-left:auto"><button class="ghost mini danger" onclick="delKey('${k.id}')">삭제</button></span></div>`;}).join('');}
async function delKey(id){if(!confirm('삭제할까요?'))return;await sb.from('exam_keys').delete().eq('id',id);await loadKeys();renderKeyList();fillKeyPicker();}
function fillKeyPicker(){const sel=$('g-key');if(!sel)return;const cur=sel.value;const list=keysOfExam();
  sel.innerHTML='<option value="">— 정답키 선택 —</option>'+list.map(k=>`<option value="${k.id}">${esc(k.level||k.name)} (${k.num_q}문항)</option>`).join('');
  if(cur&&list.find(k=>k.id===cur))sel.value=cur;buildGrid();}

/* ===== 시험대상(시험없음) ===== */
async function loadConfig(){const{data,error}=await sb.from('exam_config').select('*');CONFIG={};if(!error&&data)data.forEach(r=>CONFIG[r.test_type]=new Set(r.disabled||[]));}
function renderCfg(){const host=$('cfg-host');if(!host)return;const cls=classesForExam();
  if(!cls.length){host.innerHTML='<div class="hint">이 시험 대상 반이 명단에 없어요.</div>';return;}
  const off=disabledSet();
  host.innerHTML=cls.map(c=>`<span class="cfg-chip ${off.has(c.key)?'off':'on'}" onclick="toggleCfg('${esc(c.key).replace(/'/g,"\\'")}')">${off.has(c.key)?'✕ 시험없음':'✓ 대상'} · ${esc(c.key)} (${c.recs.length})</span>`).join('');}
async function toggleCfg(k){const off=CONFIG[EXAM]||(CONFIG[EXAM]=new Set());off.has(k)?off.delete(k):off.add(k);
  await sb.from('exam_config').upsert({test_type:EXAM,disabled:[...off],updated_at:new Date().toISOString()},{onConflict:'test_type'});
  renderCfg();fillClassPicker();loadProgress();}

/* ===== 채점 그리드 ===== */
function fillClassPicker(){const sel=$('g-class');if(!sel)return;const q=($('g-search').value||'').trim();const off=disabledSet();
  let cls=classesForExam().filter(c=>!off.has(c.key));if(q)cls=cls.filter(c=>c.key.includes(q));
  sel.innerHTML='<option value="">— 반 선택 —</option>'+cls.map(c=>`<option value="${esc(c.key)}">${c.chess?'[CHESS] ':'[ACE] '}${esc(c.key)} (${c.recs.length}명)</option>`).join('');
  onClassChange();}
function onClassChange(){CURCLASS=$('g-class').value||null;buildGrid();}
function curStuds(){if(!CURCLASS)return[];return ROSTER.filter(classInScope).filter(r=>(r.classLabel||r.className)===CURCLASS);}
function buildGrid(){const host=$('grid-host');CURKEY=KEYS.find(k=>k.id===$('g-key').value)||null;
  if(!CURCLASS){host.innerHTML='<div class="hint">레벨/반을 고르세요.</div>';return;}
  if(!CURKEY){host.innerHTML='<div class="hint">정답키를 고르세요. (없으면 ② 정답키 탭에서 파일 올리기)</div>';return;}
  const studs=curStuds();const ans=CURKEY.answers||[];const parts=[...new Set(ans.map(a=>a.part))];
  $('g-info').innerHTML=`반 <b>${esc(CURCLASS)}</b> · ${studs.length}명 · 정답키 <b>${esc(CURKEY.level||CURKEY.name)}</b> (${ans.length}문항)`;
  let h=`<div class="grid-scroll"><table class="gtbl"><thead><tr><th class="stu">학생</th>`;
  parts.forEach(p=>{const cnt=ans.filter(a=>a.part===p).length;h+=`<th class="part" colspan="${cnt}">${esc(p==='main'?'문항':p)} (${cnt})</th>`;});
  parts.forEach(p=>h+=`<th class="part">${esc(p==='main'?'점수':p+'점수')}</th>`);
  h+=`<th class="part">총점</th></tr><tr><th class="stu"></th>`;
  ans.forEach(a=>h+=`<th title="${a.type==='sa'?'주관식: 1=정답,0=오답':'객관식: 답 번호'}">${a.n}${a.type==='sa'?'*':''}</th>`);
  parts.forEach(()=>h+=`<th></th>`);h+=`<th></th></tr></thead><tbody>`;
  studs.forEach(s=>{h+=`<tr data-sid="${esc(s.studentId)}" data-code="${esc(s.code)}"><td class="stu">${esc(s.name)}<div class="hint">${esc(s.code)} · ${esc(s.branchName)}</div></td>`;
    ans.forEach((a,i)=>{const sa=a.type==='sa';h+=`<td class="qcell ${sa?'sacell':''}" data-i="${i}"><input inputmode="numeric" oninput="gradeRow(this)" placeholder="${sa?'1/0':''}"></td>`;});
    parts.forEach(()=>h+=`<td class="scorecell partsc">-</td>`);h+=`<td class="scorecell tot">-</td></tr>`;});
  h+=`</tbody></table></div><div class="hint" style="margin-top:6px">객관식: 학생이 고른 번호 입력 → 자동 O/X. 주관식(*): 1=정답, 0=오답. 각 문항 배점만큼 자동 합산.</div>`;
  host.innerHTML=h;}
function gradeRow(inp){const tr=inp.closest('tr');const ans=CURKEY.answers||[];const parts=[...new Set(ans.map(a=>a.part))];
  const ptByPart={},gotByPart={};parts.forEach(p=>{ptByPart[p]=0;gotByPart[p]=0;});
  tr.querySelectorAll('td.qcell').forEach(td=>{const a=ans[+td.dataset.i];const pt=a.pt||2;ptByPart[a.part]+=pt;
    const v=td.querySelector('input').value.trim();td.classList.remove('ok','no');if(v==='')return;
    let ok;if(a.type==='sa')ok=(v==='1');else ok=(v.toUpperCase()===String(a.ans).trim().toUpperCase());
    td.classList.add(ok?'ok':'no');if(ok)gotByPart[a.part]+=pt;});
  let tot=0;const pscs=tr.querySelectorAll('.partsc');parts.forEach((p,i)=>{if(pscs[i])pscs[i].textContent=gotByPart[p];tot+=gotByPart[p];});
  tr.querySelector('.tot').textContent=tot;}
async function saveScores(){if(!CURKEY||!CURCLASS){toast('반·정답키를 고르세요',false);return;}
  const ans=CURKEY.answers||[];const parts=[...new Set(ans.map(a=>a.part))];const studs=curStuds();
  const trs=[...document.querySelectorAll('#grid-host tbody tr')];const recs=[];
  trs.forEach((tr,ri)=>{const s=studs[ri]||{};const responses=[];const gotByPart={},ptByPart={};parts.forEach(p=>{gotByPart[p]=0;ptByPart[p]=0;});
    let any=false;
    tr.querySelectorAll('td.qcell').forEach(td=>{const a=ans[+td.dataset.i];const pt=a.pt||2;ptByPart[a.part]+=pt;
      const v=td.querySelector('input').value.trim();if(v!=='')any=true;
      let ok;if(a.type==='sa')ok=(v==='1');else ok=(v!==''&&v.toUpperCase()===String(a.ans).trim().toUpperCase());
      if(ok)gotByPart[a.part]+=pt;responses.push({part:a.part,n:a.n,ans:v,ok:!!ok});});
    if(!any)return; // 아무것도 입력 안 한 학생은 저장 안 함
    const got=Object.values(gotByPart).reduce((a,b)=>a+b,0),tot=Object.values(ptByPart).reduce((a,b)=>a+b,0);
    recs.push({key_id:CURKEY.id,key_name:CURKEY.level||CURKEY.name,semester:SEMNAME,test_type:EXAM,branch:s.branchName||'',class_name:CURCLASS,
      student_name:s.name||'',student_code:s.code||null,responses,correct:responses.filter(r=>r.ok).length,num_q:ans.length,
      got_pt:got,total_pt:tot,score:tot>0?Math.round(got/tot*100):0,graded_at:new Date().toISOString()});});
  if(!recs.length){toast('입력된 학생이 없어요',false);return;}
  const{error}=await sb.from('exam_scores').insert(recs);
  if(error){toast('저장 실패: '+error.message,false);return;}toast(recs.length+'명 저장됨 ✓');loadProgress();}

/* ===== 진행률 ===== */
async function loadProgress(){const host=$('prog-host');if(!host)return;const off=disabledSet();
  const{data,error}=await sb.from('exam_scores').select('branch,class_name,student_code,student_name,test_type').eq('test_type',EXAM).limit(20000);
  if(error){host.innerHTML='<div class="hint">불러오기 실패</div>';return;}
  const done={};(data||[]).forEach(r=>{if(off.has(r.class_name))return;const b=r.branch||'(미지정)';(done[b]=done[b]||new Set()).add(r.student_code||r.student_name);});
  const tot={};ROSTER.filter(classInScope).forEach(r=>{const k=r.classLabel||r.className;if(off.has(k))return;const b=r.branchName||'(미지정)';tot[b]=(tot[b]||0)+1;});
  const brs=[...new Set([...Object.keys(tot),...Object.keys(done)])];
  if(!brs.length){host.innerHTML='<div class="hint">대상 학생이 없어요.</div>';return;}
  let h=`<table><thead><tr><th>분원</th><th style="width:100px">입력/전체</th><th>진행률</th></tr></thead><tbody>`;
  brs.forEach(b=>{const d=done[b]?done[b].size:0,t=tot[b]||0,p=t?Math.round(d/t*100):0;
    h+=`<tr><td>${esc(b)}</td><td>${d} / ${t}</td><td><div class="pbar"><div style="width:${Math.min(100,p)}%"></div><span>${p}%</span></div></td></tr>`;});
  h+=`</tbody></table>`;host.innerHTML=h;}

/* ===== 결과 + 성적입력양식 다운로드 ===== */
async function loadResults(){const{data,error}=await sb.from('exam_scores').select('*').eq('test_type',EXAM).order('graded_at',{ascending:false}).limit(20000);
  if(error){$('result-host').innerHTML='<div class="hint">불러오기 실패</div>';return;}RESULTS=data||[];renderResults();}
function renderResults(){const host=$('result-host');const bf=$('r-branch').value;const list=RESULTS.filter(r=>!bf||r.branch===bf);
  if(!list.length){host.innerHTML='<div class="hint">저장된 결과가 없어요.</div>';return;}
  let h=`<div class="hint" style="margin-bottom:6px">${list.length}건</div><div class="grid-scroll"><table><thead><tr><th>분원</th><th>반</th><th>이름</th><th>코드</th><th>정답수</th><th>점수</th><th>채점일</th><th></th></tr></thead><tbody>`;
  list.forEach(r=>h+=`<tr><td>${esc(r.branch)}</td><td>${esc(r.class_name)}</td><td>${esc(r.student_name)}</td><td>${esc(r.student_code||'')}</td><td>${r.correct}/${r.num_q}</td><td class="scorecell">${r.score}</td><td class="hint">${esc(String(r.graded_at||'').slice(0,16).replace('T',' '))}</td><td><button class="ghost mini danger" onclick="delResult('${r.id}')">삭제</button></td></tr>`);
  h+=`</tbody></table></div>`;host.innerHTML=h;}
async function delResult(id){if(!confirm('삭제할까요?'))return;await sb.from('exam_scores').delete().eq('id',id);loadResults();loadProgress();}
function exportXlsx(){const bf=$('r-branch').value;const list=RESULTS.filter(r=>!bf||r.branch===bf);
  if(!list.length){toast('결과가 없어요',false);return;}
  // 파트/문항 구조는 결과의 responses에서 추출 (최대 문항 기준)
  const parts=[];list.forEach(r=>(r.responses||[]).forEach(x=>{if(!parts.includes(x.part))parts.push(x.part);}));
  const partCols={};parts.forEach(p=>{partCols[p]=Math.max(0,...list.map(r=>(r.responses||[]).filter(x=>x.part===p).length));});
  const head=['학생코드','레벨','담임','학생명','분원명','학교','학년','다음학기 배정과정'];
  parts.forEach(p=>{const lab=(p==='main'?'문항':p);for(let i=1;i<=partCols[p];i++)head.push(lab+i);});
  parts.forEach(p=>head.push((p==='main'?'':p)+'점수'));head.push('총점');
  const aoa=[head];
  list.forEach(r=>{const row=[r.student_code||'',r.key_name||'','',r.student_name||'',r.branch||'','','',''];
    const byPart={};parts.forEach(p=>byPart[p]=(r.responses||[]).filter(x=>x.part===p).sort((a,b)=>a.n-b.n));
    parts.forEach(p=>{const arr=byPart[p];for(let i=0;i<partCols[p];i++)row.push(arr[i]?arr[i].ans:'');});
    parts.forEach(p=>{const arr=byPart[p];row.push(arr.reduce((s,x)=>s+(x.ok?2:0),0));});
    row.push(r.got_pt);aoa.push(row);});
  const ws=XLSX.utils.aoa_to_sheet(aoa),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'성적입력');
  XLSX.writeFile(wb,'성적입력_'+EXAM+'.xlsx');toast('엑셀 다운로드 ✓');}
</script>
