<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLS 시험 채점</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
:root{--brand:#8b6ee8;--brand2:#a385f0;--soft:#f0ebfe;--ink:#2f3138;--ink2:#6b6385;--ink3:#9a93b0;
--line:#ece8f5;--line2:#f4f1fb;--bg:#f7f5fb;--pos:#22a06b;--pos-s:#e4f6ee;--neg:#e5484d;--neg-s:#fdecec;
--warn:#d9822b;--warn-s:#fdf3e6;--chess:#7a5ce0;--ace:#4e7ca6;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
/* ── 사이드바(아코디언) ── */
.side{width:236px;background:#fff;border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sbrand{padding:0 18px;height:64px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line2)}
.smark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.sbrand .t{font-weight:800;font-size:15px}.sbrand .s{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:1px}
.snav{padding:12px;overflow:auto;flex:1}
.sgrp{margin-bottom:4px}
.sgrp>.gh{padding:12px 12px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.sgrp>.gh:hover{background:var(--line2)}
.sgrp.cur>.gh{color:var(--ink)}
.sgrp>.gh .ghn{display:flex;align-items:baseline;gap:6px;min-width:0}
.sgrp>.gh .ghn.col{flex-direction:column;align-items:flex-start;gap:1px;line-height:1.2}
.sgrp>.gh .gmeta{font-size:11px;font-weight:800;color:var(--ink3);white-space:nowrap}
.sgrp.cur>.gh .gmeta{color:var(--brand)}
.sgrp>.gh .cnt{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink3);background:var(--line2);padding:2px 8px;border-radius:20px;white-space:nowrap}
.sgrp>.gh .arw{color:var(--ink3);transition:.18s;font-size:11px}
.sgrp.open>.gh .arw{transform:rotate(180deg)}
.ssub{display:none;padding:3px 0 8px 10px}
.sgrp.open .ssub{display:block}
.ssub button{width:100%;text-align:left;border:none;background:none;font:inherit;font-weight:700;font-size:13.5px;color:var(--ink2);padding:9px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:9px}
.ssub button:hover{background:var(--soft)}
.ssub button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800}
.ssub button .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.ssub button.on .dot{background:#fff}
/* ── 메인 ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:0 26px;min-height:64px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.crumb{font-weight:800;font-size:15px}.crumb .mut{color:var(--ink3);font-weight:700}
.top .sp{flex:1}
.pick{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--ink3)}
.pick select{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--ink);cursor:pointer;outline:none}
.status{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.status.ok{background:var(--pos-s);color:var(--pos)}.status.err{background:var(--neg-s);color:var(--neg)}
.content{padding:24px 26px 100px;flex:1}
.h2{font-size:19px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:var(--ink3);font-weight:700;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;box-shadow:0 4px 18px rgba(80,70,120,.05)}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;padding:11px 20px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer}
.ghost:hover{background:var(--soft);color:var(--brand);border-color:transparent}
.mini{padding:5px 11px;font-size:12px;border-radius:8px}
.danger{color:var(--neg);border-color:#f3cdcf}.danger:hover{background:var(--neg-s);color:var(--neg)}
.hint{color:var(--ink3);font-size:13px;font-weight:700}
.lbl{font-size:12.5px;font-weight:800;color:var(--ink3);margin-bottom:8px}
.tag{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 9px}
.tag.ace{background:#e9f0fb;color:var(--ace)}.tag.chess{background:#efe9fc;color:var(--chess)}
/* 드롭다운(레벨 선택) */
.dd{position:relative;max-width:520px}
.ddbox{border:1.5px solid var(--brand);border-radius:12px;padding:13px 16px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;box-shadow:0 0 0 3px var(--soft);cursor:pointer;background:#fff}
.ddbox .ph{color:var(--ink3);font-weight:700}
.ddlist{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(80,70,120,.18);z-index:20;overflow:hidden}
.ddopts{max-height:360px;overflow:auto}
.ddopt{padding:11px 16px;font-size:14px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700}
.ddopt:hover{background:var(--soft);color:var(--brand)}
.ddopt .cnt{color:var(--ink3);font-weight:700;font-size:12.5px;margin-left:auto}
/* 파일 드롭 */
.filebox{position:relative;border:1.5px dashed #d9cff2;border-radius:12px;padding:16px;text-align:center;color:var(--ink3);font-size:13px;background:#faf8ff;font-weight:800;cursor:pointer}
.filebox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebox.has{border-color:var(--brand);color:var(--brand);background:var(--soft)}
/* 채점 그리드 */
.gwrap{overflow:auto;border:1px solid var(--line2);border-radius:12px;max-height:70vh}
table.g{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.g th,.g td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:5px;text-align:center;white-space:nowrap}
.g th{background:#f6f3fc;color:var(--ink3);font-size:11px;font-weight:800;position:sticky;top:0;z-index:1;padding:6px 5px;box-sizing:border-box}
.g thead tr.r1 th{top:0;height:34px}
.g thead tr.r2 th{top:34px;height:30px}
.g th.act{position:sticky;right:0;z-index:6;background:#f6f3fc}
.g th.part{background:#efeafb;color:var(--brand);font-size:12px}
.g td.stu,.g th.stu{text-align:left;background:#fff;position:sticky;left:0;min-width:200px;z-index:2;padding:8px 12px}
.g th.stu{z-index:3;background:#f6f3fc}
.g td.stu b{font-size:13.5px}.g td.stu .c{font-size:11px;color:var(--ink3);font-weight:700;margin-top:1px}
.g td.qcell input{width:40px;height:30px;border-radius:7px;text-align:center;padding:0;border:1px solid var(--line);font-weight:800;font:inherit;font-size:13px;outline:none}
.g td.qcell input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}
.g td.qcell.ok input{background:var(--pos-s);border-color:#9dd9bd;color:var(--pos)}
.g td.qcell.no input{background:var(--neg-s);border-color:#f0b6b8;color:var(--neg)}
.g td.qcell.sa input{border:2px solid var(--neg);background:#fff;color:var(--neg)}
.g td.qcell.sa input::placeholder{color:var(--neg);opacity:.45;font-weight:800}
.g td.qcell.sa.ok input{background:var(--pos-s);border-color:var(--pos);color:var(--pos)}
.g td.sc{font-weight:800;color:var(--brand);background:#faf8ff;min-width:46px}
.g td.tot{font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));min-width:56px;width:58px;font-size:14px;position:sticky;right:78px;z-index:3}
.g th.tot{position:sticky;right:78px;z-index:5;background:#f6f3fc}
.g tr:hover td.stu{background:var(--soft)}
.g td.act{background:#fff;position:sticky;right:0;z-index:4;min-width:78px;width:78px}
.saq{font-size:9.5px;color:var(--neg);font-weight:800;display:block;margin-top:1px}
.retest{font-size:10.5px;color:var(--ink3);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 2px}
.legend span{display:flex;align-items:center;gap:6px}
.lgbox{width:16px;height:16px;border-radius:5px;display:inline-block}
/* 명단만(정답키 없을 때) */
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rlist .ri{border:1px solid var(--line2);border-radius:10px;padding:9px 12px}
.rlist .ri b{font-size:13.5px}.rlist .ri .c{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:2px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#2f3138;color:#fff;padding:12px 22px;border-radius:12px;font-weight:800;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--neg)}
.keyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:6px}
.keyrow b{color:var(--ink)}
.loading{padding:60px;text-align:center;color:var(--ink3);font-weight:800}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="sbrand">
      <div class="smark">JLS</div>
      <div><div class="t">시험 채점</div><div class="s">정상어학원</div></div>
    </div>
    <nav class="snav" id="snav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb">시험 채점</div>
      <div class="sp"></div>
      <div class="pick"><span>학기</span><select id="semSel" onchange="onSemChange(this.value)"></select></div>
      <div class="pick" id="brWrap"><span>분원</span><select id="brSel" onchange="onBranchChange(this.value)"></select></div>
      <span class="status" id="status">불러오는 중…</span>
    </header>
    <main class="content" id="content"><div class="loading">데이터 불러오는 중…</div></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================================
   JLS 시험 채점 (단독 HTML) — Supabase 직접 연결
   DT(CHESS) / AT(ACE) / 내신모의고사(초6·중1)
   ※ 완성 전까지 GitHub 배포 안 함. 로컬 더블클릭/Go Live 테스트.
   ============================================================================ */
const SUPA_URL='https://hplndiuoohantbalixwu.supabase.co';
const SUPA_KEY='sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X';
let sb=null;
/* 정답 등록/삭제 권한 계정 — 이 로그인 ID만 정답키를 올리고 지울 수 있음.
   ★★ 여기 '엄윤경 로그인 ID'로 바꿔주세요 (예: 통합관리 로그인할 때 쓰는 아이디) ★★ */
const KEY_EDITORS=['엄윤경'];
let CURUSER='';  // 통합관리에 심을 때 ?user=로그인ID 로 넘어옴. 로컬 단독 실행 땐 비어있음
function canEditKeys(){ return !CURUSER ? true : KEY_EDITORS.includes(CURUSER); }

const EXAMS=['DT','AT','내신모의고사'];
let EXAM='DT', VIEW='answer';
let SEM=null, BRANCH='', ROLE='admin';
let OPEN={DT:true,AT:false,'내신모의고사':false};
let BRANCHES={}, STUDENTS={}, SEMS=[], SEM_IDS=[], ROSTER=[], KEYS=[], CONFIG={}, CURLEVEL='', CURCLASS='';
let CURVARIANT='', CURTAB='독해';   // ACE: 선택한 기간·버전(전체레벨명) / 탭(독해·문법·총점)
let SCOREDCODES=new Set();  // 현재 시험종류·학기에서 이미 채점 저장된 학생 회원코드

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ok){const el=document.createElement('div');el.className='toast show'+(ok===false?' err':'');el.textContent=m;document.body.appendChild(el);setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},2600);}
const _L2N={A:'1',B:'2',C:'3',D:'4',E:'5','①':'1','②':'2','③':'3','④':'4','⑤':'5'};
const SANOTE='<div style="margin:2px 2px 10px;padding:10px 14px;border:1.5px solid var(--neg);background:var(--neg-s);border-radius:10px;font-weight:800;color:var(--neg);font-size:13px">🟥 빨간 네모칸(주관식)은 학생 답을 보고 <b>맞으면 1, 틀리면 0</b>을 입력하세요.</div>';
function normA(v){v=String(v==null?'':v).trim().toUpperCase();return _L2N[v]||v;}
function levelAlpha(cn){const m=String(cn||'').match(/^\s*\[?\s*([A-Za-z]+)/);return m?m[1].toUpperCase():'';}
function levelCode(cn){const m=String(cn||'').match(/^\s*\[?\s*([A-Za-z0-9]+)/);return m?m[1].toUpperCase():'';}
function isChess(cn){return /^(IS|DS|LS|MS)/.test(levelAlpha(cn));}
function gradeKey(g){g=String(g||'').trim();let m;if(m=g.match(/중\s*등?\s*(\d)/))return '중'+m[1];if(m=g.match(/초\s*등?\s*(\d)/))return '초'+m[1];if(m=g.match(/고\s*(\d)/))return '고'+m[1];if(m=g.match(/^(\d)$/))return '초'+m[1];return g;}
/* 내신모의고사 반 판정 — 반이름 기준(강한 표식만; 초6/중1은 일반 ACE반 이름에도 들어가 제외) */
function isNaesin(r){return /내신|E6|M1|초등6|중등1/i.test(String(r.className||'')+' '+String(r.classLabel||''));}
/* AT는 '정답키에 있는 레벨(대괄호 베이스)'인 반만 대상 — 수능반·모의고사반 등 키 없는 반 제외 */
function atHasKey(r){return variantsForBase(levelCode(r.className)).length>0;}
function inScopeFor(exam,r){if(exam==='DT')return r.chess;if(exam==='AT')return !r.chess&&atHasKey(r);return isNaesin(r);}
function normLv(s){return String(s||'').replace(/\s/g,'').toUpperCase();}
/* 레벨 정렬: CHESS는 IS→DS→LS→MS 순, 그 안에서 A~D·1~2. 그 외(ACE/내신)는 이름순 */
function lvSort(a,b){
  const rank={IS:0,DS:1,LS:2,MS:3};
  const ca=normLv(a),cb=normLv(b);
  const ra=rank[ca.slice(0,2)], rb=rank[cb.slice(0,2)];
  if(ra!=null&&rb!=null&&ra!==rb)return ra-rb;
  if(ra!=null&&rb==null)return -1;
  if(ra==null&&rb!=null)return 1;
  return ca.localeCompare(cb,'en',{numeric:true});
}

/* ---- 로드 ---- */
function initSb(){ if(!sb) sb=supabase.createClient(SUPA_URL,SUPA_KEY); return sb; }
/* Supabase는 한 요청에 최대 1000행만 주므로 range()로 끝까지 페이지를 넘겨 전부 가져옴 */
async function fetchAll(table, cols, filt){
  const PAGE=1000; let from=0, out=[];
  while(true){
    let q=sb.from(table).select(cols).range(from,from+PAGE-1);
    if(filt)q=filt(q);
    const{data,error}=await q;
    if(error)throw error;
    const chunk=data||[]; out=out.concat(chunk);
    if(chunk.length<PAGE)break; from+=PAGE;
  }
  return out;
}
function readParams(){const p=new URLSearchParams(location.search);if(p.get('role'))ROLE=p.get('role');if(p.get('branch'))BRANCH=p.get('branch');if(p.get('sem'))SEM=p.get('sem');if(p.get('user'))CURUSER=p.get('user');}
async function loadAll(){
  initSb(); readParams();
  const [b,st,se]=await Promise.all([sb.from('branches').select('*'),fetchAll('students','id,code,name,school,grade'),sb.from('semesters').select('*')]);
  BRANCHES={}; (b.data||[]).forEach(x=>BRANCHES[x.id]=x.name);
  STUDENTS={}; st.forEach(x=>STUDENTS[x.id]=x);
  SEMS=(se.data||[]);
  const all=await fetchAll('semester_records','semester_id,status');
  const m={};all.forEach(r=>{if(r.status==='active')m[r.semester_id]=(m[r.semester_id]||0)+1;});
  SEM_IDS=Object.keys(m).sort((a,c)=>m[c]-m[a]);
  if(!SEM) SEM=SEM_IDS[0]||(SEMS[0]&&SEMS[0].id);
  await Promise.all([loadRoster(),loadKeys(),loadConfig()]);
  await loadScored();
}
async function loadRoster(){
  let data;
  try{ data=await fetchAll('semester_records','student_id,branch_id,semester_id,class_name,class_label,status,kind',q=>q.eq('semester_id',SEM)); }
  catch(e){ toast('명단 로드 실패: '+e.message,false); ROSTER=[]; return; }
  ROSTER=(data||[]).filter(r=>r.status==='active'&&(r.kind||'regular')!=='exam').map(r=>{const s=STUDENTS[r.student_id]||{};return{
    studentId:r.student_id,name:s.name||'',code:s.code||'',school:s.school||'',grade:s.grade||'',
    className:r.class_name||'',classLabel:r.class_label||r.class_name||'',branchId:r.branch_id,branchName:BRANCHES[r.branch_id]||'',chess:isChess(r.class_name)};});
}
async function loadKeys(){const{data,error}=await sb.from('exam_keys').select('*').order('created_at',{ascending:false});if(!error)KEYS=data||[];}
async function loadConfig(){const{data,error}=await sb.from('exam_config').select('*');CONFIG={};if(!error&&data)data.forEach(r=>CONFIG[r.test_type]=new Set(r.disabled||[]));}
async function loadScored(){
  try{ const rows=await fetchAll('exam_scores','student_code,test_type,semester',q=>q.eq('test_type',EXAM).eq('semester',semName(SEM)));
    SCOREDCODES=new Set(rows.map(r=>r.student_code)); }
  catch(e){ SCOREDCODES=new Set(); }
}
function gradedOf(cls){return cls.recs.filter(r=>SCOREDCODES.has(r.code)).length;}
function prettySem(id){const m=String(id).match(/(\d{4})[_-]?(spring|summer|fall|autumn|winter)/i);if(m){const t={spring:'봄',summer:'여름',fall:'가을',autumn:'가을',winter:'겨울'}[m[2].toLowerCase()];return `${m[1]}년 ${t}학기`;}return id;}
function semName(id){const s=SEMS.find(x=>x.id===id);return s&&s.name?s.name:prettySem(id);}
function disabledSet(){return CONFIG[EXAM]||new Set();}
function scopedRoster(){return ROSTER.filter(r=>(!BRANCH||r.branchId===BRANCH)&&inScopeFor(EXAM,r));}
function levelsForExam(){
  const m=new Map();
  scopedRoster().forEach(r=>{const code=EXAM==='내신모의고사'?(r.classLabel||r.className):levelCode(r.className);if(!code)return;
    if(!m.has(code))m.set(code,{code,chess:r.chess,recs:[]});m.get(code).recs.push(r);});
  return [...m.values()].sort((a,b)=>lvSort(a.code,b.code));
}
function studentsOfLevel(code){
  return scopedRoster().filter(r=>{const c=EXAM==='내신모의고사'?(r.classLabel||r.className):levelCode(r.className);return c===code;})
    .sort((a,b)=>(a.branchName+a.className+a.name).localeCompare(b.branchName+b.className+b.name));
}
/* 답안입력용 — 반(요일·담임)별로 분리. 같은 레벨이어도 반이 다르면 따로. 정답키는 레벨 걸 공유 */
function classesForExam(){
  const m=new Map();
  scopedRoster().forEach(r=>{
    const code=EXAM==='내신모의고사'?(r.classLabel||r.className):levelCode(r.className);
    const key=r.branchId+'|'+r.className;
    if(!m.has(key))m.set(key,{key,className:r.className,classLabel:r.classLabel||r.className,levelCode:code,chess:r.chess,branchName:r.branchName,recs:[]});
    m.get(key).recs.push(r);
  });
  return [...m.values()].sort((a,b)=>lvSort(a.levelCode,b.levelCode)||a.className.localeCompare(b.className));
}
/* 반 이름에서 요일·담임 등 세부 표기만 뽑아 보기 좋게 (레벨 대괄호는 뺌) */
function classDetail(cn){return String(cn||'').replace(/^\s*\[[^\]]*\]\s*/,'').trim()||cn;}
/* 표시용: 반 라벨 맨 앞의 요일 표기(월수금 3부·화목 1부 등)만 제거. 레벨명은 그대로 둠 */
function noDays(s){
  s=String(s||'');
  return s.replace(/^\s*[월화수목금토일]+\s*\d*\s*부?\s*·?\s*/,'').trim()||s;
}
function keyOfLevel(code){return KEYS.find(k=>k.test_type===EXAM&&normLv(k.level)===normLv(code));}

function toggleDDk(){const l=$('ddkList');l.style.display=l.style.display==='none'?'':'none';}
function pickKeyLevel(code){CURLEVEL=code;$('ddkList').style.display='none';$('ddkLabel').textContent=code;showKeyBox(code);}
function showKeyBox(code){
  const k=keyOfLevel(code); const box=$('keyBox'); const ans=(k&&k.answers)||[];

  box.innerHTML=`<div class="keyrow">영역: <b>${parts.map(esc).join(', ')}</b> · <b>${ans.length}문항 ${ans.reduce((s,a)=>s+(a.pt||0),0)}점</b> · 직접채점 ${ans.filter(a=>a.type==='sa').length}문항
    ${canEditKeys()?`<button class="ghost mini danger" onclick="delKey('${k.id}')">삭제</button>`:''}</div>

}
async function delKey(id){if(!canEditKeys()){toast('삭제 권한이 없어요 (담당자 전용)',false);return;}if(!confirm('이 정답키를 삭제할까요?'))return;await sb.from('exam_keys').delete().eq('id',id);await loadKeys();toast('삭제됨');renderKeyView();}

function onBulk(inp,forceSection){
  if(!canEditKeys()){toast('정답 등록 권한이 없어요 (담당자 전용)',false);return;}
  const f=inp.files[0]; if(!f)return;
  const box=inp.closest('.filebox'); const txt=box.querySelector('.fbtxt'); const orig=txt.innerHTML;
  const reset=()=>{box.classList.remove('has');txt.innerHTML=orig;};
  box.classList.add('has'); txt.innerHTML='📄 '+esc(f.name)+' 읽는 중…';
  const rd=new FileReader();
  rd.onload=async()=>{
    try{
      const wb=XLSX.read(new Uint8Array(rd.result),{type:'array',cellStyles:true});
      const ws=wb.Sheets[wb.SheetNames[0]]; const ref=XLSX.utils.decode_range(ws['!ref']);
      const hdr={};
      for(let c=ref.s.c;c<=ref.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r:ref.s.r,c})];const v=cell?String(cell.v).trim():'';
        if(/^레벨$/.test(v))hdr.level=c;else if(/세부영역|세부유형|세부/.test(v))hdr.sub=c;else if(/영역/.test(v))hdr.part=c;else if(/문항|번호/.test(v))hdr.n=c;else if(/배점|점수/.test(v))hdr.pt=c;else if(/정답/.test(v))hdr.ans=c;}
      if(hdr.level==null||hdr.n==null||hdr.ans==null){toast('레벨·문항·정답 열을 못 찾았어요',false);reset();return;}
      const groups={};
      for(let r=ref.s.r+1;r<=ref.e.r;r++){
        const gv=x=>{const cell=ws[XLSX.utils.encode_cell({r,c:x})];return cell?cell.v:'';};
        const level=String(gv(hdr.level)||'').trim(); if(!level)continue;
        const n=parseInt(String(gv(hdr.n)).replace(/[^0-9]/g,''),10); if(!n)continue;
        const part=forceSection||(hdr.part!=null?String(gv(hdr.part)||'').trim():'전체');
        const sub=hdr.sub!=null?String(gv(hdr.sub)||'').trim():'';
        const pt=parseFloat(String(gv(hdr.pt)).replace(/[^0-9.]/g,''))||0;
        const ansCell=ws[XLSX.utils.encode_cell({r,c:hdr.ans})];
        const fill=ansCell&&ansCell.s&&ansCell.s.patternType==='solid'&&ansCell.s.fgColor&&ansCell.s.fgColor.rgb;
        const isSa=fill&&!/^(FFFFFF|FFFFFFFF|00000000)$/i.test(String(fill));
        const ansRaw=ansCell?String(ansCell.v==null?'':ansCell.v).trim():'';
        const key=level.toUpperCase(); (groups[key]=groups[key]||[]).push({part:part||'전체',sub,n,type:isSa?'sa':'mc',ans:isSa?'':normA(ansRaw),pt});
      }
      const lvs=Object.keys(groups); if(!lvs.length){toast('데이터 행이 없어요',false);reset();return;}
      let saved=0,saCnt=0;
      for(const lv of lvs){
        const fresh=groups[lv].sort((a,b)=>a.n-b.n);
        const fileParts=new Set(fresh.map(a=>a.part||'전체'));
        const existing=KEYS.find(k=>k.test_type===EXAM&&normLv(k.level)===normLv(lv));
        // 같은 영역만 교체, 다른 영역은 유지 → 독해/문법 파일 따로 올려도 한 레벨로 합쳐짐
        let merged=fresh;
        if(existing){ const keep=(existing.answers||[]).filter(a=>!fileParts.has(a.part||'전체')); merged=keep.concat(fresh); }
        merged.sort((a,b)=>(((a.part||'')>(b.part||''))?1:((a.part||'')<(b.part||'')?-1:0))||(a.n-b.n));
        saCnt+=fresh.filter(a=>a.type==='sa').length;
        const track=/^(IS|DS|LS|MS)/.test(lv)?'CHESS':'ACE';
        if(existing) await sb.from('exam_keys').delete().eq('id',existing.id);
        const{error}=await sb.from('exam_keys').insert({name:`${EXAM} · ${lv}`,test_type:EXAM,track,level:lv,num_q:merged.length,answers:merged,updated_at:new Date().toISOString()});
        if(error)toast(lv+' 저장실패: '+error.message,false);else saved++;
      }
      await loadKeys(); toast(`정답키 ${saved}개 레벨 저장 · 직접채점 ${saCnt}문항 인식`); renderKeyView();
    }catch(e){console.error(e);toast('엑셀을 읽지 못했어요',false);reset();}
  };
  rd.readAsArrayBuffer(f);
}

  if(isOff){area.innerHTML=head+`<div class="card"><div class="hint">이 레벨은 <b>미응시</b>로 표시돼 있어요.</div></div>`;return;}
  if(!studs.length){area.innerHTML=head+`<div class="card"><div class="hint">이 레벨에 학생이 없어요.</div></div>`;return;}
  // 정답키 없어도 명단은 보여줌
  if(!key){
    area.innerHTML=head+`<div class="card"><div class="lbl">명단 (정답키 등록 전 · 채점칸은 정답키 등록 후 생겨요)</div>
      <div class="rlist">${studs.map(r=>`<div class="ri"><b>${esc(r.name)}</b><div class="c">${esc(r.school||'')} ${esc(gradeKey(r.grade)||'')} · ${esc(r.code||'')}${ROLE==='admin'&&!BRANCH?' · '+esc(r.branchName):''}</div></div>`).join('')}</div>
      <div class="hint" style="margin-top:12px">👉 왼쪽 <b>정답등록</b>에서 이 레벨 정답키를 올리면 여기 답안 입력·채점칸이 생겨요.</div></div>`;

  const ans=(key.answers||[]).slice().sort((a,b)=>a.n-b.n);

  const cols=ans.length; let body='';
  studs.forEach((r,ri)=>{

    ${ans.some(a=>a.type==='sa')?SANOTE:''}

function onCell(inp){scoreRow(inp.closest('tr'));}
function curKey(){const c=curClassObj();return c?keyOfLevel(c.levelCode):null;}
function scoreRow(tr){
  const key=curKey();if(!key)return;const ans=key.answers||[];
  const parts=[...new Set(ans.map(a=>a.part||'전체'))];const got={},pt={};parts.forEach(p=>{got[p]=0;pt[p]=0;});
  ans.forEach(a=>{const part=a.part||'전체';pt[part]+=(a.pt||0);
    const td=tr.querySelector(`td.qcell[data-n="${a.n}"]`);if(!td)return;const inp=td.querySelector('input');const v=(inp?inp.value:'').trim();
    td.classList.remove('ok','no');let ok=false;
    if(v!==''){ok=a.type==='sa'?(v==='1'):(normA(v)===normA(a.ans));td.classList.add(ok?'ok':'no');}
    if(ok)got[part]+=(a.pt||0);});
  parts.forEach(p=>{const c=tr.querySelector(`td.sc[data-part="${CSS.escape(p)}"]`);if(c)c.textContent=Math.round(got[p]*10)/10;});
  const tg=parts.reduce((s,p)=>s+got[p],0),tp=parts.reduce((s,p)=>s+pt[p],0);const score=tp>0?Math.round(tg/tp*1000)/10:0;
  const t=tr.querySelector('td.tot');if(t)t.textContent=score;updateHist(tr);
  return{got,pt,score,totGot:tg,totPt:tp};
}
function navKey(e,inp,cols){
  const r=+inp.dataset.r,c=+inp.dataset.c;let tr=r,tc=c;
  if(e.key==='ArrowRight'||e.key==='Enter')tc++;else if(e.key==='ArrowLeft')tc--;else if(e.key==='ArrowDown')tr++;else if(e.key==='ArrowUp')tr--;else return;
  e.preventDefault();if(tc<0){tc=cols-1;tr--;}if(tc>=cols){tc=0;tr++;}
  const nx=document.querySelector(`#gradeArea input[data-r="${tr}"][data-c="${tc}"]`);if(nx){nx.focus();nx.select();}
}
function updateHist(tr){
  const h=tr.querySelector('.hist');if(!h)return;
  const prev=JSON.parse(tr.dataset.prev||'[]');const att=+(tr.dataset.attempt||1);
  if(att<=1 && !prev.length){h.innerHTML='';return;}   // 재시험 안 본 학생은 표식 없음
  const badge=`<span style="background:var(--warn-s);color:var(--warn);padding:1px 7px;border-radius:20px;margin-right:6px">🔁 재시험 ${att}차</span>`;
  // 이름 옆엔 이전 차수 점수(1차 등)만 표시. 최신 점수는 총점 칸에 이미 나옴.
  const hist=prev.map((s,i)=>`<span style="color:var(--ink3)">${i+1}차 ${s}점</span>`).join(' · ');
  h.innerHTML=badge+hist;
}
/* 재시험: 같은 줄에서 다음 차수 입력 준비 — 이전 차수 점수는 이력에 보존, 답안칸은 비움.
   현재 답안이 비어있으면(=이미 재시험 입력 대기) 연타로 차수 안 올라감. 취소로 되돌리기 가능. */
function reScore(tr){ if(EXAM==='AT') aceScoreRow(tr,aceAns(CURTAB)); else scoreRow(tr); }
function retest(btn){
  const tr=btn.closest('tr');
  const anyInput=[...tr.querySelectorAll('td.qcell input')].some(i=>i.value.trim()!=='');
  if(!anyInput){toast('현재 답안을 먼저 입력한 뒤 재시험을 누르세요');return;}
  const cur=parseFloat((tr.querySelector('td.tot')||{}).textContent)||0;
  const bak={};tr.querySelectorAll('td.qcell input').forEach(i=>bak[i.dataset.n]=i.value);tr.dataset.bak=JSON.stringify(bak);
  const prev=JSON.parse(tr.dataset.prev||'[]');prev.push(cur);tr.dataset.prev=JSON.stringify(prev);
  tr.dataset.attempt=String((+(tr.dataset.attempt||1))+1);
  tr.querySelectorAll('td.qcell').forEach(td=>{td.classList.remove('ok','no');const i=td.querySelector('input');if(i)i.value='';});
  tr.querySelectorAll('td.sc,td.tot').forEach(td=>td.textContent='0');
  updateHist(tr);
  tr.querySelector('td.act').innerHTML='<button class="ghost mini" onclick="retest(this)">재시험</button><button class="ghost mini danger" style="margin-top:4px" onclick="cancelRetest(this)">취소</button>';
  toast(`${tr.dataset.attempt}차 재시험 입력 준비 (실수면 취소)`);
}
function cancelRetest(btn){
  const tr=btn.closest('tr');const bak=JSON.parse(tr.dataset.bak||'{}');
  tr.querySelectorAll('td.qcell input').forEach(i=>{i.value=(bak[i.dataset.n]!=null?bak[i.dataset.n]:'');});
  const prev=JSON.parse(tr.dataset.prev||'[]');prev.pop();tr.dataset.prev=JSON.stringify(prev);
  tr.dataset.attempt=String(Math.max(1,(+(tr.dataset.attempt||1))-1));
  delete tr.dataset.bak;
  tr.querySelector('td.act').innerHTML='<button class="ghost mini" onclick="retest(this)">재시험</button>';
  reScore(tr);
  toast('재시험 취소 — 이전 답안 복원');
}
async function toggleOff(code){

async function saveScores(){

/* ── 답안 엑셀 일괄 업로드 (초등·중등 공통) ── */
function gradeCtx(){

  const key=curKey();const ans=key?(key.answers||[]).slice().sort((a,b)=>a.n-b.n):[];return {sel:'#gradeArea',ans,score:tr=>scoreRow(tr),label:(curClassObj()||{}).levelCode||''};
}
function downloadAnsTemplate(){
  const ctx=gradeCtx();if(!ctx.ans.length){toast('정답키가 없어요',false);return;}
  const rows=[...document.querySelectorAll(ctx.sel+' tbody tr')];
  if(!rows.length){toast('명단이 없어요',false);return;}
  const data=[['회원코드','학생명',...ctx.ans.map(a=>a.n)]];
  rows.forEach(tr=>data.push([tr.dataset.code,tr.dataset.name,...ctx.ans.map(()=>'')]));
  const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:14},{wch:12},...ctx.ans.map(()=>({wch:5}))];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'답안');
  XLSX.writeFile(wb,`답안양식_${ctx.label}.xlsx`);toast('답안 양식 다운로드 · 회원코드 기준으로 채워서 올리세요');

function uploadAns(inp){
  const f=inp.files[0];if(!f)return;const ctx=gradeCtx();if(!ctx.ans.length){toast('정답키가 없어요',false);inp.value='';return;}
  const rd=new FileReader();
  rd.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    let hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes('회원코드'));if(hi<0)hi=0;
    const H=rows[hi].map(x=>String(x).trim());const cCode=H.indexOf('회원코드');
    if(cCode<0){toast('회원코드 열을 못 찾았어요',false);inp.value='';return;}
    const qcol={};H.forEach((h,i)=>{const n=parseInt(String(h).replace(/[^0-9]/g,''),10);if(n&&i>cCode)qcol[n]=i;});
    const trs=[...document.querySelectorAll(ctx.sel+' tbody tr')];let filled=0,miss=0;
    for(let r=hi+1;r<rows.length;r++){const row=rows[r];const code=String(row[cCode]==null?'':row[cCode]).trim();if(!code)continue;
      const tr=trs.find(t=>t.dataset.code===code);if(!tr){miss++;continue;}
      ctx.ans.forEach(a=>{const ci=qcol[a.n];if(ci==null)return;const v=String(row[ci]==null?'':row[ci]).trim();const td=tr.querySelector(`td.qcell[data-n="${a.n}"]`);if(td){const i2=td.querySelector('input');if(i2)i2.value=v;}});
      ctx.score(tr);filled++;
    }
    toast(`${filled}명 답안 불러옴${miss?` · 명단에 없는 ${miss}명 건너뜀`:''} · [채점 결과 저장]을 눌러 반영`);inp.value='';
  }catch(e){console.error(e);toast('엑셀을 읽지 못했어요',false);inp.value='';}};
  rd.readAsArrayBuffer(f);
}

/* ============================================================================
   ACE(AT) 전용 — 반(베이스레벨) → 기간·버전 선택 → 독해/문법/총점 3탭
   ============================================================================ */
function baseLevel(s){const m=String(s||'').match(/^\s*([A-Za-z0-9]+)/);return m?m[1].toUpperCase():'';}
function variantsForBase(base){return KEYS.filter(k=>k.test_type==='AT'&&baseLevel(k.level)===normLv(base)).map(k=>k.level).sort((a,b)=>a.localeCompare(b,'ko'));}
function vLabel(v,base){const s=String(v);return (s.toUpperCase().startsWith(normLv(base))?s.slice(base.length):s).trim()||s;}
function aceAns(section){const k=keyOfLevel(CURVARIANT);return k?(k.answers||[]).filter(a=>(a.part||'')===section).sort((a,b)=>a.n-b.n):[];}
function aceScoreRow(tr,ans){
  let got=0,tot=0;
  ans.forEach(a=>{tot+=(a.pt||0);const td=tr.querySelector(`td.qcell[data-n="${a.n}"]`);if(!td)return;const inp=td.querySelector('input');const v=(inp?inp.value:'').trim();
    td.classList.remove('ok','no');let ok=false;if(v!==''){ok=a.type==='sa'?(v==='1'):(normA(v)===normA(a.ans));td.classList.add(ok?'ok':'no');}if(ok)got+=(a.pt||0);});
  const t=tr.querySelector('td.tot');if(t)t.textContent=got;updateHist(tr);return{got,tot};
}
function onAceCell(inp){aceScoreRow(inp.closest('tr'),aceAns(CURTAB));}
function computeAce(responses,ans){
  const rmap={};(responses||[]).forEach(r=>rmap[r.n]=(r.ans||'').trim());
  let got=0;const subG={};
  ans.forEach(a=>{const sub=a.sub||'기타';const v=rmap[a.n]||'';let ok=false;if(v!==''){ok=a.type==='sa'?(v==='1'):(normA(v)===normA(a.ans));}if(ok){got+=(a.pt||0);subG[sub]=(subG[sub]||0)+(a.pt||0);}});
  return{got,subG};
}
function pickVariant(v){CURVARIANT=v;buildAceArea();}
function pickTab(t){CURTAB=t;buildAceArea();}

        <div style="flex:1"></div>

function buildAceSummary(){return `<div id="aceSum" class="card"><div class="hint">총점 계산 중…</div></div>`;}
async function loadAceSummary(){
  const host=$('aceSum');if(!host)return;
  const cls=curClassObj();const studs=cls.recs.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const dAns=aceAns('독해'),gAns=aceAns('문법');
  let data;try{data=await fetchAll('exam_scores','*',q=>q.eq('test_type','AT'));}catch(e){host.innerHTML='<div class="hint">불러오기 실패</div>';return;}
  const dBy={},gBy={};(data||[]).forEach(r=>{if(r.key_name!==CURVARIANT||(r.round||'1')!=='1')return;if(r.section==='독해')dBy[r.student_code]=r;else if(r.section==='문법')gBy[r.student_code]=r;});
  const dSubs=[...new Set(dAns.map(a=>a.sub||'기타'))],gSubs=[...new Set(gAns.map(a=>a.sub||'기타'))];
  let rows='';
  studs.forEach(st=>{
    const d=dBy[st.code]?computeAce(dBy[st.code].responses,dAns):null;
    const g=gBy[st.code]?computeAce(gBy[st.code].responses,gAns):null;
    const dsc=d?d.got:null,gsc=g?g.got:null,total=(dsc||0)+(gsc||0);
    const subCells=dSubs.map(s=>`<td class="sc">${d?(d.subG[s]||0):'-'}</td>`).join('')+gSubs.map(s=>`<td class="sc">${g?(g.subG[s]||0):'-'}</td>`).join('');
    rows+=`<tr><td class="stu"><b>${esc(st.name)}</b><div class="c">${esc(st.school||'')} ${esc(gradeKey(st.grade)||'')} · ${esc(st.code||'')}</div></td>
      <td class="sc">${dsc==null?'<span style="color:var(--ink3)">미채점</span>':dsc}</td>
      <td class="sc">${gsc==null?'<span style="color:var(--ink3)">미채점</span>':gsc}</td>
      <td class="sc" style="font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2))">${(d&&g)?total:'-'}</td>${subCells}</tr>`;
  });
  const subHdr=dSubs.map(s=>`<th class="part">독해<br>${esc(s)}</th>`).join('')+gSubs.map(s=>`<th class="part">문법<br>${esc(s)}</th>`).join('');
  host.innerHTML=`<div class="lbl">총점 · 세부영역별 점수 <span style="font-weight:700;color:var(--ink3)">(독해 50 + 문법 50 = 100)</span></div>
    <div class="gwrap"><table class="g"><thead><tr class="r1"><th class="stu">학생</th><th>독해<br>/50</th><th>문법<br>/50</th><th>총점<br>/100</th>${subHdr}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function saveAce(){
  const section=CURTAB;if(section==='총점')return;
  const ans=aceAns(section);if(!ans.length){toast('정답키가 없어요',false);return;}
  const trs=[...document.querySelectorAll('#aceContent tbody tr')].filter(tr=>[...tr.querySelectorAll('td.qcell input')].some(i=>i.value.trim()!==''));
  if(!trs.length){toast('입력된 학생이 없어요',false);return;}
  let ok=0;
  for(const tr of trs){
    const s=aceScoreRow(tr,ans);const responses=ans.map(a=>{const td=tr.querySelector(`td.qcell[data-n="${a.n}"]`);return{n:a.n,ans:(td.querySelector('input').value||'').trim()};});
    await sb.from('exam_scores').delete().eq('test_type','AT').eq('key_name',CURVARIANT).eq('section',section).eq('student_code',tr.dataset.code);
    const{error}=await sb.from('exam_scores').insert({key_name:CURVARIANT,section,semester:semName(SEM),test_type:'AT',branch:tr.dataset.branch,class_name:tr.dataset.class,student_name:tr.dataset.name,student_code:tr.dataset.code,responses,correct:0,num_q:ans.length,got_pt:s.got,total_pt:s.tot,score:s.got,graded_at:new Date().toISOString(),round:String(tr.dataset.attempt||'1'),prev_scores:JSON.parse(tr.dataset.prev||'[]')});
    if(error){toast('저장 실패: '+error.message,false);return;}ok++;
  }
  toast(`${section} ${ok}명 저장됨 ✓`);await loadScored();buildAceArea();
}
async function loadAceSaved(section){
  const ans=aceAns(section);if(!ans.length)return;
  let data;try{data=await fetchAll('exam_scores','*',q=>q.eq('test_type','AT'));}catch(e){return;}
  const byCode={};(data||[]).forEach(r=>{if(r.key_name===CURVARIANT&&r.section===section)byCode[r.student_code]=r;});
  document.querySelectorAll('#aceContent tbody tr').forEach(tr=>{const rec=byCode[tr.dataset.code];if(!rec)return;
    tr.dataset.attempt=String(rec.round||'1');tr.dataset.prev=JSON.stringify(rec.prev_scores||[]);
    (rec.responses||[]).forEach(rp=>{const td=tr.querySelector(`td.qcell[data-n="${rp.n}"]`);if(td){const i=td.querySelector('input');if(i)i.value=rp.ans||'';}});
    aceScoreRow(tr,ans);});
}

(async function(){
  try{ await loadAll(); renderSide(); render(); }
  catch(e){ console.error(e); $('content').innerHTML='<div class="loading" style="color:var(--neg)">데이터를 불러오지 못했어요.<br>'+esc(e.message||e)+'</div>'; }
})();
</script>
