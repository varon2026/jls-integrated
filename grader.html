<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험채점</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
:root{--brand:#8b6ee8;--brand2:#a385f0;--soft:#f0ebfe;--ink:#2f3138;--ink2:#6b6385;--ink3:#9a93b0;
--line:#ece8f5;--line2:#f4f1fb;--bg:#f7f5fb;--pos:#22a06b;--pos-s:#e4f6ee;--neg:#e5484d;--neg-s:#fdecec;--warn:#d9822b;--chess:#7a5ce0;--ace:#4e7ca6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding:18px 14px 90px}
.wrap{max-width:960px;margin:0 auto}
.h1{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h1 .sem{font-size:12px;font-weight:700;color:var(--ink3)}
.status{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--line2);color:var(--ink2)}
.status.ok{background:var(--pos-s);color:var(--pos)}.status.err{background:var(--neg-s);color:var(--neg)}
.navmini{margin-left:auto;display:flex;gap:6px}
.navmini button{border:1px solid var(--line);background:#fff;color:var(--ink2);font:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:20px;cursor:pointer}
.navmini button.on{background:var(--soft);color:var(--brand);border-color:transparent}
.examtabs{display:flex;gap:8px;margin-bottom:16px}
.examtabs button{flex:1;border:1px solid var(--line);background:#fff;font:inherit;font-weight:800;color:var(--ink2);padding:13px;border-radius:12px;cursor:pointer;font-size:15px}
.examtabs button .s{font-size:12px;color:var(--ink3);font-weight:700}
.examtabs button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(139,110,232,.3)}
.examtabs button.on .s{color:#fff;opacity:.85}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(80,70,120,.05)}
.step{font-size:12px;font-weight:800;color:var(--brand);background:var(--soft);display:inline-block;padding:3px 11px;border-radius:20px;margin-bottom:13px}
.step .sub{font-weight:600;color:var(--ink3)}
.lbl{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:5px}
input,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--ink);background:#fff;outline:none;width:100%}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.up{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.up>div{flex:1;min-width:150px}
.filebox{position:relative;border:1.5px dashed #d9cff2;border-radius:10px;padding:11px;text-align:center;color:var(--ink3);font-size:13px;background:#faf8ff;font-weight:700}
.filebox.has{border-style:solid;border-color:var(--brand);color:var(--brand);background:#fff}
.filebox input{position:absolute;inset:0;opacity:0;cursor:pointer;height:100%}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.mini{padding:4px 9px;font-size:11.5px;border-radius:8px}
.danger{color:var(--neg);border-color:#f3cdcf}
.chips{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--line2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
.chip b{color:var(--brand)}
.chip .x{color:var(--neg);cursor:pointer;margin-left:6px}
.modetog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.modetog button{border:none;background:#fff;font:inherit;font-weight:700;font-size:13px;padding:9px 14px;cursor:pointer;color:var(--ink2)}
.modetog button.on{background:var(--soft);color:var(--brand)}
/* 검색 드롭다운 */
.dd{position:relative;max-width:520px}
.ddbox{border:1.5px solid var(--brand);border-radius:10px;padding:11px 14px;font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;box-shadow:0 0 0 3px var(--soft);cursor:pointer}
.ddbox .ph{color:var(--ink3);font-weight:600}
.ddlist{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(80,70,120,.16);z-index:20;overflow:hidden}
.ddlist input{border:none;border-bottom:1px solid var(--line2);border-radius:0;padding:11px 14px}
.ddlist input:focus{box-shadow:none}
.ddopts{max-height:280px;overflow:auto}
.ddopt{padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;align-items:center;gap:4px}
.ddopt:hover,.ddopt.kbd{background:var(--soft);color:var(--brand);font-weight:800}
.ddopt .cnt{color:var(--ink3);font-weight:600;font-size:12px;margin-left:auto}
.ddempty{padding:14px;text-align:center;color:var(--ink3);font-size:13px}
.tag{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 8px}
.tag.ace{background:#e9f0fb;color:var(--ace)}.tag.chess{background:#efe9fc;color:var(--chess)}
.info{font-size:12.5px;color:var(--ink2);margin-bottom:10px}.info b{color:var(--ink)}
.gwrap{overflow:auto;border:1px solid var(--line2);border-radius:10px;max-height:65vh}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{border:1px solid var(--line2);padding:6px 5px;text-align:center;white-space:nowrap}
th{background:var(--line2);color:var(--ink3);font-size:11px;font-weight:700;position:sticky;top:0;z-index:1}
th.part{background:#efeafb;color:var(--brand)}
td.stu,th.stu{text-align:left;background:#fff;font-weight:700;position:sticky;left:0;min-width:132px;z-index:2}
th.stu{z-index:3}
td.stu .c{font-size:11px;color:var(--ink3);font-weight:600}
td.qcell input{width:34px;height:26px;border-radius:6px;text-align:center;padding:0;border:1px solid var(--line)}
.qcell.ok input{background:var(--pos-s);border-color:#b6e2cd;color:var(--pos);font-weight:800}
.qcell.no input{background:var(--neg-s);border-color:#f3c5c7;color:var(--neg);font-weight:800}
.qcell.sa input{background:#fffdf5;border-color:#eadfb8}
.sc{font-weight:800;color:var(--brand)}
.cfg-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin:4px 6px 0 0;font-weight:800;font-size:12px;cursor:pointer;background:#fff}
.cfg-chip.on{background:var(--pos-s);color:var(--pos);border-color:#b6e2cd}
.cfg-chip.off{background:var(--line2);color:var(--ink3);text-decoration:line-through}
.pbar{position:relative;height:22px;background:var(--line2);border-radius:20px;overflow:hidden;min-width:120px}
.pbar>div{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.pbar span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;color:var(--ink2)}
.hint{font-size:11.5px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2f2b3a;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1}.toast.err{background:#b23a55}
@media(max-width:640px){.up>div{min-width:calc(50% - 6px)}.examtabs button{font-size:13px;padding:11px 6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="h1">📝 시험채점 <span id="seminfo" class="sem"></span><span id="conn" class="status">연결 중…</span>
    <span class="navmini"><button id="nv-grade" class="on" onclick="showView('grade')">채점</button><button id="nv-prog" onclick="showView('prog')">진행률</button><button id="nv-result" onclick="showView('result')">결과</button></span>
  </div>

  <div class="examtabs">
    <button id="ex-DT" class="on" onclick="setExam('DT')">DT <span class="s">CHESS</span></button>
    <button id="ex-AT" onclick="setExam('AT')">AT <span class="s">ACE</span></button>
    <button id="ex-내신모의고사" onclick="setExam('내신모의고사')">내신모의고사 <span class="s">초6·중1</span></button>
  </div>

  <!-- ===== 채점 뷰 ===== -->
  <div id="view-grade">
    <div class="card">
      <span class="step">① 정답지 등록 <span class="sub" id="key-mode-note">— AT는 파일 업로드 / 체스는 붙여넣기</span></span>
      <div class="up">
        <div style="max-width:260px"><div class="lbl">레벨 (명단에서 선택)</div><select id="k-level"></select></div>
        <div style="flex:0 0 auto"><div class="lbl">방식</div><div class="modetog"><button id="mode-file" class="on" onclick="setKeyMode('file')">파일 업로드</button><button id="mode-paste" onclick="setKeyMode('paste')">붙여넣기</button></div></div>
      </div>
      <div id="mode-file-box" class="up" style="margin-top:10px">
        <div><div class="lbl" id="lbl-read">독해 문항속성</div><div class="filebox" id="fb-read">📄 파일 선택<input type="file" id="k-read" accept=".xlsx,.xls" onchange="fbName('read')"></div></div>
        <div id="wrap-gram"><div class="lbl">문법 문항속성</div><div class="filebox" id="fb-gram">📄 파일 선택<input type="file" id="k-gram" accept=".xlsx,.xls" onchange="fbName('gram')"></div></div>
      </div>
      <div id="mode-paste-box" class="up" style="margin-top:10px;display:none">
        <div style="flex:2;min-width:220px"><div class="lbl">정답 붙여넣기 (문항 순서대로 · 예: 2,3,1,4,2,5…)</div><input id="k-paste" placeholder="2,3,1,4,2,5,3,1,…"></div>
        <div><div class="lbl">선긋기·수동 문항번호 (선택)</div><input id="k-manual" placeholder="예: 22, 30"></div>
        <div style="max-width:100px"><div class="lbl">총점</div><input id="k-total" type="number" value="100"></div>
      </div>
      <div style="margin-top:12px"><button class="btn" onclick="parseAndSaveKey()">정답키 저장</button></div>
      <div class="chips" id="key-chips"></div>
    </div>

    <div class="card">
      <span class="step">② 레벨 선택 <span class="sub" id="scope-note"></span></span>
      <div class="dd" id="dd">
        <div class="ddbox" onclick="toggleDD()"><span id="dd-label" class="ph">— 레벨/반 선택 —</span><span>▾</span></div>
        <div class="ddlist" id="dd-list" style="display:none">
          <input id="dd-search" placeholder="입력해서 바로 검색…" oninput="renderDDOpts()">
          <div class="ddopts" id="dd-opts"></div>
        </div>
      </div>
    </div>

    <div class="card" id="grid-card" style="display:none">
      <span class="step">③ 학생 명단 · 답안 입력</span>
      <div id="g-info" class="info"></div>
      <div id="grid-host"></div>
      <div style="margin-top:12px"><button class="btn" onclick="saveScores()">채점결과 저장</button></div>
    </div>
  </div>

  <!-- ===== 진행률 뷰 ===== -->
  <div id="view-prog" style="display:none">
    <div class="card">
      <span class="step">시험 대상 설정 <span class="sub">— 이 시험 안 보는 반은 '시험없음'으로</span></span>
      <div id="cfg-host"></div>
    </div>
    <div class="card">
      <span class="step">분원별 진행률</span>
      <div id="prog-host"></div>
    </div>
  </div>

  <!-- ===== 결과 뷰 ===== -->
  <div id="view-result" style="display:none">
    <div class="card">
      <span class="step">채점 결과 · 다운로드</span>
      <div class="up" style="margin-bottom:12px">
        <div style="max-width:220px"><div class="lbl">분원 필터</div><select id="r-branch" onchange="renderResults()"><option value="">전체</option></select></div>
        <div style="flex:0 0 auto"><div class="lbl">&nbsp;</div><button class="btn" onclick="exportXlsx()">엑셀 다운로드 (성적입력양식)</button></div>
      </div>
      <div id="result-host"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPA_URL='https://hplndiuoohantbalixwu.supabase.co';
const SUPA_KEY='sb_publishable_xO8KB46SzMx8KeuEE-OVSw_su22mv9X';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
// 체스 레벨코드: IS·DS·LS·MS 로 시작 (IS1~MSB2). 그 외(A/B/HB/PA…)는 에이스.

let EXAM='DT', SEMID=null, SEMNAME='', ROLE='admin', MYBRANCH=null;
let STUDENTS={}, BRANCHES={}, ROSTER=[], KEYS=[], CONFIG={}, RESULTS=[];
let CURCLASS=null, CURKEY=null, KEYMODE='file';

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ok){const t=$('toast');t.textContent=m;t.className='toast show'+(ok===false?' err':'');setTimeout(()=>t.className='toast',2800);}
function levelAlpha(cn){const m=String(cn||'').match(/^\s*\[([A-Za-z]+)/);return m?m[1].toUpperCase():'';}
function isChess(cn){const a=levelAlpha(cn);return /^(IS|DS|LS|MS)/.test(a);}
function gradeKey(g){g=String(g||'').trim();let m;if(m=g.match(/중\s*등?\s*(\d)/))return '중'+m[1];if(m=g.match(/초\s*등?\s*(\d)/))return '초'+m[1];if(m=g.match(/고\s*(\d)/))return '고'+m[1];if(m=g.match(/^(\d)$/))return '초'+m[1];return g;}
function disabledSet(){return CONFIG[EXAM]||new Set();}
function classKey(r){return (r.classLabel||r.className)+' · '+r.branchName;}
function classInScope(r){if(EXAM==='DT')return r.chess;if(EXAM==='AT')return !r.chess;const gk=gradeKey(r.grade);return !r.chess&&(gk==='초6'||gk==='중1');}
function classesForExam(){const m=new Map();ROSTER.filter(classInScope).forEach(r=>{const k=classKey(r);if(!m.has(k))m.set(k,{key:k,label:(r.classLabel||r.className),branch:r.branchName,chess:r.chess,recs:[]});m.get(k).recs.push(r);});return [...m.values()].sort((a,b)=>a.key.localeCompare(b.key));}

/* ===== 초기 로드 ===== */
(async()=>{try{
  const q=new URLSearchParams(location.search);SEMID=q.get('sem')||null;ROLE=q.get('role')||'admin';MYBRANCH=q.get('branch')||null;
  const [br,st,se,sr]=await Promise.all([
    sb.from('branches').select('*'),
    sb.from('students').select('id,code,name,school,grade'),
    sb.from('semesters').select('*'),
    sb.from('semester_records').select('student_id,branch_id,semester_id,class_name,class_label,status,kind').limit(30000)]);
  if(br.error||st.error||sr.error)throw(br.error||st.error||sr.error);
  (br.data||[]).forEach(b=>BRANCHES[b.id]=b.name);
  (st.data||[]).forEach(s=>STUDENTS[s.id]={name:s.name,code:s.code,grade:s.grade});
  const recs=(sr.data||[]).filter(r=>(r.kind||'regular')!=='exam');
  if(!SEMID){const cnt={};recs.forEach(r=>{if(r.status==='active')cnt[r.semester_id]=(cnt[r.semester_id]||0)+1;});SEMID=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||null;}
  const sn=(se.data||[]).find(s=>s.id===SEMID);SEMNAME=sn?sn.name:'';
  ROSTER=recs.filter(r=>r.semester_id===SEMID&&r.status==='active'&&(ROLE==='admin'||!MYBRANCH||r.branch_id===MYBRANCH))
    .map(r=>{const s=STUDENTS[r.student_id]||{};return {studentId:r.student_id,name:s.name||'',code:s.code||'',grade:s.grade||'',className:r.class_name||'',classLabel:r.class_label||r.class_name||'',branchId:r.branch_id,branchName:BRANCHES[r.branch_id]||'',chess:isChess(r.class_name)};});
  $('conn').textContent='연결됨';$('conn').className='status ok';
  const scopeTxt=(ROLE==='admin')?'전체 분원':(BRANCHES[MYBRANCH]||'우리 분원');
  $('seminfo').textContent=`· ${SEMNAME||'현재 학기'} · ${scopeTxt} 재원 ${ROSTER.length}명`;
  $('r-branch').innerHTML='<option value="">전체</option>'+[...new Set(ROSTER.map(r=>r.branchName))].map(n=>`<option>${esc(n)}</option>`).join('');
  await loadKeys();await loadConfig();setExam('DT');
}catch(e){$('conn').textContent='연결 오류';$('conn').className='status err';console.error(e);}})();

function setExam(t){EXAM=t;['DT','AT','내신모의고사'].forEach(x=>$('ex-'+x).className=x===t?'on':'');
  $('scope-note').textContent = t==='DT'?'— DT라서 CHESS 레벨만 떠요':t==='AT'?'— AT라서 ACE 레벨만 떠요':'— 내신이라 초6·중1 반만 떠요';
  const at=(t==='AT');$('wrap-gram').style.display=at?'':'none';$('lbl-read').textContent=at?'독해 문항속성':'문항속성';
  setKeyMode(at?'file':'paste');fillKeyLevels();
  CURCLASS=null;CURKEY=null;$('dd-label').textContent='— 레벨/반 선택 —';$('dd-label').className='ph';$('grid-card').style.display='none';
  renderKeyChips();renderCfg();loadProgress();loadResults();renderDDOpts();}
function setKeyMode(m){KEYMODE=m;$('mode-file').className=m==='file'?'on':'';$('mode-paste').className=m==='paste'?'on':'';
  $('mode-file-box').style.display=m==='file'?'':'none';$('mode-paste-box').style.display=m==='paste'?'':'none';
  $('key-mode-note').textContent=m==='paste'?'— 레벨 고르고 정답을 순서대로 붙여넣기 (체스용)':'— 문항속성 엑셀 올리면 자동 인식 (AT용)';}
function fillKeyLevels(){const sel=$('k-level');if(!sel)return;const cur=sel.value;const lv=[...new Set(ROSTER.filter(classInScope).map(r=>r.classLabel||r.className))].sort();
  sel.innerHTML='<option value="">— 레벨 선택 —</option>'+lv.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');if(cur)sel.value=cur;}
function showView(v){['grade','prog','result'].forEach(x=>{$('view-'+x).style.display=x===v?'':'none';$('nv-'+x).className=x===v?'on':'';});
  if(v==='prog'){renderCfg();loadProgress();}if(v==='result')loadResults();}

/* ===== 파일 업로드 표시 ===== */
function fbName(which){const f=$('k-'+which).files[0];const box=$('fb-'+which);if(f){box.classList.add('has');box.childNodes[0].nodeValue='📄 '+f.name;}else{box.classList.remove('has');box.childNodes[0].nodeValue='📄 파일 선택';}}

/* ===== 정답키 파싱 ===== */
function readCells(wb){const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).map(r=>r.map(c=>c==null?'':c));}
function num(x){const n=parseFloat(String(x).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n;}
function parseGrammar(rows){const hi=rows.findIndex(r=>r.map(x=>String(x).trim()).includes('번호')&&r.map(x=>String(x).trim()).includes('정답'));if(hi<0)return null;
  const H=rows[hi].map(x=>String(x).trim());const cN=H.indexOf('번호'),cA=H.indexOf('정답'),cP=H.indexOf('배점');const out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];const no=num(r[cN]);if(no==null)continue;const ans=String(r[cA]==null?'':r[cA]).trim();if(ans==='')continue;const pt=(cP>=0?num(r[cP]):null)||2;out.push({n:no,type:/^\d+$/.test(ans)?'mc':'sa',ans,pt});}
  return out.length?out:null;}
function parseReading(rows){let anscol=-1;for(let i=0;i<Math.min(3,rows.length);i++)rows[i].forEach((c,j)=>{if(String(c).trim().toLowerCase()==='answer')anscol=j;});if(anscol<0)anscol=rows[0].length-1;
  const out=[],seen=new Set();for(const r of rows){const no=num(r[1]);if(no==null||no<1||no>300)continue;const a=String(r[anscol]==null?'':r[anscol]).trim();if(a===''||seen.has(no))continue;seen.add(no);out.push({n:no,type:/^\d+$/.test(a)?'mc':'sa',ans:a,pt:2});}
  return out.length?out.sort((a,b)=>a.n-b.n):null;}
async function saveKeyRec(level,answers,track){
  const num_q=answers.length;const rec={name:`${SEMNAME?SEMNAME+' ':''}${EXAM} · ${level}`,semester:SEMNAME,test_type:EXAM,track,level,num_q,answers,updated_at:new Date().toISOString()};
  const{error}=await sb.from('exam_keys').insert(rec);if(error){toast('저장 실패: '+error.message,false);return false;}
  await loadKeys();renderKeyChips();buildGrid();return true;}
async function parseAndSaveKey(){const level=$('k-level').value;if(!level){toast('레벨을 고르세요',false);return;}
  if(KEYMODE==='paste'){
    const raw=$('k-paste').value.trim();if(!raw){toast('정답을 붙여넣으세요',false);return;}
    const arr=raw.split(/[\s,]+/).filter(Boolean);if(!arr.length){toast('정답을 못 읽었어요',false);return;}
    const manual=new Set(($('k-manual').value||'').split(/[\s,]+/).filter(Boolean).map(x=>parseInt(x,10)));
    const total=parseFloat($('k-total').value||'100')||100;const pt=Math.round(total/arr.length*100)/100;
    const answers=arr.map((a,i)=>{const n=i+1;return manual.has(n)?{part:'main',n,type:'sa',ans:'',pt}:{part:'main',n,type:'mc',ans:String(a).toUpperCase(),pt};});
    if(await saveKeyRec(level,answers,EXAM==='DT'?'CHESS':'ACE')){toast(`정답키 저장됨 ✓ (${arr.length}문항)`);$('k-paste').value='';$('k-manual').value='';}
    return;
  }
  const readF=$('k-read').files[0],gramF=$('k-gram').files[0];if(!readF){toast('문항속성 파일을 올리세요',false);return;}
  try{const parts=[];const rRows=readCells(XLSX.read(await readF.arrayBuffer(),{type:'array'}));const rKey=parseReading(rRows)||parseGrammar(rRows);
    if(!rKey){toast('파일을 못 읽었어요 (형식 확인)',false);return;}parts.push({part:EXAM==='AT'?'독해':'main',items:rKey});
    if(EXAM==='AT'&&gramF){const gKey=parseGrammar(readCells(XLSX.read(await gramF.arrayBuffer(),{type:'array'})))||parseReading(readCells(XLSX.read(await gramF.arrayBuffer(),{type:'array'})));if(!gKey){toast('문법 파일을 못 읽었어요',false);return;}parts.push({part:'문법',items:gKey});}
    const answers=[];parts.forEach(p=>p.items.forEach(it=>answers.push({part:p.part,...it})));
    const rec={name:`${SEMNAME?SEMNAME+' ':''}${EXAM} · ${level}`,semester:SEMNAME,test_type:EXAM,track:EXAM==='DT'?'CHESS':'ACE',level,num_q:answers.length,answers,updated_at:new Date().toISOString()};
    const{error}=await sb.from('exam_keys').insert(rec);if(error){toast('저장 실패: '+error.message,false);return;}
    toast('정답키 저장됨 ✓');$('k-level').value='';$('k-read').value='';if($('k-gram'))$('k-gram').value='';fbName('read');fbName('gram');
    await loadKeys();renderKeyChips();buildGrid();
  }catch(e){toast('파일 파싱 오류',false);console.error(e);}}
async function loadKeys(){const{data,error}=await sb.from('exam_keys').select('*').order('created_at',{ascending:false});if(!error)KEYS=data||[];}
function keysOfExam(){return KEYS.filter(k=>k.test_type===EXAM&&(!SEMNAME||!k.semester||k.semester===SEMNAME));}
function renderKeyChips(){const host=$('key-chips');const list=keysOfExam();
  host.innerHTML='<span class="chip">저장된 정답키:</span>'+(list.length?list.map(k=>{const pt=(k.answers||[]).reduce((s,a)=>s+(a.pt||0),0);return `<span class="chip"><b>${esc(k.level||k.name)}</b> · ${k.num_q}문항 ${pt}점 <span class="x" onclick="delKey('${k.id}')">✕</span></span>`;}).join(''):'<span class="hint">아직 없어요. 위에서 파일을 올리세요.</span>');}
async function delKey(id){if(!confirm('이 정답키를 삭제할까요?'))return;await sb.from('exam_keys').delete().eq('id',id);await loadKeys();renderKeyChips();buildGrid();}

/* ===== 검색 드롭다운 ===== */
function toggleDD(){const l=$('dd-list');const open=l.style.display==='none';l.style.display=open?'':'none';if(open){$('dd-search').value='';renderDDOpts();setTimeout(()=>$('dd-search').focus(),0);}}
document.addEventListener('click',e=>{if(!$('dd').contains(e.target))$('dd-list').style.display='none';});
function renderDDOpts(){const host=$('dd-opts');if(!host)return;const q=($('dd-search')?$('dd-search').value:'').trim();const off=disabledSet();
  let cls=classesForExam().filter(c=>!off.has(c.key));if(q)cls=cls.filter(c=>c.key.replace(/\s/g,'').includes(q.replace(/\s/g,'')));
  if(!cls.length){host.innerHTML='<div class="ddempty">해당 반이 없어요</div>';return;}
  host.innerHTML=cls.map(c=>`<div class="ddopt" onclick="pickClass('${esc(c.key).replace(/'/g,"\\'")}')"><span class="tag ${c.chess?'chess':'ace'}">${c.chess?'CHESS':'ACE'}</span> ${esc(c.label)} <span class="hint">· ${esc(c.branch)}</span><span class="cnt">${c.recs.length}명</span></div>`).join('');}
function pickClass(k){CURCLASS=k;$('dd-label').textContent=k;$('dd-label').className='';$('dd-list').style.display='none';buildGrid();}

/* ===== 채점 그리드 ===== */
function curStuds(){if(!CURCLASS)return[];return ROSTER.filter(classInScope).filter(r=>classKey(r)===CURCLASS);}
function autoKey(){const studs=curStuds();return keysOfExam().find(k=>{const lv=(k.level||'').replace(/\s/g,'');return CURCLASS.replace(/\s/g,'').includes(lv);})||keysOfExam()[0]||null;}
function buildGrid(){const host=$('grid-host');if(!CURCLASS){$('grid-card').style.display='none';return;}
  $('grid-card').style.display='';CURKEY=autoKey();
  const studs=curStuds();
  if(!CURKEY){host.innerHTML='<div class="hint">이 시험의 정답키가 없어요. 위 ① 에서 정답지를 올리세요.</div>';$('g-info').textContent='';return;}
  const ans=CURKEY.answers||[];const parts=[...new Set(ans.map(a=>a.part))];
  $('g-info').innerHTML=`반 <b>${esc(CURCLASS)}</b> · <b>${studs.length}명</b> · 정답키 <b>${esc(CURKEY.level||CURKEY.name)}</b> (${ans.length}문항) · 객관식=번호, 주관식(*)=1/0`;
  if(!studs.length){host.innerHTML='<div class="hint">이 반에 재원생이 없어요.</div>';return;}
  let h=`<div class="gwrap"><table><thead><tr><th class="stu" rowspan="2">학생</th>`;
  parts.forEach(p=>h+=`<th class="part" colspan="${ans.filter(a=>a.part===p).length}">${esc(p==='main'?'문항':p)}</th>`);
  parts.forEach(p=>h+=`<th class="part" rowspan="2">${esc(p==='main'?'점수':p)}</th>`);h+=`<th class="part" rowspan="2">총점</th></tr><tr>`;
  ans.forEach(a=>h+=`<th title="${a.type==='sa'?'주관식 1/0':''}">${a.n}${a.type==='sa'?'*':''}</th>`);h+=`</tr></thead><tbody>`;
  studs.forEach(s=>{h+=`<tr data-code="${esc(s.code)}"><td class="stu">${esc(s.name)}<div class="c">${esc(s.code)}·${esc(s.branchName)}</div></td>`;
    ans.forEach((a,i)=>h+=`<td class="qcell ${a.type==='sa'?'sa':''}" data-i="${i}"><input inputmode="numeric" oninput="gradeRow(this)" placeholder="${a.type==='sa'?'1/0':''}"></td>`);
    parts.forEach(()=>h+=`<td class="sc partsc">-</td>`);h+=`<td class="sc tot">-</td></tr>`;});
  h+=`</tbody></table></div>`;host.innerHTML=h;}
function gradeRow(inp){const tr=inp.closest('tr');const ans=CURKEY.answers||[];const parts=[...new Set(ans.map(a=>a.part))];const got={},pt={};parts.forEach(p=>{got[p]=0;pt[p]=0;});
  tr.querySelectorAll('td.qcell').forEach(td=>{const a=ans[+td.dataset.i];const p=a.pt||2;pt[a.part]+=p;const v=td.querySelector('input').value.trim();td.classList.remove('ok','no');if(v==='')return;
    const ok=a.type==='sa'?(v==='1'):(v.toUpperCase()===String(a.ans).trim().toUpperCase());td.classList.add(ok?'ok':'no');if(ok)got[a.part]+=p;});
  let tot=0;const pscs=tr.querySelectorAll('.partsc');parts.forEach((p,i)=>{if(pscs[i])pscs[i].textContent=got[p];tot+=got[p];});tr.querySelector('.tot').textContent=tot;}
async function saveScores(){if(!CURKEY||!CURCLASS){toast('반·정답키를 확인하세요',false);return;}const ans=CURKEY.answers||[];const parts=[...new Set(ans.map(a=>a.part))];const studs=curStuds();
  const trs=[...document.querySelectorAll('#grid-host tbody tr')];const recs=[];
  trs.forEach((tr,ri)=>{const s=studs[ri]||{};const responses=[];const got={},pt={};parts.forEach(p=>{got[p]=0;pt[p]=0;});let any=false;
    tr.querySelectorAll('td.qcell').forEach(td=>{const a=ans[+td.dataset.i];const p=a.pt||2;pt[a.part]+=p;const v=td.querySelector('input').value.trim();if(v!=='')any=true;
      const ok=a.type==='sa'?(v==='1'):(v!==''&&v.toUpperCase()===String(a.ans).trim().toUpperCase());if(ok)got[a.part]+=p;responses.push({part:a.part,n:a.n,ans:v,ok:!!ok});});
    if(!any)return;const g=Object.values(got).reduce((a,b)=>a+b,0),t=Object.values(pt).reduce((a,b)=>a+b,0);
    recs.push({key_id:CURKEY.id,key_name:CURKEY.level||CURKEY.name,semester:SEMNAME,test_type:EXAM,branch:s.branchName||'',class_name:CURCLASS,student_name:s.name||'',student_code:s.code||null,responses,correct:responses.filter(r=>r.ok).length,num_q:ans.length,got_pt:g,total_pt:t,score:t>0?Math.round(g/t*100):0,graded_at:new Date().toISOString()});});
  if(!recs.length){toast('입력된 학생이 없어요',false);return;}const{error}=await sb.from('exam_scores').insert(recs);if(error){toast('저장 실패: '+error.message,false);return;}toast(recs.length+'명 저장됨 ✓');loadProgress();}

/* ===== 시험대상/진행률 ===== */
async function loadConfig(){const{data,error}=await sb.from('exam_config').select('*');CONFIG={};if(!error&&data)data.forEach(r=>CONFIG[r.test_type]=new Set(r.disabled||[]));}
function renderCfg(){const host=$('cfg-host');if(!host)return;const cls=classesForExam();if(!cls.length){host.innerHTML='<div class="hint">이 시험 대상 반이 없어요.</div>';return;}const off=disabledSet();
  host.innerHTML=cls.map(c=>`<span class="cfg-chip ${off.has(c.key)?'off':'on'}" onclick="toggleCfg('${esc(c.key).replace(/'/g,"\\'")}')">${off.has(c.key)?'✕ 시험없음':'✓ 대상'} · ${esc(c.label)}·${esc(c.branch)} (${c.recs.length})</span>`).join('');}
async function toggleCfg(k){const off=CONFIG[EXAM]||(CONFIG[EXAM]=new Set());off.has(k)?off.delete(k):off.add(k);await sb.from('exam_config').upsert({test_type:EXAM,disabled:[...off],updated_at:new Date().toISOString()},{onConflict:'test_type'});renderCfg();renderDDOpts();loadProgress();}
async function loadProgress(){const host=$('prog-host');if(!host)return;const off=disabledSet();
  const{data,error}=await sb.from('exam_scores').select('branch,class_name,student_code,student_name,test_type').eq('test_type',EXAM).limit(30000);if(error){host.innerHTML='<div class="hint">실패</div>';return;}
  const done={};(data||[]).forEach(r=>{if(off.has(r.class_name))return;const b=r.branch||'(미지정)';(done[b]=done[b]||new Set()).add(r.student_code||r.student_name);});
  const tot={};ROSTER.filter(classInScope).forEach(r=>{if(off.has(classKey(r)))return;const b=r.branchName||'(미지정)';tot[b]=(tot[b]||0)+1;});
  const brs=[...new Set([...Object.keys(tot),...Object.keys(done)])];if(!brs.length){host.innerHTML='<div class="hint">대상 학생이 없어요.</div>';return;}
  host.innerHTML='<table><thead><tr><th>분원</th><th style="width:100px">입력/전체</th><th>진행률</th></tr></thead><tbody>'+brs.map(b=>{const d=done[b]?done[b].size:0,t=tot[b]||0,p=t?Math.round(d/t*100):0;return `<tr><td>${esc(b)}</td><td>${d} / ${t}</td><td><div class="pbar"><div style="width:${Math.min(100,p)}%"></div><span>${p}%</span></div></td></tr>`;}).join('')+'</tbody></table>';}

/* ===== 결과 ===== */
async function loadResults(){const{data,error}=await sb.from('exam_scores').select('*').eq('test_type',EXAM).order('graded_at',{ascending:false}).limit(30000);if(error){$('result-host').innerHTML='<div class="hint">실패</div>';return;}RESULTS=data||[];renderResults();}
function renderResults(){const host=$('result-host');if(!host)return;const bf=$('r-branch').value;const list=RESULTS.filter(r=>!bf||r.branch===bf);if(!list.length){host.innerHTML='<div class="hint">저장된 결과가 없어요.</div>';return;}
  host.innerHTML=`<div class="hint" style="margin-bottom:6px">${list.length}건</div><div class="gwrap"><table><thead><tr><th>분원</th><th>반</th><th>이름</th><th>코드</th><th>정답수</th><th>점수</th><th></th></tr></thead><tbody>`+list.map(r=>`<tr><td>${esc(r.branch)}</td><td>${esc(r.class_name)}</td><td>${esc(r.student_name)}</td><td>${esc(r.student_code||'')}</td><td>${r.correct}/${r.num_q}</td><td class="sc">${r.score}</td><td><button class="ghost mini danger" onclick="delResult('${r.id}')">삭제</button></td></tr>`).join('')+'</tbody></table></div>';}
async function delResult(id){if(!confirm('삭제할까요?'))return;await sb.from('exam_scores').delete().eq('id',id);loadResults();loadProgress();}
function exportXlsx(){const bf=$('r-branch').value;const list=RESULTS.filter(r=>!bf||r.branch===bf);if(!list.length){toast('결과가 없어요',false);return;}
  const parts=[];list.forEach(r=>(r.responses||[]).forEach(x=>{if(!parts.includes(x.part))parts.push(x.part);}));const pc={};parts.forEach(p=>pc[p]=Math.max(0,...list.map(r=>(r.responses||[]).filter(x=>x.part===p).length)));
  const head=['학생코드','레벨','담임','학생명','분원명','학교','학년','다음학기 배정과정'];parts.forEach(p=>{const l=(p==='main'?'문항':p);for(let i=1;i<=pc[p];i++)head.push(l+i);});parts.forEach(p=>head.push((p==='main'?'':p)+'점수'));head.push('총점');
  const aoa=[head];list.forEach(r=>{const row=[r.student_code||'',r.key_name||'','',r.student_name||'',r.branch||'','','',''];const bp={};parts.forEach(p=>bp[p]=(r.responses||[]).filter(x=>x.part===p).sort((a,b)=>a.n-b.n));
    parts.forEach(p=>{for(let i=0;i<pc[p];i++)row.push(bp[p][i]?bp[p][i].ans:'');});parts.forEach(p=>row.push(bp[p].reduce((s,x)=>s+(x.ok?2:0),0)));row.push(r.got_pt);aoa.push(row);});
  const ws=XLSX.utils.aoa_to_sheet(aoa),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'성적입력');XLSX.writeFile(wb,'성적입력_'+EXAM+'.xlsx');toast('엑셀 다운로드 ✓');}
</script>
