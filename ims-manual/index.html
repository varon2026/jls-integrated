<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iMS 매뉴얼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/NanumBarunGothic/subsets/NanumBarunGothic-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
/* 메뉴 글씨만 쭉 있는 첫 화면 → 글씨를 누르면 화면이 좌/우로 갈라지면서
   왼쪽 목록은 전부 블러 처리되고 누른 항목만 선명하게 맨 앞(order:-1)으로 오고,
   오른쪽에 그 항목 설명이 펼쳐진다. 좁은 화면(폰)에서는 위/아래로 자동 전환. */
:root{
  --bg:#ffffff;
  --bg-alt:#f5f5f7;
  --ink:#1d1d1f;
  --muted:#86868b;
  --accent:#8f6a00;
  --accent-glow:rgba(255,209,64,.35);
  --accent-pastel:rgba(255,209,64,.55);
  --line:rgba(0,0,0,.09);
  --navblur:rgba(255,255,255,.72);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--bg-alt:#1d1d1f;--ink:#f5f5f7;--muted:#98989d;
    --accent:#ffd666;--accent-glow:rgba(255,214,102,.3);--accent-pastel:rgba(255,214,102,.3);--line:rgba(255,255,255,.13);--navblur:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--bg-alt:#1d1d1f;--ink:#f5f5f7;--muted:#98989d;
  --accent:#ffd666;--accent-glow:rgba(255,214,102,.3);--accent-pastel:rgba(255,214,102,.3);--line:rgba(255,255,255,.13);--navblur:rgba(0,0,0,.6);color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Nanum Barun Gothic','Noto Sans KR',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
[hidden]{display:none!important}
h1,h2{margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.02em}
p{margin:0}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}

/* ───────── layout shell ───────── */
.layout{display:flex;align-items:stretch;min-height:100vh}

/* ───────── list pane ───────── */
.list-pane{flex:1 1 100%;display:flex;align-items:center;justify-content:flex-start;padding:14vh 20px 10vh 5vw;position:relative;transition:flex-basis .55s cubic-bezier(.2,.7,.2,1)}
.layout.split .list-pane{flex:0 0 19%;min-width:230px;align-items:flex-start;padding:12vh 16px 10vh 3vw;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:hidden}
.list-inner{display:flex;flex-direction:column;width:100%;max-width:900px;position:relative;isolation:isolate}
.layout.split .list-inner{max-width:230px}
.glow{position:absolute;left:var(--mx,-9999px);top:var(--my,-9999px);width:520px;height:520px;margin-left:-260px;margin-top:-260px;pointer-events:none;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 68%);filter:blur(36px);opacity:0;transition:opacity .4s ease;z-index:0}
.list-inner:hover .glow{opacity:1}

.item{all:unset;display:block;padding-block:16px;cursor:pointer;order:0;position:relative;z-index:1;transition:filter .45s ease,opacity .45s ease}
.item .label{display:inline-block;font-size:clamp(46px,8.6vw,96px);font-weight:700;letter-spacing:-.03em;line-height:1.12;color:var(--ink);
  background-image:linear-gradient(var(--accent-pastel),var(--accent-pastel));background-repeat:no-repeat;background-position:0 86%;background-size:0% 34%;
  transition:background-size .4s cubic-bezier(.2,.7,.2,1),transform .22s ease;transform-origin:left center}
.layout.split .item .label{font-size:clamp(28px,4.8vw,42px);font-weight:700}
@media (hover:hover){ .item:hover .label{background-size:100% 34%;transform:scale(1.035)} }
.item:active .label{transform:scale(.96)}
.item.active{order:-1}
.item.active .label{background-size:100% 34%;font-weight:700}
.layout.split .item:not(.active){filter:blur(5px);opacity:.38}
@media (hover:hover){ .layout.split .item:not(.active):hover{filter:blur(0);opacity:1} }

/* ───────── detail pane ───────── */
.detail-pane{flex:0 0 0%;opacity:0;overflow:hidden;transition:flex-basis .55s cubic-bezier(.2,.7,.2,1),opacity .4s ease}
.layout.split .detail-pane{flex:1 1 60%;opacity:1;overflow:visible}

.detail-topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:var(--navblur);border-bottom:1px solid var(--line)}
.detail-topbar-inner{padding:0 28px;height:50px;display:flex;align-items:center;justify-content:flex-end}
.close-btn{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
@media (hover:hover){ .close-btn:hover{color:var(--ink)} }

.container{max-width:620px;padding-inline:28px}
.detail-empty{min-height:60vh}

.jumpbar{position:sticky;top:50px;z-index:19;background:var(--bg);border-bottom:1px solid var(--line)}
.jumpbar-inner{padding:10px 28px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jumpbar-inner::-webkit-scrollbar{display:none}
.jump{all:unset;flex:none;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s,border-color .2s;box-sizing:border-box}
.jump.active{color:var(--ink);background:var(--accent-pastel);border-color:transparent}

.hero{padding-block:48px 8px}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.01em;margin-bottom:12px}
.hero h1{font-size:clamp(28px,5vw,40px);line-height:1.1}

.section{padding-block:60px}
.section.alt{background:var(--bg-alt)}
.step-label{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.01em;margin-bottom:14px}
.section h2{font-size:clamp(23px,3.6vw,29px);line-height:1.3;margin-bottom:20px;transition:color .25s ease,transform .25s ease;transform-origin:left center}
.section .body-text{font-size:16px;line-height:1.95;color:var(--ink);opacity:.92;margin-bottom:22px;transition:color .25s ease,transform .25s ease;transform-origin:left center}
.section .body-text b{font-weight:700}
.section .body-text:last-of-type{margin-bottom:32px}
@media (hover:hover){
  .section h2:hover{color:var(--accent);transform:scale(1.02)}
  .section .body-text:hover{color:var(--accent);opacity:1;transform:scale(1.008)}
}

.howto-list{list-style:none;margin:0 0 34px;padding:0;display:flex;flex-direction:column;gap:16px}
.howto-list li{display:flex;align-items:baseline;gap:12px;font-size:16px;line-height:1.8;color:var(--ink);flex-wrap:wrap}
.howto-list b{font-weight:700}
.howto-tag{flex:none;display:inline-block;min-width:60px;text-align:center;font-size:13px;font-weight:700;color:var(--ink);background:var(--accent-pastel);padding:5px 12px;border-radius:999px}
.howto-text{flex:1 1 240px}
@media (hover:hover){ .howto-list li:hover{color:var(--accent)} }

.shot{background:var(--bg-alt);border-radius:20px;padding:18px}
.section.alt .shot{background:var(--bg)}
.shot img{border-radius:12px;border:1px solid var(--line);box-shadow:0 20px 50px -22px rgba(0,0,0,.35);transition:transform .3s ease,box-shadow .3s ease}
@media (hover:hover){ .shot img:hover{transform:scale(1.015);box-shadow:0 26px 60px -20px rgba(0,0,0,.4)} }

.format-group{display:flex;flex-direction:column;gap:14px;margin:28px 0}
.format-card{background:var(--bg-alt);border-radius:16px;padding:22px 24px}
.section.alt .format-card{background:var(--bg)}
.format-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--ink);background:var(--accent-pastel);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.format-sub{margin-top:16px}
.format-sub:first-of-type{margin-top:0}
.format-sub-label{display:inline-block;min-width:60px;text-align:center;font-size:13px;font-weight:700;color:var(--ink);background:var(--accent-pastel);padding:4px 10px;border-radius:999px;margin-bottom:10px}
.format-pattern{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5}
.format-example{font-size:16px;color:var(--muted);margin-top:6px}
.format-legend{font-size:16px;color:var(--muted);line-height:1.9}
.format-legend b{color:var(--ink);font-weight:700}

.field-list{display:flex;flex-direction:column;margin:28px 0}
.field-row{padding-block:20px;border-top:1px solid var(--line)}
.field-row:first-child{border-top:none;padding-top:0}
.field-term{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px;transition:color .25s ease,transform .25s ease;transform-origin:left center}
.field-desc{font-size:16px;line-height:1.8;color:var(--muted);transition:color .25s ease,transform .25s ease;transform-origin:left center}
.field-desc b{color:var(--ink);font-weight:700}
@media (hover:hover){
  .field-row:hover .field-term{color:var(--accent);transform:scale(1.02)}
  .field-row:hover .field-desc{color:var(--ink);transform:scale(1.008)}
}

.note{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.note-label{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.note p{font-size:16px;line-height:1.7;color:var(--muted)}
.note.warn .note-label{color:#d9534f}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .note.warn .note-label{color:#ff6961} }
:root[data-theme="dark"] .note.warn .note-label{color:#ff6961}

footer.endnote{padding-block:40px}
footer.endnote p{font-size:13px;color:var(--muted)}

.price-card{background:var(--bg-alt);border-radius:16px;padding:8px 20px;margin:14px 0 24px;overflow-x:auto}
.section.alt .price-card{background:var(--bg)}
.price-table{width:100%;border-collapse:collapse;table-layout:fixed}
.price-table th{text-align:center;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.03em;padding:12px 10px;border-bottom:1px solid var(--line)}
.price-table th:first-child,.price-table td:first-child{text-align:left;width:46%}
.price-table td{font-size:16px;padding:10px;border-bottom:1px solid var(--line);color:var(--ink);text-align:center}
.price-table td.num{font-weight:600;font-variant-numeric:tabular-nums}
.price-table tr:last-child td{border-bottom:none}
@media (hover:hover){ .price-table tbody tr:hover td{background:var(--accent-pastel)} }
.price-table tr.grp-a td{background:rgba(255,209,64,.3)}
.price-table tr.grp-b td{background:rgba(94,158,214,.18)}
.price-table tr.grp-c td{background:rgba(110,181,126,.18)}

.sms-card{background:var(--bg-alt);border-radius:16px;padding:26px 28px;margin:20px 0}
.section.alt .sms-card{background:var(--bg)}
.sms-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:16px}
.sms-card p{font-size:16px;line-height:1.9;color:var(--ink);margin-bottom:14px}
.sms-card p:last-child{margin-bottom:0}
.sms-card .sms-sub{font-weight:700;margin-bottom:6px}
.sms-card .sms-muted{color:var(--muted);font-size:13px}

.calc-card{background:var(--bg-alt);border-radius:16px;padding:24px 28px;margin:20px 0}
.section.alt .calc-card{background:var(--bg)}
.calc-card .calc-row{display:flex;align-items:baseline;gap:14px;font-size:16px;line-height:1.9;color:var(--ink);padding-block:7px;border-top:1px solid var(--line)}
.calc-card .calc-row:first-child{border-top:none}
.calc-card .calc-label{flex:none;color:var(--muted);min-width:118px}
.calc-card .calc-expr{font-variant-numeric:tabular-nums}
.calc-card .calc-expr b{font-weight:700;color:var(--ink)}
.calc-card .calc-row.result .calc-expr b{color:var(--accent)}

.cal-card{background:var(--bg-alt);border-radius:16px;padding:20px 22px;margin:20px 0}
.section.alt .cal-card{background:var(--bg)}
.cal-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;font-size:13px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:7px}
.cal-swatch{width:14px;height:14px;border-radius:4px;display:inline-block}

.alert-critical{display:flex;gap:18px;align-items:flex-start;background:rgba(217,83,79,.07);border:1.5px solid rgba(217,83,79,.35);border-radius:18px;padding:24px 26px;margin:28px 0}
.alert-critical .alert-icon-wrap{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:alertPulseRing 2.4s ease-in-out infinite}
.alert-critical svg{width:30px;height:30px;display:block}
.alert-critical .alert-body h3{font-size:16px;font-weight:700;color:#d9534f;margin-bottom:8px}
.alert-critical .alert-body p{font-size:16px;line-height:1.8;color:var(--ink)}
.alert-critical .alert-body p b{font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .alert-critical .alert-body h3{color:#ff6961} }
:root[data-theme="dark"] .alert-critical .alert-body h3{color:#ff6961}
@keyframes alertShake{0%{transform:translateX(0) rotate(0)}15%{transform:translateX(-7px) rotate(-6deg)}30%{transform:translateX(6px) rotate(5deg)}45%{transform:translateX(-5px) rotate(-4deg)}60%{transform:translateX(4px) rotate(3deg)}75%{transform:translateX(-2px) rotate(-2deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes alertPulseRing{0%{box-shadow:0 0 0 0 rgba(217,83,79,.4)}70%{box-shadow:0 0 0 16px rgba(217,83,79,0)}100%{box-shadow:0 0 0 0 rgba(217,83,79,0)}}
.reveal.in .alert-critical{animation:alertShake .7s ease}
@media (prefers-reduced-motion: reduce){ .alert-critical,.alert-critical .alert-icon-wrap{animation:none} }

.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:translateY(0)}
@media (prefers-reduced-motion: reduce){ .reveal{opacity:1;transform:none;transition:none} }

/* ───────── narrow screens: stack instead of split ───────── */
@media (max-width:860px){
  .layout.split{flex-direction:column}
  .layout.split .list-pane{position:sticky;top:0;align-self:auto;height:auto;width:100%;padding:14px 20px;background:var(--bg);z-index:21;border-bottom:1px solid var(--line);flex:0 0 auto}
  .layout.split .list-inner{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:22px;max-width:none;scrollbar-width:none}
  .layout.split .list-inner::-webkit-scrollbar{display:none}
  .layout.split .item{padding-block:4px;flex:none}
  .layout.split .item .label{font-size:15px;white-space:nowrap}
  .layout.split .detail-pane{flex:1 1 auto;width:100%}
  .detail-topbar{top:49px}
  .jumpbar{top:95px}
}
@media (max-width:480px){
  .list-pane{padding-block:11vh 8vh}
  .section{padding-block:40px}
  .shot{padding:12px;border-radius:16px}
}
</style>
</head>
<body>

<div class="layout" id="layout">
  <aside class="list-pane">
    <div class="list-inner" id="listInner">
      <div class="glow" id="glow"></div>
      <button class="item" data-key="login"><span class="label">로그인</span></button>
      <button class="item" data-key="class-create"><span class="label">반 생성</span></button>
      <button class="item" data-key="textbook-purchase"><span class="label">교재 구매 관리</span></button>
      <button class="item" data-key="reservation"><span class="label">예약 관리</span></button>
      <button class="item" data-key="student-manage"><span class="label">학생 관리</span></button>
      <button class="item" data-key="tuition"><span class="label">교육비 관리</span></button>
      <button class="item" data-key="refund"><span class="label">환불 관리</span></button>
      <button class="item" data-key="payment"><span class="label">결제관리</span></button>
      <button class="item" data-key="counsel-history"><span class="label">상담이력</span></button>
      <button class="item" data-key="message"><span class="label">메시지</span></button>
      <button class="item" data-key="promotion"><span class="label">진급관리</span></button>
    </div>
  </aside>

  <section class="detail-pane" id="detailPane">
    <div class="detail-topbar"><div class="detail-topbar-inner"><button class="close-btn" id="closeBtn">✕ 닫기</button></div></div>
    <div id="detailBody"></div>
  </section>
</div>

<template id="tpl-login">
  <div class="jumpbar">
    <div class="jumpbar-inner" id="jumpbar">
      <button class="jump" data-target="step-1">1. 로그인</button>
      <button class="jump" data-target="step-2">2. 인증</button>
      <button class="jump" data-target="step-3">3. OTP 앱</button>
      <button class="jump" data-target="step-4">4. 첫 화면</button>
    </div>
  </div>

  <header class="hero">
    <div class="container">
      <div class="eyebrow">1장 · 처음 로그인하기</div>
      <h1>iMS, 처음부터 차근차근</h1>
    </div>
  </header>

  <section class="section reveal" id="step-1" style="scroll-margin-top:106px">
    <div class="container">
      <div class="step-label">Step 01</div>
      <h2>아이디와 비밀번호로 로그인하세요</h2>
      <p class="body-text">iMS 주소로 들어가면 이 화면이 떠요. 본사에서 발급해준 ID와 PW를 입력하고 <b>Sign in</b>을 누르세요. 아이디가 없다면 본사 담당자에게 발급을 요청하면 돼요.</p>
      <div class="shot"><img src="img/login.png" alt="iMS 로그인 화면"></div>
      <div class="note warn">
        <span class="note-label">주의</span>
        <p>아이디·비밀번호는 본인만 써야 해요. 다른 사람에게 알려주거나 같이 쓰면 안 돼요.</p>
      </div>
    </div>
  </section>

  <section class="section alt reveal" id="step-2" style="scroll-margin-top:106px">
    <div class="container">
      <div class="step-label">Step 02</div>
      <h2>한 번 더, 보안 인증을 거쳐요</h2>
      <p class="body-text">아이디·비밀번호가 맞아도 바로 들어가지지 않고, 이 화면이 한 번 더 떠요. 빈칸에 <b>6자리 숫자(OTP 코드)</b>를 입력해야 하는데, 이 숫자는 휴대폰 앱에서 1분마다 새로 바뀌어요. 그래서 화면에 적힌 숫자가 아니라, 내 휴대폰 앱을 직접 열어서 지금 뜨는 숫자를 봐야 해요.</p>
      <div class="shot"><img src="img/otp.png" alt="2단계 인증 화면"></div>
      <div class="note">
        <span class="note-label">팁</span>
        <p>로그인할 때마다 숫자가 다시 바뀌어요. 이 화면이 뜨면 그때 휴대폰 앱을 열어서 숫자를 확인하세요.</p>
      </div>
    </div>
  </section>

  <section class="section reveal" id="step-3" style="scroll-margin-top:106px">
    <div class="container">
      <div class="step-label">Step 03</div>
      <h2>인증 번호는 이 앱에서 받아요</h2>
      <p class="body-text">2번 화면의 숫자를 받으려면 휴대폰에 <b>Google Authenticator</b>(구글 OTP) 앱이 있어야 해요. 앱스토어나 플레이스토어에서 "구글 OTP" 또는 "Google Authenticator"로 검색해서 설치하세요. 이미 설치돼 있다면 이 단계는 건너뛰어도 돼요.</p>
      <div class="shot"><img src="img/otp-app.png" alt="Google Authenticator 앱스토어 화면"></div>
    </div>
  </section>

  <section class="section alt reveal" id="step-4" style="scroll-margin-top:106px">
    <div class="container">
      <div class="step-label">Step 04</div>
      <h2>이제 첫 화면을 확인할 차례예요</h2>
      <p class="body-text">인증 코드까지 맞으면 로그인이 끝나고 이 화면이 떠요. 기본으로 <b>학생상세조회</b> 화면이 열려 있어요.</p>

<script>
(function(){
  var layout = document.getElementById('layout');
  var detailBody = document.getElementById('detailBody');
  var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var closeBtn = document.getElementById('closeBtn');
  var revealIO = null;
  var spyIO = null;

  function clearObservers(){
    if(revealIO){ revealIO.disconnect(); revealIO = null; }
    if(spyIO){ spyIO.disconnect(); spyIO = null; }
  }

  function wireDetailScripts(){
    var sections = Array.prototype.slice.call(detailBody.querySelectorAll('.reveal'));
    revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('in'); });
    }, {threshold:.12});
    sections.forEach(function(s){ revealIO.observe(s); });

    var jumps = Array.prototype.slice.call(detailBody.querySelectorAll('.jump'));
    jumps.forEach(function(btn){
      btn.addEventListener('click', function(){
        var target = detailBody.querySelector('#' + btn.dataset.target);
        if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
    spyIO = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          jumps.forEach(function(b){ b.classList.toggle('active', b.dataset.target === e.target.id); });
        }
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    sections.forEach(function(s){ spyIO.observe(s); });
  }

  function renderDetail(key){
    clearObservers();
    var tpl = document.getElementById('tpl-' + key);
    detailBody.innerHTML = '';
    if(tpl){
      detailBody.appendChild(tpl.content.cloneNode(true));
      wireDetailScripts();
    } else {
      var blank = document.createElement('div');
      blank.className = 'detail-empty';
      detailBody.appendChild(blank);
    }
  }

  function select(key){
    items.forEach(function(it){ it.classList.toggle('active', it.dataset.key === key); });
    layout.classList.add('split');
    renderDetail(key);
    window.scrollTo(0,0);
  }

  function deselect(){
    items.forEach(function(it){ it.classList.remove('active'); });
    layout.classList.remove('split');
    clearObservers();
    detailBody.innerHTML = '';
  }

  items.forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.classList.contains('active')){ deselect(); }
      else { select(btn.dataset.key); }
    });
  });
  closeBtn.addEventListener('click', deselect);

  var listInner = document.getElementById('listInner');
  var glow = document.getElementById('glow');
  listInner.addEventListener('mousemove', function(e){
    var r = listInner.getBoundingClientRect();
    glow.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    glow.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
})();
</script>
